<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>MX游戏盒子</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body class="fgb-lobby-toy">
<main class="fgb-shell fgb-lobby-toy-shell">
  <header id="fgb-topbar" class="fgb-lobby-topbar"></header>

  <div class="fgb-toy-page">
    <div class="fgb-toy-top-row">
    <section class="fgb-toy-scoreboards" aria-label="挑战排行榜">
      <header class="fgb-toy-scoreboards-head">
        <div class="fgb-toy-scoreboards-head-main">
          <h2 class="fgb-toy-zone-title">挑战排行榜</h2>
          <p class="fgb-toy-zone-sub">今日前三名 · 全家冲榜看这里</p>
        </div>
        <div class="fgb-toy-stat-chip fgb-toy-stat-chip-recent" id="stat-strip" aria-label="我的战绩">
          <span class="fgb-toy-stat-chip-label">最近一局</span>
          <span class="fgb-toy-stat-chip-value fgb-toy-stat-recent" id="stat-recent">—</span>
        </div>
      </header>
      <div class="fgb-toy-scoreboards-grid">
        <div class="fgb-toy-leaderboard fgb-toy-leaderboard-daily">
          <div class="fgb-toy-leaderboard-head">
            <span class="fgb-toy-leaderboard-icon" aria-hidden="true">🏆</span>
            <h3 class="fgb-toy-leaderboard-title">专注力挑战榜</h3>
          </div>
          <div class="fgb-toy-stat-chip fgb-toy-stat-chip-rank">
            <span class="fgb-toy-stat-chip-label">我的专注力名次</span>
            <span class="fgb-toy-stat-chip-value" id="stat-rank">—</span>
          </div>
          <ol class="fgb-podium-list fgb-toy-podium-list fgb-toy-leaderboard-list" id="podium-list"></ol>
          <a class="fgb-toy-board-link fgb-toy-board-link-btn" href="/daily/leaderboard">完整榜 →</a>
        </div>
        <div class="fgb-toy-leaderboard fgb-toy-leaderboard-yuwen">
          <div class="fgb-toy-leaderboard-head">
            <span class="fgb-toy-leaderboard-icon" aria-hidden="true">🏆</span>
            <h3 class="fgb-toy-leaderboard-title">语文挑战榜</h3>
          </div>
          <div class="fgb-toy-stat-chip fgb-toy-stat-chip-rank fgb-toy-stat-chip-yuwen">
            <span class="fgb-toy-stat-chip-label">我的语文名次</span>
            <span class="fgb-toy-stat-chip-value" id="stat-yuwen">—</span>
          </div>
          <ol class="fgb-podium-list fgb-toy-podium-list fgb-toy-leaderboard-list" id="yuwen-podium"></ol>
          <a class="fgb-toy-board-link fgb-toy-board-link-btn" href="/yuwen-daily/leaderboard">完整榜 →</a>
        </div>
      </div>
      <p class="fgb-toy-scoreboards-foot">
        <a class="fgb-toy-board-link fgb-toy-board-link-all" href="/leaderboard">总排行榜（全部游戏）→</a>
      </p>
    </section>

      <aside class="fgb-toy-challenge-rail fgb-toy-challenges-band" aria-label="今日挑战">
        <header class="fgb-toy-rail-head fgb-toy-band-head">
          <h2 class="fgb-toy-zone-title">今日挑战</h2>
          <p class="fgb-toy-zone-sub">每天一局，全家一起冲榜</p>
        </header>

        <article class="fgb-toy-challenge-pack">
          <a class="fgb-toy-challenge-card fgb-toy-challenge-daily" href="/daily" id="daily-card">
            <span class="fgb-toy-challenge-badge">专注力</span>
            <h3>每日专注力挑战</h3>
            <p class="fgb-toy-challenge-progress" id="daily-progress">加载中…</p>
            <span class="fgb-toy-challenge-cta" id="daily-cta">开始挑战</span>
          </a>
        </article>

        <article class="fgb-toy-challenge-pack">
          <a class="fgb-toy-challenge-card fgb-toy-challenge-yuwen" href="/yuwen-daily" id="yuwen-daily-card">
            <span class="fgb-toy-challenge-badge">语文</span>
            <h3>每日语文挑战</h3>
            <p class="fgb-toy-challenge-progress" id="yuwen-progress">加载中…</p>
            <span class="fgb-toy-challenge-cta" id="yuwen-cta">开始挑战</span>
          </a>
        </article>
      </aside>
    </div>

    <section class="fgb-toy-games-zone" aria-label="游戏库">
      <header class="fgb-toy-zone-head">
        <h2 class="fgb-toy-zone-title">游戏库</h2>
        <p class="fgb-toy-zone-sub">点封面即开玩 · 方向键可切换焦点</p>
      </header>
      <div class="fgb-toy-shelf-stage">
        <div class="fgb-toy-shelf-plank" aria-hidden="true"></div>
        <div id="game-list" class="fgb-toy-shelf-grid" role="list"></div>
      </div>
    </section>

    <p class="fgb-toy-admin"><a href="/admin">管理</a></p>
  </div>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script src="/js/fgb-home.js"></script>
<script>
(function () {
  var list = document.getElementById("game-list");

  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    showUser: true,
    console: false,
    toyLobby: true,
  });

  function renderGames(games) {
    if (window.FGBHome && FGBHome.renderGameShelf) {
      FGBHome.renderGameShelf(list, games);
      return;
    }
  }

  function maybeOfferClaim(me) {
    if (!me || !me.loggedIn || !me.claimAvailable) return;
    if (sessionStorage.getItem("fgb_claim_declined") === "1") return;
    if (typeof FGBUI === "undefined" || !FGBUI.askConfirm) return;
    FGBUI.askConfirm("本机有未认领的旧成绩，是否认领到当前账号？", function () {
      FGB.claimTerminal().then(function () {
        if (FGBUI.toast) FGBUI.toast("已认领本机旧成绩", "ok");
        refreshSummary();
      }).catch(function (err) {
        if (FGBUI.toast) FGBUI.toast((err && err.message) || "认领失败", "err");
      });
    }, function () {
      sessionStorage.setItem("fgb_claim_declined", "1");
    });
  }

  function renderSummary(s) {
    if (!s) return;
    var me = s.me || {};
    document.getElementById("stat-rank").textContent = me.dailyRank ? ("#" + me.dailyRank) : "未上榜";
    var yuwen = s.yuwenDaily || {};
    document.getElementById("stat-yuwen").textContent = yuwen.rank ? ("#" + yuwen.rank) : "未上榜";
    var recent = s.recent;
    document.getElementById("stat-recent").textContent = recent
      ? ((recent.gameTitle || "") + " · " + (recent.display || ""))
      : "暂无";
    document.getElementById("daily-progress").textContent = (s.daily && s.daily.myProgressLabel) || "—";
    var cta = document.getElementById("daily-cta");
    var c = (s.daily && s.daily.cta) || "start";
    cta.textContent = c === "view" ? "查看挑战" : (c === "continue" ? "继续挑战" : "开始挑战");
    var ol = document.getElementById("podium-list");
    ol.innerHTML = "";
    var podium = s.podium || [];
    if (!podium.length) {
      ol.innerHTML = "<li class=\"fgb-toy-empty\">还没有成绩，去做每日专注力挑战吧</li>";
    } else {
      podium.forEach(function (p) {
        var li = document.createElement("li");
        var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
        var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
        var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
        var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
        li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
        ol.appendChild(li);
      });
    }
    var yol = document.getElementById("yuwen-podium");
    yol.innerHTML = "";
    document.getElementById("yuwen-progress").textContent = yuwen.myProgressLabel || "—";
    var yc = document.getElementById("yuwen-cta");
    var ycta = yuwen.cta || "start";
    yc.textContent = ycta === "view" ? "查看成绩" : (ycta === "continue" ? "继续挑战" : "开始挑战");
    var ypodium = s.yuwenPodium || [];
    if (!ypodium.length) {
      yol.innerHTML = "<li class=\"fgb-toy-empty\">还没有成绩，去做每日语文挑战吧</li>";
      return;
    }
    ypodium.forEach(function (p) {
      var li = document.createElement("li");
      var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
      var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
      var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
      var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
      li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
      yol.appendChild(li);
    });
  }

  function refreshSummary() {
    return FGB.loadLobbySummary().then(renderSummary);
  }

  FGB.authMe().then(function (me) {
    if (me && me.loggedIn) {
      return FGB.ensureTerminalFromUser(me.username).then(function () {
        return FGB.authMe().then(function (me2) {
          maybeOfferClaim(me2 || me);
        });
      }).catch(function () {
        maybeOfferClaim(me);
      });
    }
  }).catch(function () {
    /* guest: hall stays public */
  }).then(refreshSummary);

  fetch(FGB.url("/api/v1/games")).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!data || !data.games) return;
    renderGames(data.games);
  }).catch(function () {});
})();
</script>
</body>
</html>
