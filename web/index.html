<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body>
<main class="fgb-shell">
  <header class="fgb-topbar">
    <div>
      <h1 class="fgb-brand">家庭<em>游戏盒</em></h1>
      <span class="fgb-page-kicker">竞技厅</span>
    </div>
    <div class="fgb-nav">
      <div class="fgb-chip" id="user-chip" hidden>你好，<strong id="user-name">—</strong>
        <a href="#" id="logout-btn" style="margin-left:6px;color:var(--muted);font-size:.85rem">退出</a>
      </div>
      <span id="auth-links">
        <a class="fgb-nav-link" href="/login">登录</a>
        <a class="fgb-nav-link" href="/register">注册</a>
      </span>
      <a class="fgb-nav-link" href="/daily/leaderboard">专注力挑战榜</a>
      <a class="fgb-nav-link" href="/yuwen-daily/leaderboard">语文挑战榜</a>
      <a class="fgb-nav-link" href="/leaderboard">排行榜</a>
    </div>
  </header>

  <section class="fgb-stat-strip" id="stat-strip" aria-label="我的战绩">
    <div class="cell">
      <div class="label">专注力名次</div>
      <div class="value" id="stat-rank">—</div>
    </div>
    <div class="cell">
      <div class="label">语文名次</div>
      <div class="value" id="stat-yuwen">—</div>
    </div>
    <div class="cell">
      <div class="label">最近一局</div>
      <div class="value" id="stat-recent">—</div>
    </div>
  </section>

  <section class="fgb-arena-split">
    <a class="fgb-card fgb-card-daily" href="/daily" id="daily-card">
      <div class="tag">今日对决</div>
      <h2>每日专注力挑战</h2>
      <p id="daily-progress">加载中…</p>
      <span class="fgb-cta-daily" id="daily-cta">开始挑战</span>
    </a>
    <div class="fgb-panel fgb-panel-pad">
      <h3 class="fgb-page-kicker" style="margin:0 0 .5rem">专注力挑战榜</h3>
      <ol class="fgb-podium-list" id="podium-list"></ol>
      <a class="fgb-nav-link" href="/daily/leaderboard">完整榜 →</a>
    </div>
  </section>

  <section class="fgb-arena-split">
    <a class="fgb-card fgb-card-yuwen" href="/yuwen-daily" id="yuwen-daily-card">
      <div class="tag">今日对决</div>
      <h2>每日语文挑战</h2>
      <p id="yuwen-progress">加载中…</p>
      <span class="fgb-cta-daily" id="yuwen-cta">开始挑战</span>
    </a>
    <div class="fgb-panel fgb-panel-pad">
      <h3 class="fgb-page-kicker" style="margin:0 0 .5rem">语文挑战榜</h3>
      <ol class="fgb-podium-list" id="yuwen-podium"></ol>
      <a class="fgb-nav-link" href="/yuwen-daily/leaderboard">完整榜 →</a>
    </div>
  </section>

  <h2 class="fgb-page-title" style="font-size:1.65rem;margin-bottom:.35rem">自由训练</h2>
  <p class="fgb-lead" style="margin-bottom:.85rem">单机练习，冲击个人最佳。</p>
  <div id="game-list" class="fgb-grid-train"></div>
  <p class="fgb-footer-link"><a href="/admin">管理</a></p>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script>
(function () {
  var userChip = document.getElementById("user-chip");
  var userName = document.getElementById("user-name");
  var authLinks = document.getElementById("auth-links");
  var list = document.getElementById("game-list");

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function renderGames(games) {
    list.innerHTML = "";
    (games || []).forEach(function (g) {
      var a = document.createElement("a");
      a.className = "fgb-train-card" + (g.extra && g.extra.kind === "reference" ? " is-ref" : "");
      a.setAttribute("data-game-id", g.id);
      var path = g.path || "";
      a.href = FGB.url(path.charAt(0) === "/" ? path : "/" + path);
      a.innerHTML =
        "<strong>" + esc(g.title) + "</strong>" +
        "<p class=\"meta\">" + esc(g.subtitle || (g.extra && g.extra.kind === "reference" ? "工具" : "训练")) + "</p>" +
        "<span class=\"go\">" + (g.extra && g.extra.kind === "reference" ? "查阅" : "进入") + "</span>";
      list.appendChild(a);
    });
    if (!(games || []).length) {
      list.innerHTML = "<p class=\"fgb-lead\">暂无可用游戏</p>";
    }
  }

  function showLoggedIn(username) {
    userName.textContent = username;
    userChip.hidden = false;
    authLinks.hidden = true;
  }

  function showLoggedOut() {
    userChip.hidden = true;
    authLinks.hidden = false;
  }

  function maybeOfferClaim(me) {
    if (!me || !me.loggedIn || !me.claimAvailable) return;
    if (sessionStorage.getItem("fgb_claim_declined") === "1") return;
    if (typeof FGBUI === "undefined" || !FGBUI.askConfirm) return;
    FGBUI.askConfirm("本机有未认领的旧成绩，是否认领到当前账号？", function () {
      FGB.claimTerminal().then(function () {
        if (FGBUI.toast) FGBUI.toast("已认领本机旧成绩", "ok");
        refreshSummary();
      }).catch(function (err) {
        if (FGBUI.toast) FGBUI.toast((err && err.message) || "认领失败", "err");
      });
    }, function () {
      sessionStorage.setItem("fgb_claim_declined", "1");
    });
  }

  function renderSummary(s) {
    if (!s) return;
    var me = s.me || {};
    document.getElementById("stat-rank").textContent = me.dailyRank ? ("#" + me.dailyRank) : "未上榜";
    var yuwen = s.yuwenDaily || {};
    document.getElementById("stat-yuwen").textContent = yuwen.rank ? ("#" + yuwen.rank) : "未上榜";
    var recent = s.recent;
    document.getElementById("stat-recent").textContent = recent
      ? ((recent.gameTitle || "") + " · " + (recent.display || ""))
      : "暂无";
    document.getElementById("daily-progress").textContent = (s.daily && s.daily.myProgressLabel) || "—";
    var cta = document.getElementById("daily-cta");
    var c = (s.daily && s.daily.cta) || "start";
    cta.textContent = c === "view" ? "查看挑战" : (c === "continue" ? "继续挑战" : "开始挑战");
    var ol = document.getElementById("podium-list");
    ol.innerHTML = "";
    var podium = s.podium || [];
    if (!podium.length) {
      ol.innerHTML = "<li style=\"color:var(--muted)\">还没有成绩，去做每日专注力挑战吧</li>";
    } else {
    podium.forEach(function (p) {
      var li = document.createElement("li");
      var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
      var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
      var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
      var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
      li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
      ol.appendChild(li);
    });
    }
    var yol = document.getElementById("yuwen-podium");
    yol.innerHTML = "";
    document.getElementById("yuwen-progress").textContent = yuwen.myProgressLabel || "—";
    var yc = document.getElementById("yuwen-cta");
    var ycta = yuwen.cta || "start";
    yc.textContent = ycta === "view" ? "查看成绩" : (ycta === "continue" ? "继续挑战" : "开始挑战");
    var ypodium = s.yuwenPodium || [];
    if (!ypodium.length) {
      yol.innerHTML = "<li style=\"color:var(--muted)\">还没有成绩，去做每日语文挑战吧</li>";
      return;
    }
    ypodium.forEach(function (p) {
      var li = document.createElement("li");
      var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
      var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
      var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
      var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
      li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
      yol.appendChild(li);
    });
  }

  function refreshSummary() {
    return FGB.loadLobbySummary().then(renderSummary);
  }

  document.getElementById("logout-btn").addEventListener("click", function (e) {
    e.preventDefault();
    FGB.logout().then(function () {
      showLoggedOut();
      refreshSummary();
    }).catch(function () {
      showLoggedOut();
    });
  });

  FGB.authMe().then(function (me) {
    if (me && me.loggedIn) {
      showLoggedIn(me.username || "—");
      maybeOfferClaim(me);
    } else {
      showLoggedOut();
    }
  }).catch(function () {
    showLoggedOut();
  }).then(refreshSummary);

  fetch(FGB.url("/api/v1/games")).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!data || !data.games) return;
    renderGames(data.games);
  }).catch(function () {});
})();
</script>
</body>
</html>
