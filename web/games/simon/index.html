<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon Says · 老师说</title>
<link rel="stylesheet" href="/css/fgb-theme.css">

<script>
(function fgbDailyHead() {
  if (/(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
    document.documentElement.classList.add("fgb-daily-mode");
  }
})();
</script>
<style>
html.fgb-daily-mode #view-home,
html.fgb-daily-mode #view-setup,
html.fgb-daily-mode #view-casual,
html.fgb-daily-mode #view-size,
html.fgb-daily-mode #view-result,
html.fgb-daily-mode #view-casual-done { display: none !important; }
html.fgb-daily-mode .mode-btn,
html.fgb-daily-mode #casual-extra,
html.fgb-daily-mode #btn-next,
html.fgb-daily-mode #btn-restart { display: none !important; }
/* 闯关 iframe 内：收掉重复顶栏/长说明；棋盘边长由 --fgb-board 动态计算 */
html.fgb-daily-mode {
  --fgb-board: 280px;
  height: 100%;
}
html.fgb-daily-mode body { height: 100%; }
html.fgb-daily-mode:not(.fgb-play-scroll),
html.fgb-daily-mode:not(.fgb-play-scroll) body { overflow: hidden; }
html.fgb-daily-mode.fgb-play-scroll,
html.fgb-daily-mode.fgb-play-scroll body { overflow: auto; }
html.fgb-daily-mode .wrap {
  width: 100%;
  max-width: none;
  padding: 0.35rem var(--play-gutter) 0.4rem;
  box-sizing: border-box;
}
html.fgb-daily-mode #view-play > .topbar { display: none !important; }
html.fgb-daily-mode #fgb-topbar,
html.fgb-daily-mode #fgb-result { display: none !important; }
html.fgb-daily-mode #view-play > .hint { margin: 0 0 0.3rem; min-height: 1.05em; font-size: 0.88rem; }
html.fgb-daily-mode #view-play .tip { display: none !important; }
html.fgb-daily-mode .clover {
  width: var(--fgb-board) !important;
  height: var(--fgb-board) !important;
}
html.fgb-daily-mode .clover-wrap { margin: 0.1rem 0 0.3rem; }
html.fgb-daily-mode .leaf { font-size: calc(var(--fgb-board) * 0.11) !important; }
html.fgb-daily-mode .card-board-wrap {
  max-width: var(--fgb-board) !important;
  margin-left: auto;
  margin-right: auto;
}
html.fgb-daily-mode .num-card .val {
  font-size: calc(var(--fgb-board) * 0.14) !important;
}
html.fgb-daily-mode .num-card .expr {
  font-size: calc(var(--fgb-board) * 0.045) !important;
}
html.fgb-daily-mode .sudoku-wrap { width: min(100%, var(--fgb-board)) !important; }
html.fgb-daily-mode .sudoku { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .maze-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .grid-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .diff-panels { max-height: var(--fgb-board) !important; overflow: auto; }
html.fgb-daily-mode .board {
  width: min(100%, var(--fgb-board)) !important;
  max-height: var(--fgb-board) !important;
}
</style>

<style>

:root {
  --ink: #1a2b3c;
  --muted: #5c6d7e;
  --line: rgba(26, 43, 60, 0.12);
  --paper: #fff8f0;
  --panel: #ffffff;
  --accent: #2ecc71;
  --accent-deep: #1a9f68;
  --warn: #e8a04a;
  --danger: #e07060;
  --shadow: 0 12px 32px rgba(45, 62, 90, 0.12);
  --display: "Fraunces", "Songti SC", "Palatino Linotype", serif;
  --sans: "DM Sans", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --play-gutter: clamp(0.75rem, 3vw, 1.5rem);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: transparent;
}
body::before {
  content: none;
}
.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: none;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 1.6rem var(--play-gutter) 3rem;
  min-width: 0;
}
.wrap.wide { width: 100%; max-width: none; }
.hidden { display: none !important; }
/* 平板横屏 / 矮视口：压缩边距；棋盘尺寸由各游戏用 vmin 吃满短边 */
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .wrap { padding: .55rem var(--play-gutter) 1rem; }
  .wrap.wide { width: 100%; max-width: none; }
  h1 { font-size: clamp(1.45rem, 4.5vw, 2.1rem); margin-bottom: .2rem; }
  .sub { margin: 0 0 .65rem; font-size: .88rem; }
  .card { padding: .75rem; border-radius: 14px; }
  .topbar { margin-bottom: .45rem; }
  .hint { margin: 0 0 .4rem; min-height: 1.1em; font-size: .88rem; }
  .actions { margin-top: .3rem; gap: .35rem; }
  .actions button { padding: .35rem .2rem; font-size: .82rem; border-radius: 10px; }
  .task-bar { padding: .45rem .65rem; margin-bottom: .5rem; }
  .mode-btn { padding: .75rem .85rem; }
  .choice-row { margin: .65rem 0; }
  .choice-row button { padding: .65rem .3rem; }
}
h1 {
  font-family: var(--display);
  font-size: clamp(2rem, 8vw, 3rem);
  margin: 0 0 .35rem;
  letter-spacing: -.02em;
  line-height: .95;
}
h1 em { font-style: italic; color: var(--accent); }
.sub { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.5; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 1.15rem;
}
.mode-grid { display: grid; gap: .75rem; }
.mode-btn {
  text-align: left;
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 1rem 1.05rem;
  background: #fff;
  cursor: pointer;
  font: inherit;
  color: inherit;
  box-shadow: 0 6px 0 rgba(26, 43, 60, 0.05);
  transition: transform .15s ease, border-color .15s ease;
}
.mode-btn:hover { transform: translateY(-1px); border-color: rgba(62,207,142,.4); }
.mode-btn strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
.mode-btn span { color: var(--muted); font-size: .92rem; }
.choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1rem 0; }
.choice-row.two { grid-template-columns: repeat(2, 1fr); }
.choice-row.six { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) {
  .choice-row.six { grid-template-columns: repeat(6, 1fr); }
}
.choice-row button {
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: .9rem .4rem;
  font: inherit;
  font-weight: 700;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(26, 43, 60, 0.05);
}
.choice-row button.active {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  border-color: transparent;
}
.primary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: .85rem 1rem;
  font: inherit;
  font-weight: 700;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  cursor: pointer;
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem 1rem;
  font: inherit;
  font-weight: 600;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  margin-bottom: .9rem;
  color: var(--muted);
  font-size: .92rem;
  flex-wrap: wrap;
}
.topbar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.hint {
  text-align: center;
  min-height: 1.4em;
  margin: 0 0 .8rem;
  color: var(--muted);
  font-size: .95rem;
}
.hint.err { color: var(--danger); }
.hint.ok { color: var(--accent); font-weight: 600; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .55rem;
  margin-top: .75rem;
}
.actions.two { grid-template-columns: repeat(2, 1fr); }
.actions button {
  border: 2px solid rgba(26, 43, 60, 0.1);
  border-radius: 999px;
  min-height: 44px;
  padding: .65rem .4rem;
  font: inherit;
  font-weight: 700;
  background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
  box-shadow: 0 4px 0 rgba(26, 43, 60, 0.06);
  cursor: pointer;
  color: var(--ink);
}
.actions button.warn {
  color: #a65c10;
  background: linear-gradient(180deg, #fffef9 0%, #fff5e6 100%);
  border-color: rgba(232, 160, 74, 0.35);
}
.actions button.danger {
  color: #b33d30;
  background: linear-gradient(180deg, #fff5f5 0%, #ffe8e6 100%);
  border-color: rgba(224, 112, 96, 0.35);
}
.stats-list { margin: .8rem 0 1.1rem; padding: 0; list-style: none; }
.stats-list li {
  display: flex;
  justify-content: space-between;
  padding: .55rem 0;
  border-bottom: 1px dashed var(--line);
}
.stats-list li:last-child { border-bottom: 0; }
.linkish {
  display: inline-block;
  margin-top: 1rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.grid-cells {
  display: grid;
  gap: 2px;
  margin: .5rem 0;
  user-select: none;
}
.grid-wrap { overflow: auto; max-height: min(82vmin, 720px); }
.grid-cells button, .grid-cells .cell {
  -webkit-appearance: none;
  appearance: none;
  border: 2px solid rgba(26, 43, 60, 0.08);
  border-radius: 8px;
  background: linear-gradient(180deg, #fff 0%, #f6fffb 100%);
  color: var(--ink);
  box-shadow: 0 2px 0 rgba(26, 43, 60, 0.05);
  font: inherit;
  font-weight: 600;
  aspect-ratio: 1;
  /* Safari：button+flex 会多出一块空壳，改用 grid 居中 */
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  margin: 0;
  min-height: 0;
  min-width: 0;
  line-height: 1;
}
.grid-cells button.marked {
  background: rgba(62,207,142,.18);
  color: var(--accent);
  text-decoration: line-through;
}
.grid-cells button.found {
  background: rgba(62,207,142,.25);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.grid-cells button.wrong-flash {
  animation: wrongFlash .5s ease;
}
@keyframes wrongFlash {
  0%, 100% { background: linear-gradient(180deg, #fff 0%, #f6fffb 100%); }
  50% { background: rgba(224, 112, 96, 0.35); }
}
.task-bar {
  text-align: center;
  padding: .65rem .8rem;
  border-radius: 16px;
  background: linear-gradient(180deg, #e8fff4 0%, #d4fce8 100%);
  border: 2px solid rgba(46, 204, 113, 0.25);
  color: var(--accent-deep);
  font-weight: 700;
  margin-bottom: .85rem;
}


.confirm-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(6, 14, 12, 0.72);
  backdrop-filter: blur(2px);
}
.confirm-mask.hidden { display: none !important; }
.confirm-box {
  width: min(360px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 1.25rem 1.2rem 1.1rem;
}
.confirm-box p {
  margin: 0 0 1.1rem;
  font-size: 1.05rem;
  line-height: 1.45;
  color: var(--ink);
}
.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .55rem;
}
.confirm-actions button {
  border-radius: 14px;
  padding: .75rem 1rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.confirm-actions .confirm-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.confirm-actions .confirm-ok {
  border: 0;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
}
/* 统一完成反馈：轻量、不挡操作 */
.celebrate {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translate(-50%, -12px) scale(.92);
  z-index: 1100;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
}
.celebrate.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.celebrate-pill {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .7rem 1.1rem .7rem .85rem;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid rgba(62,207,142,.35);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  color: var(--accent);
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap;
}
.celebrate-mark {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  line-height: 1;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(62,207,142,.35);
  animation: celebratePulse .55s ease;
}
@keyframes celebratePulse {
  0% { box-shadow: 0 0 0 0 rgba(15,122,90,.4); transform: scale(.85); }
  60% { box-shadow: 0 0 0 10px rgba(15,122,90,0); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0 rgba(15,122,90,0); transform: scale(1); }
}
.celebrate-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}
.celebrate.show .celebrate-burst {
  animation: celebrateBurst .5s ease forwards;
}
.celebrate-burst:nth-child(1) { --dx: -28px; --dy: -22px; }
.celebrate-burst:nth-child(2) { --dx: 30px; --dy: -18px; background: #c9a227; }
.celebrate-burst:nth-child(3) { --dx: -22px; --dy: 24px; background: #9a4a12; }
.celebrate-burst:nth-child(4) { --dx: 26px; --dy: 20px; background: #2471a3; }
.celebrate-burst:nth-child(5) { --dx: 0; --dy: -32px; background: #7d3c98; }
.celebrate-burst:nth-child(6) { --dx: 0; --dy: 30px; background: #1e8449; }
@keyframes celebrateBurst {
  0% { opacity: .9; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
}


.command-box {
  text-align: center;
  font-family: var(--display);
  font-size: clamp(1.4rem, 5vw, 2rem);
  min-height: 3.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  margin: .5rem 0 1rem;
  border-radius: 16px;
  background: linear-gradient(180deg, #fff 0%, #f8f0ff 100%);
  border: 2px dashed var(--line);
  line-height: 1.35;
  transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.command-box.is-speaking {
  border-color: var(--accent);
  border-style: solid;
  box-shadow: 0 0 0 3px rgba(62,207,142,.22);
  animation: simonSpeakPulse .7s ease-in-out infinite;
}
@keyframes simonSpeakPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
.tts-note {
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  min-height: 1.2em;
  margin: -.35rem 0 .55rem;
}
.action-grid {
  --action-gap: .65rem;
  --card: calc((100% - 3 * var(--action-gap)) / 4);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--action-gap);
  max-width: 560px;
  margin: 0 auto;
}
.action-grid button {
  border: 2px solid rgba(26, 43, 60, 0.1);
  border-radius: 22px;
  aspect-ratio: 1;
  width: var(--card);
  flex: 0 0 var(--card);
  padding: .25rem;
  font: inherit;
  font-weight: 700;
  font-size: clamp(1.8rem, 6.2vw, 2.35rem);
  background: linear-gradient(180deg, #fff 0%, #f5f0ff 100%);
  box-shadow: 0 6px 0 rgba(26, 43, 60, 0.08);
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.2;
}
.action-grid button:nth-child(1) { margin-left: calc((var(--card) + var(--action-gap)) / 2); }
.action-grid button:nth-child(3) { margin-right: calc((var(--card) + var(--action-gap)) / 2); }
.action-grid button:active { transform: scale(.96); }
.action-grid button:disabled { opacity: .4; cursor: not-allowed; }
.feedback {
  text-align: center;
  min-height: 1.5em;
  margin-top: .75rem;
  font-weight: 600;
}
.toggles { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
.toggles label {
  display: flex; align-items: center; gap: .35rem;
  font-size: .9rem; color: var(--muted);
}
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .command-box {
    min-height: 2.4em;
    padding: .65rem;
    margin: .25rem 0 .55rem;
    font-size: clamp(1.15rem, 3.5vw, 1.55rem);
  }
  .action-grid { --action-gap: .5rem; max-width: 520px; }
  .action-grid button { border-radius: 18px; font-size: clamp(1.55rem, 4.8vw, 2rem); }
  .feedback { margin-top: .4rem; min-height: 1.2em; }
}

</style>
</head>
<body data-game-skin="simon">
<header id="fgb-topbar"></header>
<div class="wrap">

  <section id="view-home">
    <h1>Simon<em> Says</em></h1>
    <p class="sub">老师说 · 只有带「老师说」的指令才做动作，否则保持不动。训练听觉专注与冲动控制。</p>
    <div class="card mode-grid">
      <button type="button" class="mode-btn" id="btn-casual">
        <strong>休闲模式</strong>
        <span>单题练习，可看解析</span>
      </button>
      <button type="button" class="mode-btn" id="btn-challenge">
        <strong>挑战模式</strong>
        <span>20 / 30 / 50 试次，统计冲动错误</span>
      </button>
    </div>
    <a class="linkish fgb-nav-link" href="/">← 返回大厅</a>
  </section>

  <section id="view-casual" class="hidden">
    <h1>休闲</h1>
    <p class="sub">选择难度后开始练习。</p>
    <div class="card">
      <p style="margin:0 0 .5rem;color:var(--muted);font-size:.9rem">难度</p>
      <div class="choice-row six" id="casual-diff">
<button type="button" data-diff="intro">入门<br><span style="font-weight:500;font-size:.72rem">15 试次</span></button>
<button type="button" data-diff="simple">简单<br><span style="font-weight:500;font-size:.72rem">20 试次</span></button>
<button type="button" data-diff="normal" class="active">普通<br><span style="font-weight:500;font-size:.72rem">30 试次</span></button>
<button type="button" data-diff="hard">困难<br><span style="font-weight:500;font-size:.72rem">40 试次</span></button>
<button type="button" data-diff="master">大师<br><span style="font-weight:500;font-size:.72rem">50 试次</span></button>
<button type="button" data-diff="god">大神<br><span style="font-weight:500;font-size:.72rem">60 试次</span></button>
</div>
      <button type="button" class="primary" id="btn-casual-start">开始</button>
      <div style="height:.65rem"></div>
      <button type="button" class="ghost" id="btn-casual-back" style="width:100%">返回</button>
    </div>
  </section>

  <section id="view-setup" class="hidden">
    <h1>挑战</h1>
    <p class="sub">选择难度与规则。</p>
    <div class="card">
      <p style="margin:0 0 .5rem;color:var(--muted);font-size:.9rem">难度</p>
      <div class="choice-row six" id="diff-choices">
<button type="button" data-diff="intro">入门<br><span style="font-weight:500;font-size:.72rem">15 试次</span></button>
<button type="button" data-diff="simple">简单<br><span style="font-weight:500;font-size:.72rem">20 试次</span></button>
<button type="button" data-diff="normal" class="active">普通<br><span style="font-weight:500;font-size:.72rem">30 试次</span></button>
<button type="button" data-diff="hard">困难<br><span style="font-weight:500;font-size:.72rem">40 试次</span></button>
<button type="button" data-diff="master">大师<br><span style="font-weight:500;font-size:.72rem">50 试次</span></button>
<button type="button" data-diff="god">大神<br><span style="font-weight:500;font-size:.72rem">60 试次</span></button>
</div>
      <div class="toggles">
        <label><input type="checkbox" id="chk-reverse"> 反向规则（老师说→不做）</label>
      </div>
      <p style="margin:0 0 .85rem;color:var(--muted);font-size:.82rem">挑战固定用预置 MP3 播指令（不显示文字）；播放中可作答，听不全可能答错。</p>
      <button type="button" class="primary" id="btn-start">开始挑战</button>
      <div style="height:.65rem"></div>
      <button type="button" class="ghost" id="btn-setup-back" style="width:100%">返回</button>
    </div>
  </section>

  <section id="view-play" class="hidden">
    <div class="topbar">
      <span id="play-label">休闲</span>
      <span id="play-progress">1 / 20</span>
      <span>连击 <strong id="streak">0</strong></span>

    <div class="card">

      <div class="tts-note" id="tts-note"></div>
      <div class="action-grid" id="actions">
        <button type="button" data-act="hands_up">↑ 举手</button>
        <button type="button" data-act="turn_left">← 左转</button>
        <button type="button" data-act="jump">跳</button>
        <button type="button" data-act="turn_right">→ 右转</button>
        <button type="button" data-act="squat">蹲</button>
        <button type="button" data-act="hands_down">↓ 放下</button>
        <button type="button" id="btn-wait">不动</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button type="button" class="danger" id="btn-exit">退出</button>
        <button type="button" id="btn-next">下一题</button>
      </div>
    </div>
  </section>

  <section id="view-result" class="hidden">
    <h1>结算</h1>

      <ul class="stats-list">
        <li><span>试次</span><strong id="st-total">0</strong></li>
        <li><span>正确</span><strong id="st-correct">0</strong></li>
        <li><span>正确率</span><strong id="st-rate">0%</strong></li>
        <li><span>冲动错误</span><strong id="st-impulse">0</strong></li>
        <li><span>有效试次遗漏</span><strong id="st-miss">0</strong></li>
        <li><span>平均反应时</span><strong id="st-rt">—</strong></li>
        <li><span>最长连击</span><strong id="st-streak">0</strong></li>
      </ul>
      <button type="button" class="primary" id="btn-again">再来一局</button>
      <div style="height:.65rem"></div>
      <button type="button" class="ghost" id="btn-home" style="width:100%">回首页</button>
    </div>
  </section>

</div>

  <div class="fgb-result-box">
    <h2 id="fgb-result-title" class="fgb-result-title">本局结束</h2>
    <p id="fgb-result-sub" class="fgb-result-sub"></p>

  <span class="celebrate-burst"></span>

  <span class="celebrate-burst"></span>
  <span class="celebrate-burst"></span>
  <span class="celebrate-burst"></span>

<script src="/js/fgb-daily.js"></script>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script src="/js/fgb-audio-clips.js"></script>
<script>
/* fgb-daily-boot */

function showView(views, name) {
  if (window.__FGB_IS_DAILY__ && name !== "play") return;
  Object.keys(views).forEach(function (k) {
    views[k].classList.toggle("hidden", k !== name);
  });
}
function fmtTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  var r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0;
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function randInt(n) { return (Math.random() * n) | 0; }
function pick(arr) { return arr[randInt(arr.length)]; }

var FGB_MSG = {
  exitConfirm: "退出并查看统计？",
  done: "完成！",
  sessionDone: "本局完成！"
};

var _confirmCb = null;
function askConfirm(message, onYes, onNo) {
  var mask = document.getElementById("confirm-mask");
  var msg = document.getElementById("confirm-msg");
  if (!mask || !msg) {
    // 无页面内弹层时走 FGBUI；禁止回退到浏览器 confirm/alert
    if (window.FGBUI && FGBUI.askConfirm) {
      FGBUI.askConfirm(message, onYes, onNo);
      return;
    }
    if (onYes) onYes();
    return;
  }
  msg.textContent = message || FGB_MSG.exitConfirm;
  _confirmCb = { yes: onYes, no: onNo };
  mask.classList.remove("hidden");
}
function _resolveConfirm(ok) {
  var mask = document.getElementById("confirm-mask");
  if (mask) mask.classList.add("hidden");
  var cb = _confirmCb;
  _confirmCb = null;
  if (!cb) return;
  if (ok && cb.yes) cb.yes();
  if (!ok && cb.no) cb.no();
}
(function bindConfirmUI() {
  var ok = document.getElementById("confirm-ok");
  var cancel = document.getElementById("confirm-cancel");
  var mask = document.getElementById("confirm-mask");
  if (ok) ok.addEventListener("click", function () { _resolveConfirm(true); });
  if (cancel) cancel.addEventListener("click", function () { _resolveConfirm(false); });
  if (mask) mask.addEventListener("click", function (e) {
    if (e.target === mask) _resolveConfirm(false);
  });
})();

var _celebrateTimer = null;
/** 轻量完成动效：不挡点击，约 0.5s 自动消失 */
function celebrate(message) {
  var el = document.getElementById("celebrate");
  var text = document.getElementById("celebrate-text");
  if (!el || !text) return;
  text.textContent = message || FGB_MSG.done;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  el.classList.remove("hidden");
  if (_celebrateTimer) clearTimeout(_celebrateTimer);
  _celebrateTimer = setTimeout(function () {
    el.classList.remove("show");
    setTimeout(function () { el.classList.add("hidden"); }, 200);
  }, 520);
}
/** 播完成动效后短延迟回调；默认 480ms，几乎不拖慢下一局 */
function celebrateThen(message, callback, delayMs) {
  celebrate(message);
  var wait = delayMs == null ? 480 : delayMs;
  setTimeout(function () {
    if (callback) callback();
  }, wait);
}


(function () {
  var qraw = location.search || "";
  if (!/(?:^|[?&])daily=1(?:&|$)/.test(qraw)) return;
  var params = new URLSearchParams(qraw);
  var q = {
    daily: true,
    runId: params.get("runId") || "",
    tier: params.get("tier") || "normal",
    seed: Number(params.get("seed") || "0") || 1,
    stageIndex: Number(params.get("stageIndex") || "0") || 0,
  };
  window.__FGB_DAILY_Q__ = q;
  window.__FGB_IS_DAILY__ = true;
  document.documentElement.classList.add("fgb-daily-mode");
  if (window.FGBDaily && FGBDaily.installMathRandom) {
    FGBDaily.installMathRandom(q.seed);
  }
  if (window.FGBDaily && FGBDaily.installFitPlay) {
    FGBDaily.installFitPlay({ min: 168, max: 480, pad: 16 });
  }
  window.fgbSubmitScore = function (payload) {
    var ms = 0;
    if (payload && payload.metrics && payload.metrics.timeMs != null) ms = payload.metrics.timeMs | 0;
    if (window.FGBDaily && FGBDaily.notifyStageDone) FGBDaily.notifyStageDone(ms);
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-stage-done", timeMs: ms }, "*");
    }
  };
  function abortDaily(e) {
    if (e) {
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      else e.stopPropagation();
    }
    if (window.FGBDaily && FGBDaily.notifyAbort) FGBDaily.notifyAbort();
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-abort" }, "*");
    }
  }
  var base = (window.__FGB_BASE__ || "").replace(/\/$/, "");
  var homeSel = 'a.linkish[href="/"], a[href="/"]';
  if (base) {
    homeSel += ', a.linkish[href="' + base + '/"], a[href="' + base + '/"], a.linkish[href="' + base + '"], a[href="' + base + '"]';
  }
  document.querySelectorAll(homeSel).forEach(function (a) {
    a.textContent = "退出本关";
    a.href = "#";
    a.addEventListener("click", abortDaily);
  });
  // 游戏内退出按钮：每日模式禁止 show(home)，须通知父页结束挑战
  ["btn-exit", "btn-exit-casual", "btn-exit-challenge", "btn-quit"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("click", abortDaily, true);
  });
})();

/* fgb-game-chrome-boot */
(function () {
  if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) return;
  var el = document.getElementById("fgb-topbar");
  if (!el || !window.FGBShell || !FGBShell.mountTopbar) return;
  FGBShell.mountTopbar(el, {
    title: "Simon Says · 老师说",
    showBack: true,
    backHref: "/",
    showUser: true
  });
})();


(function () {
  var ACTIONS = {
    hands_up: "举手",
    hands_down: "放下",
    turn_left: "向左转",
    turn_right: "向右转",
    jump: "跳",
    squat: "蹲"
  };
  var PREFIXES = ["老师说：", "老师说，", "老师说 "];

  var views = {
    home: document.getElementById("view-home"),
    casual: document.getElementById("view-casual"),
    setup: document.getElementById("view-setup"),
    play: document.getElementById("view-play"),
    result: document.getElementById("view-result")
  };

  var mode = "casual";
  var diffKey = "normal";
  var DIFF = {
    intro: { label: "入门", trials: 15 },
    simple: { label: "简单", trials: 20 },
    normal: { label: "普通", trials: 30 },
    hard: { label: "困难", trials: 40 },
    master: { label: "大师", trials: 50 },
    god: { label: "大神", trials: 60 }
  };

  function mergeDifficultyConfig(cfg) {
    if (!cfg || !cfg.tiers) return;
    Object.keys(cfg.tiers).forEach(function (k) {
      if (!DIFF[k]) return;
      Object.assign(DIFF[k], cfg.tiers[k]);
    });
  }
  function ensureDifficulty(thenFn) {
    if (!window.FGB || !FGB.loadDifficulty) { thenFn(); return; }
    FGB.loadDifficulty("simon").then(function (cfg) {
      mergeDifficultyConfig(cfg);
      thenFn();
    });
  }

  function diffLabel(key) {
    var d = DIFF[key];
    return d ? d.label : key;
  }

  function applyDiff() {
    var d = DIFF[diffKey] || DIFF.normal;
    trialTotal = d.trials;
  }

  var reverse = false;
  var useTts = true;
  var trialTotal = 30;
  var trialIndex = 0;
  var trial = null;
  var phase = "idle";
  var reactStart = 0;
  var reactTimer = null;
  var presentTimer = null;
  var penaltyTimer = null;
  var streak = 0;
  var maxStreak = 0;
  var correct = 0;
  var impulse = 0;
  var miss = 0;
  var rts = [];
  var commandEl = document.getElementById("command");
  var ttsNoteEl = document.getElementById("tts-note");
  var clipIds = [];
  Object.keys(ACTIONS).forEach(function (act) {
    ["", "say_"].forEach(function (prefix) {
      clipIds.push(prefix + act);
    });
  });
  var audioClips = FgbAudioClips({
    resolveUrl: function (name) { return clipUrl(name); },
    clipIds: clipIds,
  });
  audioClips.warmNetwork();
  (function wireEarlyAudioUnlock() {
    function onGesture() {
      audioClips.unlock();
    }
    ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
      document.addEventListener(ev, onGesture, { once: true, passive: true });
    });
  })();

  function clipName(trialObj) {
    if (!trialObj) return "";
    return (trialObj.hasPrefix ? "say_" : "") + trialObj.action;
  }

  function clipUrl(name) {
    // 相对当前页：/games/simon/index.html → audio/xxx.mp3（兼容 ROOT_PATH）
    return "audio/" + name + ".mp3";
  }

  function setSpeaking(on) {
    if (!commandEl) return;
    commandEl.classList.toggle("is-speaking", !!on);
  }

  function setTtsNote(msg) {
    if (ttsNoteEl) ttsNoteEl.textContent = msg || "";
  }

  function setCommandHint(msg) {
    if (commandEl) commandEl.textContent = msg || "";
  }

  /** 语音模式默认不露指令文字；失败或关闭语音时再显示 */
  function revealCommandText(trialObj) {
    if (!trialObj) return;
    setCommandHint(trialObj.text);
  }

  function stopSpeak() {
    setSpeaking(false);
    audioClips.stop();
  }

  /** 用户手势下解锁 WebView 音频（Android 内置浏览器常见限制） */
  function unlockAudio() {
    audioClips.unlock();
  }

  function playClip(name, onDone) {
    if (!name) {
      if (onDone) onDone(false);
      return false;
    }
    if (audioClips.isBad(name)) {
      if (onDone) onDone(false);
      return false;
    }
    setSpeaking(true);
    return audioClips.play(name, function (ok) {
      setSpeaking(false);
      if (ok) setTtsNote("");
      if (onDone) onDone(ok);
    });
  }

  /** 统一播预置 MP3；失败则露出文字（不再用 speechSynthesis） */
  function speak(text, trialObj, onDone) {
    if (!useTts) {
      revealCommandText(trialObj);
      if (onDone) onDone(false);
      return;
    }
    stopSpeak();
    setCommandHint("听指令…");
    var name = clipName(trialObj);
    var finished = false;
    function finish(ok) {
      if (finished) return;
      finished = true;
      if (onDone) onDone(ok);
    }
    function visualFallback() {
      revealCommandText(trialObj);
      setTtsNote("语音未加载，请看上方文字");
      setSpeaking(true);
      setTimeout(function () {
        setSpeaking(false);
        finish(false);
      }, 1100);
    }
    if (!name) {
      visualFallback();
      return;
    }
    playClip(name, function (ok) {
      if (ok) {
        setCommandHint("请反应");
        finish(true);
      } else {
        visualFallback();
      }
    });
  }

  function preloadClips() {
    if (!audioClips.allReady()) setTtsNote("音效准备中…");
    return audioClips.preloadAll().then(function () {
      if (audioClips.allReady()) setTtsNote("");
    });
  }

  function buildTrial() {
    var keys = Object.keys(ACTIONS);
    var action = keys[randInt(keys.length)];
    var hasPrefix = Math.random() < 0.55;
    var text;
    if (hasPrefix) text = pick(PREFIXES) + ACTIONS[action];
    else text = ACTIONS[action];
    var shouldAct = hasPrefix;
    if (reverse) shouldAct = !shouldAct;
    return { text: text, action: action, hasPrefix: hasPrefix, shouldAct: shouldAct };
  }

  function setActionsEnabled(on) {
    document.querySelectorAll("#actions button").forEach(function (b) {
      b.disabled = !on;
    });
    document.getElementById("btn-wait").disabled = !on;
  }

  function clearPenalty() {
    if (penaltyTimer) { clearInterval(penaltyTimer); penaltyTimer = null; }
  }

  function countPenalty(baseText) {
    clearPenalty();
    var left = 2;
    showFeedback(baseText + " · " + left, false);
    penaltyTimer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearPenalty();
        return;
      }
      showFeedback(baseText + " · " + left, false);
    }, 1000);
  }

  function showFeedback(msg, ok) {
    var el = document.getElementById("feedback");
    el.textContent = msg;
    el.style.color = ok ? "var(--accent-deep)" : "var(--danger)";
  }

  function judge(actionTaken) {
    if (phase !== "react") return;
    phase = "done";
    clearTimeout(reactTimer);
    stopSpeak();
    setActionsEnabled(false);
    var rt = Math.round(performance.now() - reactStart);
    var ok = false;
    var wrongText = "";
    if (trial.shouldAct) {
      if (actionTaken && actionTaken === trial.action) {
        ok = true;
        rts.push(rt);
      } else if (!actionTaken) {
        miss++;
      }
    } else {
      if (!actionTaken) ok = true;
      else impulse++;
    }
    if (ok) {
      correct++;
      streak++;
      if (streak > maxStreak) maxStreak = streak;
      showFeedback("正确" + (trial.shouldAct && actionTaken ? " · " + rt + " ms" : ""), true);
    } else {
      streak = 0;
      wrongText = trial.shouldAct
        ? ("错误或遗漏 · 应「" + ACTIONS[trial.action] + "」")
        : "冲动错误 · 不应动作";
      showFeedback(wrongText, false);
    }
    document.getElementById("streak").textContent = String(streak);
    if (mode === "challenge") {
      if (!ok) countPenalty(wrongText);
      setTimeout(nextTrial, ok ? 900 : 2000);
    }
  }

  function shuffleActions() {
    var grid = document.getElementById("actions");
    var buttons = [].slice.call(grid.querySelectorAll("button"));
    for (var i = buttons.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = buttons[i];
      buttons[i] = buttons[j];
      buttons[j] = swap;
    }
    buttons.forEach(function (btn) { grid.appendChild(btn); });
  }

  function presentTrial() {
    clearPenalty();
    shuffleActions();
    trial = buildTrial();
    // 开播即可作答：抢答允许，听不全自负
    phase = "react";
    if (useTts) setCommandHint("听指令…");
    else revealCommandText(trial);
    showFeedback("", true);
    setActionsEnabled(true);
    reactStart = performance.now();
    if (presentTimer) clearTimeout(presentTimer);
    clearTimeout(reactTimer);
    speak(trial.text, trial, function () {
      if (phase !== "react") return;
      if (useTts) setCommandHint("请反应");
      // 播完后再给 5 秒作答；超时判不动
      reactTimer = setTimeout(function () {
        if (phase === "react") judge(null);
      }, 5000);
    });
  }

  function nextTrial() {
    trialIndex++;
    if (mode === "challenge" && trialIndex >= trialTotal) {
      finishChallenge();
      return;
    }
    document.getElementById("play-progress").textContent =
      (trialIndex + 1) + " / " + (mode === "challenge" ? trialTotal : "∞");
    presentTrial();
  }

  function updateRuleBar() {
    document.getElementById("rule-bar").textContent = reverse
      ? "反向：老师说 → 不做；无「老师说」→ 做"
      : "老师说 → 做动作；无「老师说」→ 不动";
  }

  function startCasual() {
    ensureDifficulty(function () {
      mode = "casual";
      applyDiff();
      reverse = false;
      useTts = true;
      unlockAudio();
      showView(views, "play");
      Promise.resolve(preloadClips()).then(function () {
        trialIndex = 0;
        correct = 0; impulse = 0; miss = 0; streak = 0; maxStreak = 0; rts = [];
        document.getElementById("play-label").textContent = "休闲 · " + diffLabel(diffKey);
        document.getElementById("btn-next").style.display = "";
        setTtsNote("");
        updateRuleBar();
        nextTrial();
      });
    });
  }

  function startChallenge() {
    ensureDifficulty(function () {
      mode = "challenge";
      applyDiff();
      reverse = document.getElementById("chk-reverse").checked;
      // 与休闲一致：挑战固定 MP3，不再提供「关语音看字」
      useTts = true;
      unlockAudio();
      showView(views, "play");
      var run = window.FGBUI && FGBUI.runWhenPlayable
        ? FGBUI.runWhenPlayable.bind(FGBUI)
        : function (prep, done) { Promise.resolve(prep()).then(function () { done(Date.now()); }); };
      run(function () {
        return Promise.resolve(preloadClips()).then(function () {
          trialIndex = 0;
          correct = 0; impulse = 0; miss = 0; streak = 0; maxStreak = 0; rts = [];
          document.getElementById("play-label").textContent = "挑战 · " + diffLabel(diffKey);
          document.getElementById("btn-next").style.display = "none";
          setTtsNote("");
          updateRuleBar();
          nextTrial();
        });
      }, function () {});
    });
  }

  function finishChallenge() {
    clearPenalty();
    clearTimeout(reactTimer);
    if (presentTimer) clearTimeout(presentTimer);
    stopSpeak();
    var total = trialTotal;
    document.getElementById("st-total").textContent = String(total);
    document.getElementById("st-correct").textContent = String(correct);
    document.getElementById("st-rate").textContent = total ? Math.round((correct / total) * 100) + "%" : "0%";
    document.getElementById("st-impulse").textContent = String(impulse);
    document.getElementById("st-miss").textContent = String(miss);
    document.getElementById("st-rt").textContent = rts.length
      ? Math.round(rts.reduce(function (a,b){return a+b;},0)/rts.length) + " ms" : "—";
    document.getElementById("st-streak").textContent = String(maxStreak);
    showView(views, "result");
    celebrate(FGB_MSG.sessionDone);
    if (typeof fgbSubmitScore === "function") fgbSubmitScore({
      gameId: "simon", mode: "challenge", tier: diffKey,
      metrics: { correct: correct, total: total, maxStreak: maxStreak, impulse: impulse, miss: miss }
    });
  }

  document.querySelectorAll("#actions button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      judge(btn.id === "btn-wait" ? null : btn.dataset.act);
    });
  });
  document.getElementById("btn-casual").addEventListener("click", function () { showView(views, "casual"); });
  document.getElementById("btn-casual-back").addEventListener("click", function () { showView(views, "home"); });
  document.getElementById("btn-casual-start").addEventListener("click", startCasual);
  document.getElementById("btn-challenge").addEventListener("click", function () { showView(views, "setup"); });
  document.getElementById("btn-setup-back").addEventListener("click", function () { showView(views, "home"); });
  function bindDiffChoice(selector) {
    document.querySelectorAll(selector).forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(selector).forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        diffKey = btn.dataset.diff;
      });
    });
  }
  bindDiffChoice("#casual-diff button");
  bindDiffChoice("#diff-choices button");
  document.getElementById("btn-start").addEventListener("click", startChallenge);
  document.getElementById("btn-exit").addEventListener("click", function () {
    function doExit() {
      clearTimeout(reactTimer);
      if (presentTimer) clearTimeout(presentTimer);
      stopSpeak();
      if (mode === "challenge" && trialIndex > 0) finishChallenge();
      else showView(views, "home");
    }
    if (mode === "challenge" && trialIndex > 0) {
      askConfirm(FGB_MSG.exitConfirm, doExit);
      return;
    }
    doExit();
  });
  document.getElementById("btn-next").addEventListener("click", function () {
    if (phase === "react") judge(null);
    else nextTrial();
  });
  document.getElementById("btn-again").addEventListener("click", function () { stopSpeak(); showView(views, "setup"); });
  document.getElementById("btn-home").addEventListener("click", function () { stopSpeak(); showView(views, "home"); });

  ensureDifficulty(function () {
    if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
      var dq = window.__FGB_DAILY_Q__ || {};
      if (!dq.tier) dq.tier = (new URLSearchParams(location.search || "")).get("tier") || "normal";
      if (dq.tier && DIFF[dq.tier]) { diffKey = dq.tier; applyDiff(); }
      startChallenge();
    } else {
      showView(views, "home");
    }
  });
})();

</script>
</body>
</html>
