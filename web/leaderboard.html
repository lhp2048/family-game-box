<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排行榜 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body>
<main class="fgb-shell">
  <header class="fgb-topbar">
    <div>
      <a class="fgb-brand" href="/">家庭<em>游戏盒</em></a>
      <span class="fgb-page-kicker">游戏排行</span>
    </div>
    <div class="fgb-nav">
      <a class="fgb-nav-link" href="/">回大厅</a>
      <a class="fgb-nav-link" href="/daily/leaderboard">挑战榜</a>
    </div>
  </header>

  <h1 class="fgb-page-title">排行榜</h1>
  <p class="fgb-lead" id="page-desc">最近 20 条游戏完成记录。</p>

  <div class="fgb-tabs">
    <button type="button" class="fgb-tab is-active" data-view="recent">最近完成</button>
    <button type="button" class="fgb-tab" data-view="global">总榜</button>
    <button type="button" class="fgb-tab" data-view="filtered">分榜</button>
  </div>

  <div class="fgb-filters hidden" id="filters">
    <div>
      <label for="game">游戏</label>
      <select id="game"></select>
    </div>
    <div>
      <label for="mode">模式</label>
      <select id="mode"><option value="challenge">挑战</option><option value="casual">休闲</option></select>
    </div>
    <div>
      <label for="tier">难度</label>
      <select id="tier"></select>
    </div>
  </div>

  <div class="fgb-my-best hidden" id="my-best">加载我的最佳记录…</div>

  <div class="fgb-podium hidden" id="podium" aria-label="前三名"></div>

  <div class="fgb-panel">
    <table class="fgb-table">
      <thead id="board-head"><tr><th class="fgb-rank">#</th><th>昵称</th><th>游戏</th><th>成绩</th><th>时间</th></tr></thead>
      <tbody id="board-body"><tr><td colspan="5" class="fgb-empty">加载中…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script>
(function () {
  var meta = null;
  var view = "recent";
  var gameEl = document.getElementById("game");
  var modeEl = document.getElementById("mode");
  var tierEl = document.getElementById("tier");
  var headEl = document.getElementById("board-head");
  var bodyEl = document.getElementById("board-body");
  var myBestEl = document.getElementById("my-best");
  var filtersEl = document.getElementById("filters");
  var pageDesc = document.getElementById("page-desc");
  var podiumEl = document.getElementById("podium");
  var myTerminal = FGB.getTerminalId();

  var HEADERS = {
    recent: '<tr><th class="fgb-rank">#</th><th>昵称</th><th>游戏</th><th>成绩</th><th>时间</th></tr>',
    global: '<tr><th class="fgb-rank">#</th><th>昵称</th><th>成绩</th><th>时间</th></tr>',
    filtered: '<tr><th class="fgb-rank">#</th><th>昵称</th><th>成绩</th><th>时间</th></tr>'
  };

  function fillSelect(el, items, getValue, getLabel) {
    el.innerHTML = "";
    items.forEach(function (item) {
      var opt = document.createElement("option");
      opt.value = getValue(item);
      opt.textContent = getLabel(item);
      el.appendChild(opt);
    });
  }

  function currentTierOptions() {
    var gid = gameEl.value;
    return (meta.tiers[gid] || []).map(function (tier) {
      return { id: tier, label: (meta.tierLabels[tier] || tier) };
    });
  }

  function refreshTiers() {
    fillSelect(tierEl, currentTierOptions(), function (x) { return x.id; }, function (x) { return x.label; });
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleString("zh-CN"); } catch (e) { return iso; }
  }

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function colCount() {
    return view === "recent" ? 5 : 4;
  }

  function rankCell(rank) {
    var r = rank | 0;
    var cls = "fgb-rank";
    if (r === 1 || r === 2 || r === 3) cls += " fgb-rank-" + r;
    return '<td class="' + cls + '">' + r + "</td>";
  }

  function showEmpty(msg) {
    bodyEl.innerHTML = '<tr><td colspan="' + colCount() + '" class="fgb-empty">' + esc(msg || "暂无记录") + '</td></tr>';
    podiumEl.classList.add("hidden");
    podiumEl.innerHTML = "";
  }

  function renderPodium(items) {
    var top = (items || []).slice(0, 3);
    if (!top.length) {
      podiumEl.classList.add("hidden");
      podiumEl.innerHTML = "";
      return;
    }
    var ICONS = { 1: "🥇", 2: "🥈", 3: "🥉" };
    var TITLES = { 1: "冠军", 2: "亚军", 3: "季军" };
    podiumEl.classList.remove("hidden");
    var order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
    var ranks = top.length >= 3 ? [2, 1, 3] : top.map(function (_, i) { return i + 1; });
    podiumEl.innerHTML = order.map(function (item, i) {
      var r = ranks[i];
      return '<div class="spot fgb-podium-' + r + '"><div class="icon" aria-hidden="true">' +
        ICONS[r] + '</div><div class="title">' + TITLES[r] + '</div><div class="name">' +
        esc(item.nickname) + '</div><div class="score">' + esc(item.display) + "</div></div>";
    }).join("");
  }

  function renderRecentRows(items) {
    if (!items.length) {
      showEmpty("暂无记录，快去玩游戏吧！");
      return;
    }
    renderPodium(items);
    var rest = items.slice(3);
    if (!rest.length) {
      bodyEl.innerHTML = '<tr><td colspan="5" class="fgb-empty">仅前三名 · <a href="/" style="color:var(--accent)">去大厅开玩</a></td></tr>';
      return;
    }
    bodyEl.innerHTML = rest.map(function (item) {
      var cls = item.terminalId === myTerminal ? ' class="fgb-row-me"' : "";
      var sub = esc(item.modeLabel) + " · " + esc(item.tierLabel);
      return "<tr" + cls + ">" + rankCell(item.rank) + "<td>" + esc(item.nickname) + "</td><td>" +
        esc(item.gameTitle) + '<span style="display:block;font-size:.82rem;color:var(--muted);margin-top:2px">' +
        sub + "</span></td><td>" + esc(item.display) + "</td><td>" + fmtTime(item.playedAt) + "</td></tr>";
    }).join("");
  }

  function renderSimpleRows(items) {
    if (!items.length) {
      showEmpty("暂无记录，快去玩游戏吧！");
      return;
    }
    renderPodium(items);
    var rest = items.slice(3);
    if (!rest.length) {
      bodyEl.innerHTML = '<tr><td colspan="' + colCount() + '" class="fgb-empty">仅前三名</td></tr>';
      return;
    }
    bodyEl.innerHTML = rest.map(function (item) {
      var cls = item.terminalId === myTerminal ? ' class="fgb-row-me"' : "";
      return "<tr" + cls + ">" + rankCell(item.rank) + "<td>" + esc(item.nickname) + "</td><td>" +
        esc(item.display) + "</td><td>" + fmtTime(item.playedAt) + "</td></tr>";
    }).join("");
  }

  function loadRecent() {
    showEmpty("加载中…");
    FGB.getRecentLeaderboard(20).then(function (data) {
      renderRecentRows((data && data.items) || []);
    }).catch(function () { showEmpty("加载失败"); });
  }

  function loadGlobal() {
    showEmpty("加载中…");
    FGB.getGlobalLeaderboard(50).then(function (data) {
      renderSimpleRows((data && data.items) || []);
    }).catch(function () { showEmpty("加载失败"); });
  }

  function loadFiltered() {
    var gameId = gameEl.value;
    var mode = modeEl.value;
    var tier = tierEl.value;
    showEmpty("加载中…");
    myBestEl.textContent = "加载我的最佳记录…";
    FGB.getLeaderboard(gameId, mode, tier, 20).then(function (data) {
      renderSimpleRows((data && data.items) || []);
    }).catch(function () { showEmpty("加载失败"); });
    FGB.getBests(gameId).then(function (data) {
      var bests = (((data || {}).bests || {})[gameId] || {})[mode] || {};
      var mine = bests[tier];
      if (!mine) {
        myBestEl.innerHTML = '我的最佳：<strong>暂无记录</strong>';
        return;
      }
      myBestEl.innerHTML = '我的最佳：<strong>' + esc(mine.display) + '</strong> · ' + fmtTime(mine.playedAt);
    }).catch(function () {
      myBestEl.textContent = "尚未注册昵称，请先到大厅设置。";
    });
  }

  function setView(next) {
    view = next;
    document.querySelectorAll(".fgb-tab").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.dataset.view === view);
    });
    headEl.innerHTML = HEADERS[view] || HEADERS.recent;
    var isFiltered = view === "filtered";
    filtersEl.classList.toggle("hidden", !isFiltered);
    myBestEl.classList.toggle("hidden", !isFiltered);
    if (view === "recent") {
      pageDesc.textContent = "最近 20 条游戏完成记录，按时间从新到旧排列。";
      loadRecent();
    } else if (view === "global") {
      pageDesc.textContent = "家庭内所有成绩记录，按时间从新到旧排列。";
      loadGlobal();
    } else {
      pageDesc.textContent = "按游戏、模式与难度查看家庭内最高记录。";
      loadFiltered();
    }
  }

  document.querySelectorAll(".fgb-tab").forEach(function (btn) {
    btn.addEventListener("click", function () { setView(btn.dataset.view); });
  });

  FGB.getRankMeta().then(function (data) {
    meta = data;
    fillSelect(gameEl, data.games || [], function (x) { return x.id; }, function (x) { return x.title; });
    refreshTiers();
    gameEl.addEventListener("change", function () { refreshTiers(); if (view === "filtered") loadFiltered(); });
    modeEl.addEventListener("change", function () { if (view === "filtered") loadFiltered(); });
    tierEl.addEventListener("change", function () { if (view === "filtered") loadFiltered(); });
    setView("recent");
  });
})();
</script>
</body>
</html>
