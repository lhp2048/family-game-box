<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日挑战 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
<style>
.stage-list { margin: 0; padding-left: 1.2rem; color: var(--muted); }
.stage-list li { margin: 0.4rem 0; }
.timers { display: flex; gap: 1rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.timers strong { color: var(--accent); }
.hidden { display: none !important; }
.actions-row { display: flex; gap: 0.65rem; flex-wrap: wrap; margin-top: 0.85rem; }
</style>
</head>
<body>
<main class="fgb-shell">
  <header class="fgb-topbar">
    <div>
      <a class="fgb-brand" href="/">家庭<em>游戏盒</em></a>
      <span class="fgb-page-kicker">每日挑战</span>
    </div>
    <div class="fgb-nav">
      <a class="fgb-nav-link" href="/">回大厅</a>
      <a class="fgb-nav-link" href="/daily/leaderboard">挑战榜</a>
    </div>
  </header>

  <section id="prep">
    <div class="fgb-arena-split">
      <div class="fgb-panel fgb-panel-pad">
        <h1 class="fgb-page-title" style="font-size:1.85rem">每日挑战</h1>
        <p class="fgb-lead" style="margin-bottom:1rem">按顺序通关今日组合，分关计时 + 总计时。中途退出也会记成绩。</p>
        <div class="fgb-err" id="prep-err"></div>
        <ol class="stage-list" id="stage-list"></ol>
        <div class="actions-row">
          <button type="button" class="fgb-cta-daily" id="btn-start">开始挑战</button>
        </div>
      </div>
      <div class="fgb-panel fgb-panel-pad">
        <h3 class="fgb-page-kicker" style="margin:0 0 .5rem">今日榜前三</h3>
        <ol class="fgb-podium-list" id="prep-podium"></ol>
        <a class="fgb-nav-link" href="/daily/leaderboard">完整挑战榜 →</a>
      </div>
    </div>
  </section>

  <section id="play" class="hidden">
    <div class="fgb-hud fgb-panel fgb-panel-pad">
      <div>
        <strong id="stage-label">第 1 / N 关</strong>
        <div style="color:var(--muted);font-size:.9rem;margin-top:4px" id="stage-name">—</div>
      </div>
      <div class="timers">
        <span>本关 <strong id="t-stage">00:00</strong></span>
        <span>总计 <strong id="t-total">00:00</strong></span>
      </div>
      <button type="button" class="fgb-btn-ghost" id="btn-exit">退出</button>
    </div>
    <div class="fgb-frame">
      <iframe id="game-frame" title="每日挑战关卡"></iframe>
    </div>
  </section>

  <section id="result" class="fgb-panel fgb-panel-pad hidden">
    <h1 class="fgb-page-title" style="font-size:1.85rem" id="result-title">挑战结束</h1>
    <p id="result-time" style="font-family:var(--display);font-size:clamp(2rem,8vw,3rem);font-weight:700;margin:.35rem 0;color:var(--accent)">—</p>
    <p style="color:var(--muted)" id="result-summary"></p>
    <p id="result-rank" style="color:var(--muted);margin:.35rem 0 0"></p>
    <ul class="stage-list" id="result-stages"></ul>
    <div class="actions-row">
      <button type="button" class="fgb-cta-daily" id="btn-again">再来一次</button>
      <a class="fgb-btn-ghost" href="/daily/leaderboard">查看挑战榜</a>
      <a class="fgb-btn-ghost" href="/">回大厅</a>
    </div>
  </section>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script>
(function () {
  var PATHS = {
    "24points": "/games/24points/play.html",
    schulte: "/games/schulte/",
    stroop: "/games/stroop/",
    cancel: "/games/cancel/",
    simon: "/games/simon/",
    "spot-diff": "/games/spot-diff/",
    maze: "/games/maze/",
    sudoku: "/games/sudoku/",
  };

  var combo = null;
  var run = null;
  var stageIndex = 0;
  var startedAt = 0;
  var stageEnteredAt = 0;
  var timerId = null;
  var finishing = false;

  function fmt(ms) {
    ms = Math.max(0, ms | 0);
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function show(id) {
    ["prep", "play", "result"].forEach(function (k) {
      document.getElementById(k).classList.toggle("hidden", k !== id);
    });
  }

  function headers() {
    return {
      "Content-Type": "application/json",
      "X-Terminal-Id": FGB.getTerminalId(),
    };
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || "GET",
      headers: Object.assign({}, headers(), opts.headers || {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error((data && data.detail) || res.statusText || "failed");
        return data;
      });
    });
  }

  function tick() {
    var now = Date.now();
    document.getElementById("t-total").textContent = fmt(now - startedAt);
    document.getElementById("t-stage").textContent = fmt(now - stageEnteredAt);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function loadPrepPodium() {
    var ol = document.getElementById("prep-podium");
    if (!ol || !FGB.loadLobbySummary) return;
    FGB.loadLobbySummary().then(function (s) {
      ol.innerHTML = "";
      var podium = (s && s.podium) || [];
      if (!podium.length) {
        ol.innerHTML = "<li style=\"color:var(--muted)\">还没有成绩</li>";
        return;
      }
      podium.forEach(function (p) {
        var li = document.createElement("li");
        var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
        var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
        var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
        var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
        li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
        ol.appendChild(li);
      });
    });
  }

  function loadPrep() {
    show("prep");
    loadPrepPodium();
    api("/api/v1/daily/today").then(function (data) {
      combo = data;
      var ol = document.getElementById("stage-list");
      ol.innerHTML = "";
      (data.stages || []).forEach(function (s) {
        var li = document.createElement("li");
        li.textContent = s.title + " · " + (s.tierLabel || s.tier);
        ol.appendChild(li);
      });
    }).catch(function (e) {
      document.getElementById("prep-err").textContent = e.message || "加载失败";
    });
  }

  function gameUrl(stage, idx, runId) {
    var base = PATHS[stage.gameId];
    if (!base) return "";
    var q = new URLSearchParams({
      daily: "1",
      runId: runId,
      tier: stage.tier || "normal",
      seed: String(stage.seed || 1),
      stageIndex: String(idx),
      _: String(Date.now()),
    });
    var join = base.indexOf("?") >= 0 ? "&" : "?";
    return base + join + q.toString();
  }

  function enterStage(idx) {
    stageIndex = idx;
    var stages = run.stages || [];
    var st = stages[idx];
    document.getElementById("stage-label").textContent = "第 " + (idx + 1) + " / " + stages.length + " 关";
    document.getElementById("stage-name").textContent = st.title + " · " + (st.tierLabel || st.tier);
    stageEnteredAt = Date.now();
    document.getElementById("game-frame").src = gameUrl(st, idx, run.runId);
  }

  function totalMs() { return Date.now() - startedAt; }
  function stageMs() { return Date.now() - stageEnteredAt; }

  function patch(body) {
    return api("/api/v1/daily/runs/" + run.runId, { method: "PATCH", body: body });
  }

  function showResult(finalRun) {
    stopTimer();
    document.getElementById("game-frame").src = "about:blank";
    show("result");
    var finished = finalRun.status === "finished";
    document.getElementById("result-title").textContent = finished ? "全部通关！" : "挑战已退出";
    document.getElementById("result-time").textContent = fmt(finalRun.totalTimeMs);
    document.getElementById("result-summary").textContent =
      "完成 " + finalRun.stagesDone + " 关 · 总用时 " + fmt(finalRun.totalTimeMs);
    document.getElementById("result-rank").textContent = "";
    if (FGB.loadLobbySummary) {
      FGB.loadLobbySummary().then(function (s) {
        var rank = s && s.me && s.me.dailyRank;
        if (rank) document.getElementById("result-rank").textContent = "当前挑战榜第 " + rank + " 名";
      });
    }
    var ul = document.getElementById("result-stages");
    ul.innerHTML = "";
    (finalRun.stageResults || []).forEach(function (s, i) {
      var li = document.createElement("li");
      li.textContent = (i + 1) + ". " + s.gameId + " · " + (s.completed ? "完成" : "未完成") + " · " + fmt(s.timeMs);
      ul.appendChild(li);
    });
  }

  function onStageDone(timeMs) {
    if (finishing || !run) return;
    var stages = run.stages || [];
    var st = stages[stageIndex];
    var last = stageIndex >= stages.length - 1;
    var body = {
      action: last ? "finish" : "stage_done",
      stageIndex: stageIndex,
      timeMs: timeMs,
      totalTimeMs: totalMs(),
      stage: { gameId: st.gameId, tier: st.tier, timeMs: timeMs, completed: true },
    };
    finishing = true;
    patch(body).then(function (updated) {
      run = updated;
      finishing = false;
      if (last) showResult(updated);
      else enterStage(stageIndex + 1);
    }).catch(function (e) {
      finishing = false;
      FGBUI.toast(e.message || "同步失败", "err");
    });
  }

  function doExit() {
    if (!run || finishing) return;
    FGBUI.askConfirm("确定退出？已完成的关卡会记入挑战榜。", function () {
      finishing = true;
      var stages = run.stages || [];
      var st = stages[stageIndex];
      patch({
        action: "exit",
        stageIndex: stageIndex,
        totalTimeMs: totalMs(),
        stage: { gameId: st.gameId, tier: st.tier, timeMs: stageMs(), completed: false },
      }).then(function (updated) {
        finishing = false;
        showResult(updated);
      }).catch(function (e) {
        finishing = false;
        FGBUI.toast(e.message || "退出失败", "err");
      });
    });
  }

  function startRun() {
    document.getElementById("prep-err").textContent = "";
    FGB.ensureRegistered().then(function (user) {
      if (!user) {
        document.getElementById("prep-err").textContent = "请先回大厅设置昵称";
        return;
      }
      return api("/api/v1/daily/runs", { method: "POST" }).then(function (data) {
        run = data;
        startedAt = Date.now();
        show("play");
        stopTimer();
        timerId = setInterval(tick, 250);
        tick();
        enterStage(0);
      });
    }).catch(function (e) {
      document.getElementById("prep-err").textContent = e.message || "无法开始";
    });
  }

  window.addEventListener("message", function (ev) {
    var data = ev.data || {};
    if (data.type === "fgb-daily-stage-done") onStageDone(data.timeMs | 0);
    else if (data.type === "fgb-daily-abort") doExit();
  });

  document.getElementById("btn-start").addEventListener("click", startRun);
  document.getElementById("btn-exit").addEventListener("click", doExit);
  document.getElementById("btn-again").addEventListener("click", function () {
    run = null;
    finishing = false;
    loadPrep();
  });

  loadPrep();
})();
</script>
</body>
</html>
