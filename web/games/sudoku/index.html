<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数独</title>
<link rel="stylesheet" href="/css/fgb-theme.css">

<script>
(function fgbDailyHead() {
  if (/(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
    document.documentElement.classList.add("fgb-daily-mode");
  }
})();
</script>
<style>
html.fgb-daily-mode #view-home,
html.fgb-daily-mode #view-setup,
html.fgb-daily-mode #view-casual,
html.fgb-daily-mode #view-size,
html.fgb-daily-mode #view-result,
html.fgb-daily-mode #view-casual-done { display: none !important; }
html.fgb-daily-mode .mode-btn,
html.fgb-daily-mode #casual-extra,
html.fgb-daily-mode #btn-next,
html.fgb-daily-mode #btn-restart { display: none !important; }
/* 闯关 iframe 内：收掉重复顶栏/长说明；棋盘边长由 --fgb-board 动态计算 */
html.fgb-daily-mode {
  --fgb-board: 280px;
  height: 100%;
}
html.fgb-daily-mode body { height: 100%; }
html.fgb-daily-mode:not(.fgb-play-scroll),
html.fgb-daily-mode:not(.fgb-play-scroll) body { overflow: hidden; }
html.fgb-daily-mode.fgb-play-scroll,
html.fgb-daily-mode.fgb-play-scroll body { overflow: auto; }
html.fgb-daily-mode .wrap {
  width: min(720px, calc(100% - 0.75rem));
  padding: 0.35rem 0 0.4rem;
  box-sizing: border-box;
}
html.fgb-daily-mode #view-play > .topbar { display: none !important; }
html.fgb-daily-mode #fgb-topbar,
html.fgb-daily-mode #fgb-result { display: none !important; }
html.fgb-daily-mode #view-play > .hint { margin: 0 0 0.3rem; min-height: 1.05em; font-size: 0.88rem; }
html.fgb-daily-mode #view-play .tip { display: none !important; }
html.fgb-daily-mode .clover {
  width: var(--fgb-board) !important;
  height: var(--fgb-board) !important;
}
html.fgb-daily-mode .clover-wrap { margin: 0.1rem 0 0.3rem; }
html.fgb-daily-mode .leaf { font-size: calc(var(--fgb-board) * 0.11) !important; }
html.fgb-daily-mode .sudoku-wrap { width: min(100%, var(--fgb-board)) !important; }
html.fgb-daily-mode .sudoku { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .maze-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .grid-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .diff-panels { max-height: var(--fgb-board) !important; overflow: auto; }
html.fgb-daily-mode .board {
  width: min(100%, var(--fgb-board)) !important;
  max-height: var(--fgb-board) !important;
}
</style>

<style>

:root {
  --ink: #e8f2ec;
  --muted: #8fa399;
  --line: rgba(232, 242, 236, 0.12);
  --paper: #0c1411;
  --panel: rgba(18, 32, 28, 0.88);
  --accent: #3ecf8e;
  --accent-deep: #1a9f68;
  --warn: #e8a04a;
  --danger: #e07060;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
  --display: "Fraunces", "Songti SC", "Palatino Linotype", serif;
  --sans: "DM Sans", "PingFang SC", "Microsoft YaHei UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(62, 207, 142, 0.14), transparent 55%),
    radial-gradient(700px 400px at 100% 0%, rgba(232, 160, 74, 0.06), transparent 50%),
    linear-gradient(165deg, #0a1210 0%, #0c1411 45%, #101a16 100%);
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .2;
  background-image:
    linear-gradient(rgba(232,242,236,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,242,236,.03) 1px, transparent 1px);
  background-size: 28px 28px;
}
.wrap { position: relative; z-index: 1; width: min(560px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.6rem 0 3rem; }
.wrap.wide { width: min(720px, calc(100% - 1.5rem)); }
.hidden { display: none !important; }
/* 平板横屏 / 矮视口：压缩边距；棋盘尺寸由各游戏用 vmin 吃满短边 */
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .wrap { padding: .55rem 0 1rem; width: min(560px, calc(100% - 1rem)); }
  .wrap.wide { width: min(960px, calc(100% - 1rem)); }
  h1 { font-size: clamp(1.45rem, 4.5vw, 2.1rem); margin-bottom: .2rem; }
  .sub { margin: 0 0 .65rem; font-size: .88rem; }
  .card { padding: .75rem; border-radius: 14px; }
  .topbar { margin-bottom: .45rem; }
  .hint { margin: 0 0 .4rem; min-height: 1.1em; font-size: .88rem; }
  .actions { margin-top: .3rem; gap: .35rem; }
  .actions button { padding: .35rem .2rem; font-size: .82rem; border-radius: 10px; }
  .task-bar { padding: .45rem .65rem; margin-bottom: .5rem; }
  .mode-btn { padding: .75rem .85rem; }
  .choice-row { margin: .65rem 0; }
  .choice-row button { padding: .65rem .3rem; }
}
h1 {
  font-family: var(--display);
  font-size: clamp(2rem, 8vw, 3rem);
  margin: 0 0 .35rem;
  letter-spacing: -.02em;
  line-height: .95;
}
h1 em { font-style: italic; color: var(--accent); }
.sub { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.5; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 1.15rem;
}
.mode-grid { display: grid; gap: .75rem; }
.mode-btn {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1rem 1.05rem;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .15s ease, border-color .15s ease;
}
.mode-btn:hover { transform: translateY(-1px); border-color: rgba(62,207,142,.4); }
.mode-btn strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
.mode-btn span { color: var(--muted); font-size: .92rem; }
.choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1rem 0; }
.choice-row.two { grid-template-columns: repeat(2, 1fr); }
.choice-row.six { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) {
  .choice-row.six { grid-template-columns: repeat(6, 1fr); }
}
.choice-row button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .9rem .4rem;
  font: inherit;
  font-weight: 700;
  background: rgba(255,255,255,.04);
  color: var(--ink);
  cursor: pointer;
}
.choice-row button.active {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  border-color: transparent;
}
.primary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: .85rem 1rem;
  font: inherit;
  font-weight: 700;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  cursor: pointer;
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem 1rem;
  font: inherit;
  font-weight: 600;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  margin-bottom: .9rem;
  color: var(--muted);
  font-size: .92rem;
  flex-wrap: wrap;
}
.topbar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.hint {
  text-align: center;
  min-height: 1.4em;
  margin: 0 0 .8rem;
  color: var(--muted);
  font-size: .95rem;
}
.hint.err { color: var(--danger); }
.hint.ok { color: var(--accent); font-weight: 600; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .55rem;
  margin-top: .75rem;
}
.actions.two { grid-template-columns: repeat(2, 1fr); }
.actions button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem .3rem;
  font: inherit;
  font-weight: 600;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  color: var(--ink);
}
.actions button.warn { color: var(--warn); }
.actions button.danger { color: var(--danger); }
.stats-list { margin: .8rem 0 1.1rem; padding: 0; list-style: none; }
.stats-list li {
  display: flex;
  justify-content: space-between;
  padding: .55rem 0;
  border-bottom: 1px dashed var(--line);
}
.stats-list li:last-child { border-bottom: 0; }
.linkish {
  display: inline-block;
  margin-top: 1rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.grid-cells {
  display: grid;
  gap: 2px;
  margin: .5rem 0;
  user-select: none;
}
.grid-wrap { overflow: auto; max-height: min(82vmin, 720px); }
.grid-cells button, .grid-cells .cell {
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(232,242,236,.08);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  aspect-ratio: 1;
  /* Safari：button+flex 会多出一块空壳，改用 grid 居中 */
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  margin: 0;
  min-height: 0;
  min-width: 0;
  line-height: 1;
}
.grid-cells button.marked {
  background: rgba(62,207,142,.18);
  color: var(--accent);
  text-decoration: line-through;
}
.grid-cells button.found {
  background: rgba(62,207,142,.25);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.grid-cells button.wrong-flash {
  animation: wrongFlash .5s ease;
}
@keyframes wrongFlash {
  0%, 100% { background: rgba(232,242,236,.08); }
  50% { background: rgba(163,59,45,.35); }
}
.task-bar {
  text-align: center;
  padding: .65rem .8rem;
  border-radius: 12px;
  background: rgba(62,207,142,.1);
  color: var(--accent);
  font-weight: 600;
  margin-bottom: .85rem;
}


.confirm-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(6, 14, 12, 0.72);
  backdrop-filter: blur(2px);
}
.confirm-mask.hidden { display: none !important; }
.confirm-box {
  width: min(360px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 1.25rem 1.2rem 1.1rem;
}
.confirm-box p {
  margin: 0 0 1.1rem;
  font-size: 1.05rem;
  line-height: 1.45;
  color: var(--ink);
}
.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .55rem;
}
.confirm-actions button {
  border-radius: 14px;
  padding: .75rem 1rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.confirm-actions .confirm-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.confirm-actions .confirm-ok {
  border: 0;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
}
/* 统一完成反馈：轻量、不挡操作 */
.celebrate {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translate(-50%, -12px) scale(.92);
  z-index: 1100;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
}
.celebrate.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.celebrate-pill {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .7rem 1.1rem .7rem .85rem;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid rgba(62,207,142,.35);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  color: var(--accent);
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap;
}
.celebrate-mark {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  line-height: 1;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(62,207,142,.35);
  animation: celebratePulse .55s ease;
}
@keyframes celebratePulse {
  0% { box-shadow: 0 0 0 0 rgba(15,122,90,.4); transform: scale(.85); }
  60% { box-shadow: 0 0 0 10px rgba(15,122,90,0); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0 rgba(15,122,90,0); transform: scale(1); }
}
.celebrate-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}
.celebrate.show .celebrate-burst {
  animation: celebrateBurst .5s ease forwards;
}
.celebrate-burst:nth-child(1) { --dx: -28px; --dy: -22px; }
.celebrate-burst:nth-child(2) { --dx: 30px; --dy: -18px; background: #c9a227; }
.celebrate-burst:nth-child(3) { --dx: -22px; --dy: 24px; background: #9a4a12; }
.celebrate-burst:nth-child(4) { --dx: 26px; --dy: 20px; background: #2471a3; }
.celebrate-burst:nth-child(5) { --dx: 0; --dy: -32px; background: #7d3c98; }
.celebrate-burst:nth-child(6) { --dx: 0; --dy: 30px; background: #1e8449; }
@keyframes celebrateBurst {
  0% { opacity: .9; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
}


.size-row { margin-bottom: .75rem; }

/* ── 对局区 ── */
.play-card { padding: .85rem .85rem 1rem; }
.sudoku-stage {
  display: flex;
  justify-content: center;
  padding: .65rem;
  margin: 0 0 .7rem;
  border-radius: 14px;
  background: rgba(255,255,255,.04);
}
.sudoku-wrap { width: min(100%, 480px, 82vmin); margin: 0 auto; }
.sudoku {
  display: grid;
  width: 100%;
  aspect-ratio: 1;
  max-height: min(82vmin, 480px);
  background: #1a2420;
  border: 2.5px solid #1a2420;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
.sudoku button {
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 0;
  margin: 0;
  padding: 0;
  line-height: 1;
  background: rgba(232,242,236,.1);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  font-size: clamp(.9rem, 4.2vw, 1.35rem);
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  transition: background .1s ease, color .1s ease;
}
.sudoku button.box-alt { background: rgba(232,242,236,.06); }
.sudoku button.bdr-r-thin { border-right: 1px solid rgba(232,242,236,.14); }
.sudoku button.bdr-r-thick { border-right: 2px solid #0a1210; }
.sudoku button.bdr-b-thin { border-bottom: 1px solid rgba(232,242,236,.14); }
.sudoku button.bdr-b-thick { border-bottom: 2px solid #0a1210; }
.sudoku button:not(.given):hover { background: rgba(62,207,142,.14); }
.sudoku button.given {
  background: rgba(232,242,236,.14);
  color: var(--ink);
  font-weight: 700;
  cursor: default;
}
.sudoku button.given.box-alt { background: rgba(232,242,236,.1); }
.sudoku button.related { background: rgba(62,207,142,.1) !important; }
.sudoku button.given.related { background: rgba(232,242,236,.18) !important; }
.sudoku button.same-num {
  color: var(--accent);
  font-weight: 700;
  background: rgba(62,207,142,.14) !important;
}
.sudoku button.selected {
  background: rgba(62, 207, 142, 0.28) !important;
  color: var(--ink) !important;
  font-weight: 700;
  box-shadow: inset 0 0 0 2px rgba(62, 207, 142, 0.75);
}
.sudoku button.selected.given { color: var(--ink) !important; }
.sudoku button.conflict {
  background: rgba(224, 112, 96, 0.28) !important;
  color: #f0b0a4 !important;
}
.sudoku button.hinted { color: var(--warn); }
.sudoku.size-4 button { font-size: clamp(1.2rem, 7vw, 1.75rem); }
.sudoku.size-6 button { font-size: clamp(1rem, 5vw, 1.35rem); }
.sudoku.size-9 button { font-size: clamp(.85rem, 3.5vw, 1.1rem); }

/* ── 操作区 ── */
.play-dock {
  padding: .65rem;
  border-radius: 14px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
}
.numpad {
  display: flex;
  gap: .4rem;
  justify-content: center;
  flex-wrap: wrap;
}
.numpad.grid-9 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .4rem;
}
.numpad button {
  flex: 1 1 2.6rem;
  max-width: 3.25rem;
  height: 2.75rem;
  border: 0;
  border-radius: 10px;
  padding: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-deep);
  background: rgba(255,255,255,.92);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: background .1s ease, transform .08s ease;
}
.numpad.grid-9 button { max-width: none; height: 2.5rem; font-size: 1rem; }
.numpad button:hover { background: #e8f5ef; }
.numpad button:active { transform: scale(.96); }
.numpad button.clear {
  flex: 0 0 auto;
  max-width: none;
  min-width: 3.2rem;
  padding: 0 .6rem;
  font-size: .88rem;
  font-weight: 600;
  color: var(--muted);
  background: transparent;
  box-shadow: none;
  border: 1px dashed var(--line);
}
.numpad button.clear:hover { background: rgba(255,255,255,.08); }

.play-chrome {
  margin-top: .55rem;
  padding-top: .55rem;
  border-top: 1px solid var(--line);
}
.tool-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: .4rem;
}
.tool-row button {
  border: 0;
  border-radius: 10px;
  padding: .55rem .3rem;
  font: inherit;
  font-size: .84rem;
  font-weight: 600;
  background: rgba(255,255,255,.08);
  color: var(--ink);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: background .1s ease;
}
.tool-row button:hover { background: rgba(62,207,142,.16); }
.tool-row button.tool-accent {
  color: #062016;
  background: rgba(62,207,142,.35);
}
.play-actions { margin-top: .55rem; }
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .play-card { padding: .45rem .45rem .55rem; }
  .sudoku-stage { padding: .3rem; margin: 0 0 .3rem; }
  /* 横屏只收边距，棋盘仍按 vmin 吃满短边，避免被 dvh 再压小 */
  .sudoku-wrap { width: min(100%, 520px, 86vmin); }
  .sudoku { max-height: min(86vmin, 520px); }
  .play-dock { padding: .35rem; }
  .numpad { gap: .3rem; }
  .numpad button { height: 1.85rem; font-size: .92rem; }
  .numpad.grid-9 button { height: 1.7rem; font-size: .85rem; }
  /* 工具行 + 退出行合成一行，少占一截高度 */
  .play-chrome {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: .25rem;
    margin-top: .3rem;
    padding-top: .3rem;
  }
  .tool-row,
  .play-actions {
    display: contents;
  }
  .tool-row button,
  .play-actions button {
    padding: .32rem .1rem;
    font-size: .7rem;
    border-radius: 8px;
  }
}

</style>
</head>
<body data-game-skin="sudoku">
<header id="fgb-topbar"></header>
<div class="wrap wide">

  <section id="view-home">
    <h1>数<em>独</em></h1>
    <p class="sub">四宫格、六宫格、九宫格逻辑推理。支持检查、提示与上一步 / 下一步。</p>
    <div class="card mode-grid">
      <button type="button" class="mode-btn" id="btn-casual">
        <strong>休闲模式</strong>
        <span>自选规格，随机一题</span>
      </button>
      <button type="button" class="mode-btn" id="btn-challenge">
        <strong>挑战模式</strong>
        <span>连续 3 / 5 题，计时</span>

}
function shuffle(arr) {

}
function randInt(n) { return (Math.random() * n) | 0; }

function askConfirm(message, onYes, onNo) {

  mask.classList.remove("hidden");
}
function _resolveConfirm(ok) {
  var mask = document.getElementById("confirm-mask");
  if (mask) mask.classList.add("hidden");

  _confirmCb = null;
  if (!cb) return;

}

  if (ok) ok.addEventListener("click", function () { _resolveConfirm(true); });

(function () {

  function mergeDifficultyConfig(cfg) {

  }
  function ensureDifficulty(thenFn) {

  function diffLabel(key) {

  function applyDiff() {

  var mode = "casual";
  var size = 6;
  var challengeTotal = 3;
  var puzzleIndex = 0;
  var puzzlesDone = 0;
  var totalHints = 0;
  var hintsUsed = 0;
  var startedAt = 0;
  var timerId = null;

  var solution = [];
  var givens = {};
  var board = [];
  var selected = null;
  var history = [];
  var redoStack = [];

  function stopTimer() {

  }
  function startTimer() {
    stopTimer();
    timerId = setInterval(function () {
      document.getElementById("timer-text").textContent = fmtTime(Date.now() - startedAt);
    }, 500);
  }

  function boxOf(r, c) {
    var br = BOX[size][0], bc = BOX[size][1];
    return [Math.floor(r / br), Math.floor(c / bc)];
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function solve(grid, n, br, bc) {
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (grid[r][c] !== 0) continue;
        var nums = shuffle(Array.from({ length: n }, function (_, i) { return i + 1; }));
        for (var k = 0; k < nums.length; k++) {
          var v = nums[k];
          if (valid(grid, r, c, v, n, br, bc)) {
            grid[r][c] = v;
            if (solve(grid, n, br, bc)) return true;
            grid[r][c] = 0;
          }
        }
        return false;
      }
    }
    return true;
  }

  function valid(grid, r, c, v, n, br, bc) {
    for (var i = 0; i < n; i++) {
      if (grid[r][i] === v && i !== c) return false;
      if (grid[i][c] === v && i !== r) return false;
    }
    var br0 = Math.floor(r / br) * br, bc0 = Math.floor(c / bc) * bc;
    for (var i = 0; i < br; i++) {
      for (var j = 0; j < bc; j++) {
        var rr = br0 + i, cc = bc0 + j;
        if (grid[rr][cc] === v && (rr !== r || cc !== c)) return false;
      }
    }
    return true;
  }

  function countSolutions(puzzle, n, br, bc, limit) {
    var count = 0;
    function dfs() {
      if (count >= limit) return;
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (puzzle[r][c] !== 0) continue;
          for (var v = 1; v <= n; v++) {
            if (valid(puzzle, r, c, v, n, br, bc)) {
              puzzle[r][c] = v;
              dfs();
              puzzle[r][c] = 0;
              if (count >= limit) return;
            }
          }
          return;
        }
      }
      count++;
    }
    dfs();
    return count;
  }

  function cloneGrid(grid) {
    return grid.map(function (row) { return row.slice(); });
  }

  function filledCount(grid) {
    var n = grid.length, cnt = 0;
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (grid[r][c] !== 0) cnt++;
      }
    }
    return cnt;
  }

  function applyDigitPerm(grid, n) {
    var perm = shuffle(Array.from({ length: n }, function (_, i) { return i + 1; }));
    for (var r = 0; r < n; r++) {

        grid[r][c] = perm[grid[r][c] - 1];
      }
    }
  }

  function swapRows(grid, r1, r2) {
    var t = grid[r1];
    grid[r1] = grid[r2];
    grid[r2] = t;
  }

  function permuteBands(grid, n, br) {
    var numBands = n / br;
    var order = shuffle(Array.from({ length: numBands }, function (_, i) { return i; }));
    var src = cloneGrid(grid);
    for (var bi = 0; bi < numBands; bi++) {
      for (var dr = 0; dr < br; dr++) {
        grid[bi * br + dr] = src[order[bi] * br + dr].slice();
      }
    }
    for (var b = 0; b < numBands; b++) {
      var rows = shuffle(Array.from({ length: br }, function (_, i) { return b * br + i; }));
      var tmp = cloneGrid(grid);
      for (var i = 0; i < br; i++) grid[b * br + i] = tmp[rows[i]].slice();
    }
  }

  function permuteStacks(grid, n, bc) {
    var numStacks = n / bc;
    var order = shuffle(Array.from({ length: numStacks }, function (_, i) { return i; }));
    var src = cloneGrid(grid);
    for (var si = 0; si < numStacks; si++) {
      for (var dc = 0; dc < bc; dc++) {
        for (var r = 0; r < n; r++) {
          grid[r][si * bc + dc] = src[r][order[si] * bc + dc];
        }
      }
    }
    for (var s = 0; s < numStacks; s++) {
      var cols = shuffle(Array.from({ length: bc }, function (_, i) { return s * bc + i; }));
      var tmp = cloneGrid(grid);
      for (var i = 0; i < bc; i++) {
        var dst = s * bc + i;
        for (var r = 0; r < n; r++) grid[r][dst] = tmp[r][cols[i]];

  }

    applyDigitPerm(grid, n);

          grid[r][c] = grid[c][r];
          grid[c][r] = t;
        }

    }
  }

  function carvePuzzle(grid, n, br, bc, target) {
    var maxAttempts = n * n * 50;
    var attempts = 0;
    while (filledCount(grid) > target && attempts < maxAttempts) {
      attempts++;
      var r = randInt(n), c = randInt(n);

      var copy = cloneGrid(grid);
      if (countSolutions(copy, n, br, bc, 2) !== 1) grid[r][c] = backup;

  function ensureSpread(grid, sol, n, br, bc) {
    function rowCount(r) {
      var cnt = 0;
      for (var c = 0; c < n; c++) if (grid[r][c] !== 0) cnt++;
      return cnt;
    }
    function colCount(c) {
      var cnt = 0;
      for (var r = 0; r < n; r++) if (grid[r][c] !== 0) cnt++;
      return cnt;
    }
    function boxCount(bi, si) {
      var cnt = 0;
      for (var dr = 0; dr < br; dr++) {
        for (var dc = 0; dc < bc; dc++) {
          if (grid[bi * br + dr][si * bc + dc] !== 0) cnt++;
        }
      }
      return cnt;
    }
    function restoreAt(r, c) {
      if (grid[r][c] === 0) grid[r][c] = sol[r][c];
    }

    for (var r = 0; r < n; r++) {
      if (!rowCount(r)) {
        var cols = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
        restoreAt(r, cols[0]);
      }
    }
    for (var c = 0; c < n; c++) {
      if (!colCount(c)) {
        var rows = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
        restoreAt(rows[0], c);
      }
    }
    var numBands = n / br, numStacks = n / bc;
    for (var bi = 0; bi < numBands; bi++) {
      for (var si = 0; si < numStacks; si++) {
        if (!boxCount(bi, si)) {

          for (var dr = 0; dr < br; dr++) {
            for (var dc = 0; dc < bc; dc++) coords.push([bi * br + dr, si * bc + dc]);
          }
          coords = shuffle(coords);
          restoreAt(coords[0][0], coords[0][1]);
        }
      }
    }
  }

  function generatePuzzle(n, givensTarget) {
    var br = BOX[n][0], bc = BOX[n][1];
    var grid = [];
    for (var r = 0; r < n; r++) { grid[r] = []; for (var c = 0; c < n; c++) grid[r][c] = 0; }
    solve(grid, n, br, bc);
    randomizeSolved(grid, n, br, bc);
    var sol = cloneGrid(grid);
    var target = givensTarget || (DIFF[diffKey] || DIFF.normal).givens;
    carvePuzzle(grid, n, br, bc, target);
    ensureSpread(grid, sol, n, br, bc);
    var g = {};
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (grid[r][c] !== 0) g[r + "," + c] = grid[r][c];
      }
    }
    return { solution: sol, givens: g, puzzle: grid };
  }

  var puzzleStart = 0;

  function loadPuzzle() {
    puzzleStart = Date.now();
    var p = generatePuzzle(size);
    solution = p.solution;
    givens = p.givens;
    board = p.puzzle.map(function (row) { return row.slice(); });
    selected = null;
    history = [];
    redoStack = [];
    hintsUsed = 0;
    renderBoard();
    buildNumpad();
    document.getElementById("play-hint").className = "hint";
    document.getElementById("play-hint").textContent = "点格选中，再点数字填入";
  }

  function cloneBoard(src) {
    return src.map(function (row) { return row.slice(); });
  }

  function pushHistory() {
    history.push(cloneBoard(board));
    redoStack = [];
    if (history.length > 40) history.shift();
  }

  function isRelated(r, c, sr, sc) {
    if (r === sr && c === sc) return false;
    if (r === sr || c === sc) return true;
    var br = BOX[size][0], bc = BOX[size][1];
    var br0 = Math.floor(r / br), bc0 = Math.floor(c / bc);
    var sbr0 = Math.floor(sr / br), sbc0 = Math.floor(sc / bc);
    return br0 === sbr0 && bc0 === sbc0;
  }

  function renderBoard() {
    var el = document.getElementById("board");
    el.className = "sudoku size-" + size;
    el.style.gridTemplateColumns = "repeat(" + size + ", 1fr)";
    el.style.gridTemplateRows = "repeat(" + size + ", 1fr)";
    el.innerHTML = "";
    var br = BOX[size][0], bc = BOX[size][1];
    var sr = selected ? selected[0] : -1;
    var sc = selected ? selected[1] : -1;
    var sameVal = selected && board[sr][sc] ? board[sr][sc] : 0;
    var boxesPerRow = size / bc;
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        var btn = document.createElement("button");
        btn.type = "button";
        var v = board[r][c];
        btn.textContent = v ? String(v) : "";
        var key = r + "," + c;
        var boxIdx = Math.floor(r / br) * boxesPerRow + Math.floor(c / bc);
        if (boxIdx % 2 === 1) btn.classList.add("box-alt");
        if (givens[key]) btn.classList.add("given");
        if (selected && selected[0] === r && selected[1] === c) btn.classList.add("selected");
        else if (selected && isRelated(r, c, sr, sc)) btn.classList.add("related");
        if (sameVal && v === sameVal) btn.classList.add("same-num");
        if (hasConflict(r, c, v)) btn.classList.add("conflict");
        if (c < size - 1) btn.classList.add((c + 1) % bc === 0 ? "bdr-r-thick" : "bdr-r-thin");
        if (r < size - 1) btn.classList.add((r + 1) % br === 0 ? "bdr-b-thick" : "bdr-b-thin");
        btn.dataset.r = String(r);
        btn.dataset.c = String(c);
        if (!givens[key]) btn.addEventListener("click", function () {
          selected = [Number(this.dataset.r), Number(this.dataset.c)];
          renderBoard();
        });
        el.appendChild(btn);
      }
    }
  }

  function hasConflict(r, c, v) {
    if (!v) return false;
    for (var i = 0; i < size; i++) {
      if (i !== c && board[r][i] === v) return true;
      if (i !== r && board[i][c] === v) return true;
    }
    var br = BOX[size][0], bc = BOX[size][1];
    var br0 = Math.floor(r / br) * br, bc0 = Math.floor(c / bc) * bc;
    for (var i = 0; i < br; i++) {
      for (var j = 0; j < bc; j++) {
        var rr = br0 + i, cc = bc0 + j;
        if ((rr !== r || cc !== c) && board[rr][cc] === v) return true;
      }
    }
    return false;
  }

  function buildNumpad() {
    var pad = document.getElementById("numpad");
    pad.innerHTML = "";
    pad.className = "numpad" + (size > 6 ? " grid-9" : "");
    for (var i = 1; i <= size; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = String(i);
      b.addEventListener("click", (function (n) {
        return function () { setCell(n); };
      })(i));
      pad.appendChild(b);
    }
    var clr = document.createElement("button");
    clr.type = "button";
    clr.className = "clear";
    clr.textContent = "清除";
    clr.addEventListener("click", function () { setCell(0); });
    pad.appendChild(clr);
  }

  function setCell(n) {
    if (!selected) return;
    var r = selected[0], c = selected[1];
    if (givens[r + "," + c]) return;
    if (board[r][c] === n) return;
    pushHistory();
    board[r][c] = n;
    renderBoard();
    if (isComplete()) onPuzzleDone();
  }

  function isComplete() {
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        if (!board[r][c] || hasConflict(r, c, board[r][c])) return false;
      }
    }
    return true;
  }

  function onPuzzleDone() {
    document.getElementById("play-hint").className = "hint ok";
    document.getElementById("play-hint").textContent = "完成！";
    if (mode === "challenge") {
      puzzlesDone++;
      totalHints += hintsUsed;
      puzzleIndex++;
      if (puzzleIndex >= challengeTotal) {
        celebrateThen(FGB_MSG.sessionDone, finishChallenge, 500);
      } else {
        document.getElementById("play-progress").textContent =
          (puzzleIndex + 1) + " / " + challengeTotal;
        celebrateThen(FGB_MSG.done, loadPuzzle, 480);
      }
    } else {
      celebrate(FGB_MSG.done);
      if (typeof fgbSubmitScore === "function") fgbSubmitScore({
        gameId: "sudoku", mode: "casual", tier: diffKey,
        metrics: { timeMs: Date.now() - puzzleStart, hints: hintsUsed }
      });
    }
  }

  function startCasualPlay() {
    ensureDifficulty(function () {
      mode = "casual";
      applyDiff();
      stopTimer();
      document.getElementById("play-label").textContent = "休闲 · " + diffLabel(diffKey);
      document.getElementById("play-progress").textContent = "";
      document.getElementById("timer-text").textContent = "—";
      document.getElementById("btn-next").style.display = "";
      showView(views, "play");
      loadPuzzle();
    });
  }

  function startChallenge() {
    ensureDifficulty(function () {
      mode = "challenge";
      applyDiff();
      puzzleIndex = 0;
      puzzlesDone = 0;
      totalHints = 0;
      startedAt = Date.now();
      document.getElementById("play-label").textContent = "挑战 · " + diffLabel(diffKey);
      document.getElementById("btn-next").style.display = "none";
      showView(views, "play");
      startTimer();
      document.getElementById("play-progress").textContent = "1 / " + challengeTotal;
      loadPuzzle();
    });
  }

  function finishChallenge() {
    stopTimer();
    document.getElementById("st-total").textContent = String(challengeTotal);
    document.getElementById("st-done").textContent = String(puzzlesDone);
    document.getElementById("st-time").textContent = fmtTime(Date.now() - startedAt);
    document.getElementById("st-hints").textContent = String(totalHints);
    showView(views, "result");
    celebrate(FGB_MSG.sessionDone);
    if (typeof fgbSubmitScore === "function") fgbSubmitScore({
      gameId: "sudoku", mode: "challenge", tier: diffKey,
      metrics: {
        done: puzzlesDone, total: challengeTotal,
        timeMs: Date.now() - startedAt, hints: totalHints
      }
    });
  }

  function bindDiffChoice(selector) {
    document.querySelectorAll(selector).forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(selector).forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        diffKey = btn.dataset.diff;
        applyDiff();
      });
    });
  }

  document.getElementById("btn-casual").addEventListener("click", function () { showView(views, "size"); });
  document.getElementById("btn-challenge").addEventListener("click", function () { showView(views, "setup"); });
  document.getElementById("btn-setup-back").addEventListener("click", function () { showView(views, "home"); });
  document.getElementById("btn-size-back").addEventListener("click", function () { showView(views, "home"); });
  bindDiffChoice("#diff-choices button");
  bindDiffChoice("#casual-diff button");
  document.querySelectorAll("#count-choices button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#count-choices button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      challengeTotal = Number(btn.dataset.n);
    });
  });
  document.getElementById("btn-casual-start").addEventListener("click", startCasualPlay);
  document.getElementById("btn-start").addEventListener("click", startChallenge);
  document.getElementById("btn-undo").addEventListener("click", function () {
    if (!history.length) return;
    redoStack.push(cloneBoard(board));
    board = history.pop();
    renderBoard();
  });
  document.getElementById("btn-redo").addEventListener("click", function () {
    if (!redoStack.length) return;
    history.push(cloneBoard(board));
    board = redoStack.pop();
    renderBoard();
  });
  document.getElementById("btn-check").addEventListener("click", function () {
    var bad = false;
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        if (board[r][c] && hasConflict(r, c, board[r][c])) bad = true;
      }
    }
    document.getElementById("play-hint").className = "hint " + (bad ? "err" : "ok");
    document.getElementById("play-hint").textContent = bad ? "存在冲突" : "目前没有冲突";
    renderBoard();
  });
  document.getElementById("btn-hint").addEventListener("click", function () {
    if (!selected || givens[selected[0] + "," + selected[1]]) {
      document.getElementById("play-hint").textContent = "请先选中一个空格";
      return;
    }
    pushHistory();
    board[selected[0]][selected[1]] = solution[selected[0]][selected[1]];
    hintsUsed++;
    renderBoard();
    if (isComplete()) onPuzzleDone();
  });
  document.getElementById("btn-exit").addEventListener("click", function () {
    function doExit() {
      stopTimer();
      if (mode === "challenge" && puzzleIndex > 0) finishChallenge();
      else showView(views, "home");
    }
    if (mode === "challenge" && puzzleIndex > 0) {
      askConfirm(FGB_MSG.exitConfirm, doExit);
      return;
    }
    doExit();
  });
  document.getElementById("btn-restart").addEventListener("click", loadPuzzle);
  document.getElementById("btn-next").addEventListener("click", loadPuzzle);
  document.getElementById("btn-again").addEventListener("click", function () { showView(views, "setup"); });
  document.getElementById("btn-home").addEventListener("click", function () { stopTimer(); showView(views, "home"); });

  ensureDifficulty(function () {
    if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
      var dq = window.__FGB_DAILY_Q__ || {};
      if (!dq.tier) dq.tier = (new URLSearchParams(location.search || "")).get("tier") || "normal";
      if (dq.tier && DIFF[dq.tier]) { diffKey = dq.tier; applyDiff(); }
      startCasualPlay();
    } else {
      showView(views, "home");
    }
  });
})();

</script>
</body>
</html>
