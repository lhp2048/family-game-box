<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body>
<main class="fgb-shell">
  <header id="fgb-topbar"></header>

  <section class="fgb-panel fgb-panel-pad" style="max-width:420px;margin:0 auto">
    <h1 class="fgb-page-title" style="font-size:1.85rem">登录账号</h1>
    <p class="fgb-lead">登录后可跨设备继续玩，并保存个人成绩。</p>
    <div class="fgb-err" id="err"></div>
    <form id="login-form">
      <div class="fgb-field">
        <label class="fgb-page-kicker" for="username">用户名</label>
        <input class="fgb-input" type="text" id="username" name="username" autocomplete="username" required maxlength="16">
      </div>
      <div class="fgb-field">
        <label class="fgb-page-kicker" for="password">个人口令</label>
        <input class="fgb-input" type="password" id="password" name="password" autocomplete="current-password" required maxlength="128">
      </div>
      <div class="fgb-form-actions">
        <button type="submit" class="fgb-btn">登录</button>
        <span class="fgb-muted-link">没有账号？<a href="/register" id="link-register-2">去注册</a></span>
      </div>
    </form>
  </section>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script>
(function () {
  var next = FGBShell.safeNext("/");
  var regQs = next && next !== "/" ? ("?next=" + encodeURIComponent(next)) : "";

  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    title: "登录",
    showBack: true,
    backHref: "/",
    showUser: false,
  });
  var nav = document.querySelector("#fgb-topbar .fgb-nav");
  if (nav) {
    var regLink = document.createElement("a");
    regLink.className = "fgb-nav-link";
    regLink.id = "link-register";
    regLink.href = FGB.url("/register" + regQs);
    regLink.textContent = "注册";
    nav.appendChild(regLink);
  }
  document.getElementById("link-register-2").href = FGB.url("/register" + regQs);

  var form = document.getElementById("login-form");
  var errEl = document.getElementById("err");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    errEl.textContent = "";
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username || !password) return;
    FGB.login(username, password).then(function () {
      window.location.assign(FGB.url(next));
    }).catch(function (err) {
      errEl.textContent = (err && err.message) || "登录失败";
    });
  });
})();
</script>
</body>
</html>
