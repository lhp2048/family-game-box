<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷宫追踪</title>
<link rel="stylesheet" href="/css/fgb-theme.css">

<script>
(function fgbDailyHead() {
  if (/(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
    document.documentElement.classList.add("fgb-daily-mode");
  }
})();
</script>
<style>
html.fgb-daily-mode #view-home,
html.fgb-daily-mode #view-setup,
html.fgb-daily-mode #view-casual,
html.fgb-daily-mode #view-size,
html.fgb-daily-mode #view-result,
html.fgb-daily-mode #view-casual-done { display: none !important; }
html.fgb-daily-mode .mode-btn,
html.fgb-daily-mode #casual-extra,
html.fgb-daily-mode #btn-next,
html.fgb-daily-mode #btn-restart { display: none !important; }
/* 闯关 iframe 内：收掉重复顶栏/长说明；棋盘边长由 --fgb-board 动态计算 */
html.fgb-daily-mode {
  --fgb-board: 280px;
  height: 100%;
}
html.fgb-daily-mode body { height: 100%; }
html.fgb-daily-mode:not(.fgb-play-scroll),
html.fgb-daily-mode:not(.fgb-play-scroll) body { overflow: hidden; }
html.fgb-daily-mode.fgb-play-scroll,
html.fgb-daily-mode.fgb-play-scroll body { overflow: auto; }
html.fgb-daily-mode .wrap {
  width: min(720px, calc(100% - 0.75rem));
  padding: 0.35rem 0 0.4rem;
  box-sizing: border-box;
}
html.fgb-daily-mode #view-play > .topbar { display: none !important; }
html.fgb-daily-mode #fgb-topbar,
html.fgb-daily-mode #fgb-result { display: none !important; }
html.fgb-daily-mode #view-play > .hint { margin: 0 0 0.3rem; min-height: 1.05em; font-size: 0.88rem; }
html.fgb-daily-mode #view-play .tip { display: none !important; }
html.fgb-daily-mode .clover {
  width: var(--fgb-board) !important;
  height: var(--fgb-board) !important;
}
html.fgb-daily-mode .clover-wrap { margin: 0.1rem 0 0.3rem; }
html.fgb-daily-mode .leaf { font-size: calc(var(--fgb-board) * 0.11) !important; }
html.fgb-daily-mode .card-board-wrap {
  max-width: var(--fgb-board) !important;
  margin-left: auto;
  margin-right: auto;
}
html.fgb-daily-mode .num-card .val {
  font-size: calc(var(--fgb-board) * 0.14) !important;
}
html.fgb-daily-mode .num-card .expr {
  font-size: calc(var(--fgb-board) * 0.045) !important;
}
html.fgb-daily-mode .sudoku-wrap { width: min(100%, var(--fgb-board)) !important; }
html.fgb-daily-mode .sudoku { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .maze-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .grid-wrap { max-height: var(--fgb-board) !important; }
html.fgb-daily-mode .diff-panels { max-height: var(--fgb-board) !important; overflow: auto; }
html.fgb-daily-mode .board {
  width: min(100%, var(--fgb-board)) !important;
  max-height: var(--fgb-board) !important;
}
</style>

<style>

:root {
  --ink: #e8f2ec;
  --muted: #8fa399;
  --line: rgba(232, 242, 236, 0.12);
  --paper: #0c1411;
  --panel: rgba(18, 32, 28, 0.88);
  --accent: #3ecf8e;
  --accent-deep: #1a9f68;
  --warn: #e8a04a;
  --danger: #e07060;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
  --display: "Fraunces", "Songti SC", "Palatino Linotype", serif;
  --sans: "DM Sans", "PingFang SC", "Microsoft YaHei UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(62, 207, 142, 0.14), transparent 55%),
    radial-gradient(700px 400px at 100% 0%, rgba(232, 160, 74, 0.06), transparent 50%),
    linear-gradient(165deg, #0a1210 0%, #0c1411 45%, #101a16 100%);
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .2;
  background-image:
    linear-gradient(rgba(232,242,236,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,242,236,.03) 1px, transparent 1px);
  background-size: 28px 28px;
}
.wrap { position: relative; z-index: 1; width: min(560px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.6rem 0 3rem; }
.wrap.wide { width: min(720px, calc(100% - 1.5rem)); }
.hidden { display: none !important; }
/* 平板横屏 / 矮视口：压缩边距；棋盘尺寸由各游戏用 vmin 吃满短边 */
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .wrap { padding: .55rem 0 1rem; width: min(560px, calc(100% - 1rem)); }
  .wrap.wide { width: min(960px, calc(100% - 1rem)); }
  h1 { font-size: clamp(1.45rem, 4.5vw, 2.1rem); margin-bottom: .2rem; }
  .sub { margin: 0 0 .65rem; font-size: .88rem; }
  .card { padding: .75rem; border-radius: 14px; }
  .topbar { margin-bottom: .45rem; }
  .hint { margin: 0 0 .4rem; min-height: 1.1em; font-size: .88rem; }
  .actions { margin-top: .3rem; gap: .35rem; }
  .actions button { padding: .35rem .2rem; font-size: .82rem; border-radius: 10px; }
  .task-bar { padding: .45rem .65rem; margin-bottom: .5rem; }
  .mode-btn { padding: .75rem .85rem; }
  .choice-row { margin: .65rem 0; }
  .choice-row button { padding: .65rem .3rem; }
}
h1 {
  font-family: var(--display);
  font-size: clamp(2rem, 8vw, 3rem);
  margin: 0 0 .35rem;
  letter-spacing: -.02em;
  line-height: .95;
}
h1 em { font-style: italic; color: var(--accent); }
.sub { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.5; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 1.15rem;
}
.mode-grid { display: grid; gap: .75rem; }
.mode-btn {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1rem 1.05rem;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .15s ease, border-color .15s ease;
}
.mode-btn:hover { transform: translateY(-1px); border-color: rgba(62,207,142,.4); }
.mode-btn strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
.mode-btn span { color: var(--muted); font-size: .92rem; }
.choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1rem 0; }
.choice-row.two { grid-template-columns: repeat(2, 1fr); }
.choice-row.six { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) {
  .choice-row.six { grid-template-columns: repeat(6, 1fr); }
}
.choice-row button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .9rem .4rem;
  font: inherit;
  font-weight: 700;
  background: rgba(255,255,255,.04);
  color: var(--ink);
  cursor: pointer;
}
.choice-row button.active {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  border-color: transparent;
}
.primary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: .85rem 1rem;
  font: inherit;
  font-weight: 700;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  cursor: pointer;
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem 1rem;
  font: inherit;
  font-weight: 600;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  margin-bottom: .9rem;
  color: var(--muted);
  font-size: .92rem;
  flex-wrap: wrap;
}
.topbar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.hint {
  text-align: center;
  min-height: 1.4em;
  margin: 0 0 .8rem;
  color: var(--muted);
  font-size: .95rem;
}
.hint.err { color: var(--danger); }
.hint.ok { color: var(--accent); font-weight: 600; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .55rem;
  margin-top: .75rem;
}
.actions.two { grid-template-columns: repeat(2, 1fr); }
.actions button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem .3rem;
  font: inherit;
  font-weight: 600;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  color: var(--ink);
}
.actions button.warn { color: var(--warn); }
.actions button.danger { color: var(--danger); }
.stats-list { margin: .8rem 0 1.1rem; padding: 0; list-style: none; }
.stats-list li {
  display: flex;
  justify-content: space-between;
  padding: .55rem 0;
  border-bottom: 1px dashed var(--line);
}
.stats-list li:last-child { border-bottom: 0; }
.linkish {
  display: inline-block;
  margin-top: 1rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.grid-cells {
  display: grid;
  gap: 2px;
  margin: .5rem 0;
  user-select: none;
}
.grid-wrap { overflow: auto; max-height: min(82vmin, 720px); }
.grid-cells button, .grid-cells .cell {
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(232,242,236,.08);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  aspect-ratio: 1;
  /* Safari：button+flex 会多出一块空壳，改用 grid 居中 */
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  margin: 0;
  min-height: 0;
  min-width: 0;
  line-height: 1;
}
.grid-cells button.marked {
  background: rgba(62,207,142,.18);
  color: var(--accent);
  text-decoration: line-through;
}
.grid-cells button.found {
  background: rgba(62,207,142,.25);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.grid-cells button.wrong-flash {
  animation: wrongFlash .5s ease;
}
@keyframes wrongFlash {
  0%, 100% { background: rgba(232,242,236,.08); }
  50% { background: rgba(163,59,45,.35); }
}
.task-bar {
  text-align: center;
  padding: .65rem .8rem;
  border-radius: 12px;
  background: rgba(62,207,142,.1);
  color: var(--accent);
  font-weight: 600;
  margin-bottom: .85rem;
}


.confirm-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(6, 14, 12, 0.72);
  backdrop-filter: blur(2px);
}
.confirm-mask.hidden { display: none !important; }
.confirm-box {
  width: min(360px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 1.25rem 1.2rem 1.1rem;
}
.confirm-box p {
  margin: 0 0 1.1rem;
  font-size: 1.05rem;
  line-height: 1.45;
  color: var(--ink);
}
.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .55rem;
}
.confirm-actions button {
  border-radius: 14px;
  padding: .75rem 1rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.confirm-actions .confirm-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.confirm-actions .confirm-ok {
  border: 0;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
}
/* 统一完成反馈：轻量、不挡操作 */
.celebrate {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translate(-50%, -12px) scale(.92);
  z-index: 1100;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
}
.celebrate.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.celebrate-pill {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .7rem 1.1rem .7rem .85rem;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid rgba(62,207,142,.35);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  color: var(--accent);
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap;
}
.celebrate-mark {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  line-height: 1;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(62,207,142,.35);
  animation: celebratePulse .55s ease;
}
@keyframes celebratePulse {
  0% { box-shadow: 0 0 0 0 rgba(15,122,90,.4); transform: scale(.85); }
  60% { box-shadow: 0 0 0 10px rgba(15,122,90,0); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0 rgba(15,122,90,0); transform: scale(1); }
}
.celebrate-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}
.celebrate.show .celebrate-burst {
  animation: celebrateBurst .5s ease forwards;
}
.celebrate-burst:nth-child(1) { --dx: -28px; --dy: -22px; }
.celebrate-burst:nth-child(2) { --dx: 30px; --dy: -18px; background: #c9a227; }
.celebrate-burst:nth-child(3) { --dx: -22px; --dy: 24px; background: #9a4a12; }
.celebrate-burst:nth-child(4) { --dx: 26px; --dy: 20px; background: #2471a3; }
.celebrate-burst:nth-child(5) { --dx: 0; --dy: -32px; background: #7d3c98; }
.celebrate-burst:nth-child(6) { --dx: 0; --dy: 30px; background: #1e8449; }
@keyframes celebrateBurst {
  0% { opacity: .9; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
}


.maze-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: .5rem 0;
  overflow: auto;
  max-height: min(90vmin, 920px);
  min-height: min(62vmin, 560px);
  width: 100%;
}
.maze {
  display: grid;
  gap: 0;
  border: 2px solid #e8f2ec;
  background: #050a08;
  --cell: 24px;
}
.maze .cell {
  width: var(--cell);
  height: var(--cell);
  border-radius: 0;
  aspect-ratio: auto;
  min-height: 0;
  cursor: default;
  flex-shrink: 0;
}
.maze .wall { background: #050a08; }
.maze .path,
.maze .start,
.maze .end {
  background: #d8e8df;
  cursor: pointer;
  transition: background .14s ease, box-shadow .14s ease, transform .14s ease;
}
.maze .path:hover { background: #b8dcc8; }
.maze .start { background: #2bb673; }
.maze .end { background: #e8a04a; }
.maze .player {
  background: #3ecf8e !important;
  box-shadow: inset 0 0 0 2px #062016;
  transform: scale(1.06);
  z-index: 1;
}
.maze .player.is-sliding {
  transform: scale(1.14);
  box-shadow: inset 0 0 0 2px #062016, 0 0 10px rgba(62, 207, 142, 0.45);
}
/* 走过痕迹：琥珀，与浅色通道、深色墙都易区分 */
.maze .path.in-trail { background: #f0c86a; }
.maze .path.in-trail:hover { background: #e8b84a; }
.maze .start.in-trail { background: #1a9f68; }
.maze .end.in-trail { background: #d4892a; }
.maze.is-moving { pointer-events: none; }
.stat-pills {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  font-size: .9rem;
  color: var(--muted);
  margin-bottom: .5rem;
}
.stat-pills strong { color: var(--ink); }
.choice-row button span {
  display: block;
  font-weight: 500;
  font-size: .78rem;
  margin-top: .15rem;
  opacity: .85;
}
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .maze-wrap {
    max-height: min(88vmin, 860px);
    min-height: min(48vmin, 400px);
    margin: .3rem 0;
  }
  .stat-pills { margin-bottom: .3rem; gap: .65rem; font-size: .82rem; }
}

</style>
</head>
<body data-game-skin="maze">
<header id="fgb-topbar"></header>
<div class="wrap wide">

  <section id="view-home">
    <h1>迷宫<em>追踪</em></h1>
    <p class="sub">从起点走到终点。同一方向无墙阻挡时，可一次走到该方向上的任意格。难度由迷宫整体规模控制，单格大小随视口缩放。</p>
    <div class="card mode-grid">
      <button type="button" class="mode-btn" id="btn-casual">
        <strong>休闲模式</strong>
        <span>自选规模，到达终点即可</span>
      </button>
      <button type="button" class="mode-btn" id="btn-challenge">
        <strong>挑战模式</strong>
        <span>固定规模连做，计时统计</span>
      </button>
    </div>
    <a class="linkish fgb-nav-link" href="/">← 返回大厅</a>
  </section>

  <section id="view-casual" class="hidden">
    <h1>休闲</h1>
    <p class="sub">选择难度（迷宫规模）。</p>
    <div class="card">
      <p style="margin:0 0 .5rem;color:var(--muted);font-size:.9rem">难度</p>
      <div class="choice-row six" id="casual-diff">
<button type="button" data-diff="intro">入门<br><span style="font-weight:500;font-size:.72rem">9×9</span></button>
<button type="button" data-diff="simple">简单<br><span style="font-weight:500;font-size:.72rem">11×11</span></button>
<button type="button" data-diff="normal" class="active">普通<br><span style="font-weight:500;font-size:.72rem">15×15</span></button>
<button type="button" data-diff="hard">困难<br><span style="font-weight:500;font-size:.72rem">19×19</span></button>
<button type="button" data-diff="master">大师<br><span style="font-weight:500;font-size:.72rem">21×21</span></button>
<button type="button" data-diff="god">大神<br><span style="font-weight:500;font-size:.72rem">31×31</span></button>
</div>
      <button type="button" class="primary" id="btn-casual-start">开始</button>
      <div style="height:.65rem"></div>
      <button type="button" class="ghost" id="btn-casual-back" style="width:100%">返回</button>
    </div>
  </section>

  <section id="view-setup" class="hidden">
    <h1>挑战</h1>
    <p class="sub">选择规模与关数。</p>
    <div class="card">
      <p style="margin:0 0 .5rem;color:var(--muted);font-size:.9rem">难度</p>
      <div class="choice-row six" id="diff-choices">
<button type="button" data-diff="intro">入门<br><span style="font-weight:500;font-size:.72rem">9×9</span></button>
<button type="button" data-diff="simple">简单<br><span style="font-weight:500;font-size:.72rem">11×11</span></button>
<button type="button" data-diff="normal" class="active">普通<br><span style="font-weight:500;font-size:.72rem">15×15</span></button>
<button type="button" data-diff="hard">困难<br><span style="font-weight:500;font-size:.72rem">19×19</span></button>
<button type="button" data-diff="master">大师<br><span style="font-weight:500;font-size:.72rem">21×21</span></button>
<button type="button" data-diff="god">大神<br><span style="font-weight:500;font-size:.72rem">31×31</span></button>
</div>
      <p style="margin:1rem 0 .5rem;color:var(--muted);font-size:.9rem">关数</p>
      <div class="choice-row two" id="count-choices">
        <button type="button" data-n="3" class="active">3 关</button>
        <button type="button" data-n="5">5 关</button>
      </div>
      <button type="button" class="primary" id="btn-start">开始挑战</button>
      <div style="height:.65rem"></div>
      <button type="button" class="ghost" id="btn-setup-back" style="width:100%">返回</button>
    </div>
  </section>

  <section id="view-play" class="hidden">
    <div class="topbar">
      <span id="play-label">休闲</span>
      <span id="play-progress"></span>
      <span><strong id="timer-text">00:00</strong></span>
    </div>
    <div class="stat-pills">
      <span>步数 <strong id="steps">0</strong></span>
      <span>碰墙 <strong id="bumps">0</strong></span>
      <span>最短 <strong id="shortest">—</strong></span>
    </div>
    <p class="hint" id="play-hint">点击同行或同列、路径畅通的格子移动</p>
    <div class="card">
      <div class="maze-wrap"><div class="maze" id="maze"></div></div>
      <div class="actions">

<script>
/* fgb-daily-boot */

function showView(views, name) {
  if (window.__FGB_IS_DAILY__ && name !== "play") return;
  Object.keys(views).forEach(function (k) {
    views[k].classList.toggle("hidden", k !== name);
  });
}
function fmtTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  var r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0;
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function randInt(n) { return (Math.random() * n) | 0; }
function pick(arr) { return arr[randInt(arr.length)]; }

var FGB_MSG = {
  exitConfirm: "退出并查看统计？",
  done: "完成！",
  sessionDone: "本局完成！"
};

var _confirmCb = null;
function askConfirm(message, onYes, onNo) {
  var mask = document.getElementById("confirm-mask");
  var msg = document.getElementById("confirm-msg");
  if (!mask || !msg) {
    // 无页面内弹层时走 FGBUI；禁止回退到浏览器 confirm/alert
    if (window.FGBUI && FGBUI.askConfirm) {
      FGBUI.askConfirm(message, onYes, onNo);
      return;
    }
    if (onYes) onYes();
    return;
  }
  msg.textContent = message || FGB_MSG.exitConfirm;
  _confirmCb = { yes: onYes, no: onNo };
  mask.classList.remove("hidden");
}
function _resolveConfirm(ok) {
  var mask = document.getElementById("confirm-mask");
  if (mask) mask.classList.add("hidden");
  var cb = _confirmCb;
  _confirmCb = null;
  if (!cb) return;
  if (ok && cb.yes) cb.yes();
  if (!ok && cb.no) cb.no();
}
(function bindConfirmUI() {
  var ok = document.getElementById("confirm-ok");
  var cancel = document.getElementById("confirm-cancel");
  var mask = document.getElementById("confirm-mask");
  if (ok) ok.addEventListener("click", function () { _resolveConfirm(true); });
  if (cancel) cancel.addEventListener("click", function () { _resolveConfirm(false); });
  if (mask) mask.addEventListener("click", function (e) {
    if (e.target === mask) _resolveConfirm(false);
  });
})();

var _celebrateTimer = null;
/** 轻量完成动效：不挡点击，约 0.5s 自动消失 */
function celebrate(message) {
  var el = document.getElementById("celebrate");
  var text = document.getElementById("celebrate-text");
  if (!el || !text) return;
  text.textContent = message || FGB_MSG.done;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  el.classList.remove("hidden");
  if (_celebrateTimer) clearTimeout(_celebrateTimer);
  _celebrateTimer = setTimeout(function () {
    el.classList.remove("show");
    setTimeout(function () { el.classList.add("hidden"); }, 200);
  }, 520);
}
/** 播完成动效后短延迟回调；默认 480ms，几乎不拖慢下一局 */
function celebrateThen(message, callback, delayMs) {
  celebrate(message);
  var wait = delayMs == null ? 480 : delayMs;
  setTimeout(function () {
    if (callback) callback();
  }, wait);
}


(function () {
  var qraw = location.search || "";
  if (!/(?:^|[?&])daily=1(?:&|$)/.test(qraw)) return;
  var params = new URLSearchParams(qraw);
  var q = {
    daily: true,
    runId: params.get("runId") || "",
    tier: params.get("tier") || "normal",
    seed: Number(params.get("seed") || "0") || 1,
    stageIndex: Number(params.get("stageIndex") || "0") || 0,
  };
  window.__FGB_DAILY_Q__ = q;
  window.__FGB_IS_DAILY__ = true;
  document.documentElement.classList.add("fgb-daily-mode");
  if (window.FGBDaily && FGBDaily.installMathRandom) {
    FGBDaily.installMathRandom(q.seed);
  }
  if (window.FGBDaily && FGBDaily.installFitPlay) {
    FGBDaily.installFitPlay({ min: 168, max: 480, pad: 16 });
  }
  window.fgbSubmitScore = function (payload) {
    var ms = 0;
    if (payload && payload.metrics && payload.metrics.timeMs != null) ms = payload.metrics.timeMs | 0;
    if (window.FGBDaily && FGBDaily.notifyStageDone) FGBDaily.notifyStageDone(ms);
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-stage-done", timeMs: ms }, "*");
    }
  };
  function abortDaily(e) {
    if (e) {
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      else e.stopPropagation();
    }
    if (window.FGBDaily && FGBDaily.notifyAbort) FGBDaily.notifyAbort();
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-abort" }, "*");
    }
  }
  var base = (window.__FGB_BASE__ || "").replace(/\/$/, "");
  var homeSel = 'a.linkish[href="/"], a[href="/"]';
  if (base) {
    homeSel += ', a.linkish[href="' + base + '/"], a[href="' + base + '/"], a.linkish[href="' + base + '"], a[href="' + base + '"]';
  }
  document.querySelectorAll(homeSel).forEach(function (a) {
    a.textContent = "退出本关";
    a.href = "#";
    a.addEventListener("click", abortDaily);
  });
  // 游戏内退出按钮：每日模式禁止 show(home)，须通知父页结束挑战
  ["btn-exit", "btn-exit-casual", "btn-exit-challenge", "btn-quit"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("click", abortDaily, true);
  });
})();

/* fgb-game-chrome-boot */
(function () {
  if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) return;
  var el = document.getElementById("fgb-topbar");
  if (!el || !window.FGBShell || !FGBShell.mountTopbar) return;
  FGBShell.mountTopbar(el, {
    title: "迷宫追踪",
    showBack: true,
    backHref: "/",
    showUser: true
  });
})();


(function () {
  var views = {
    home: document.getElementById("view-home"),
    casual: document.getElementById("view-casual"),
    setup: document.getElementById("view-setup"),
    play: document.getElementById("view-play"),
    result: document.getElementById("view-result")
  };

  var diffKey = "normal";
  var mazeSize = 15;
  var mode = "casual";
  var challengeTotal = 3;
  var levelIndex = 0;
  var levelsDone = 0;
  var totalSteps = 0;
  var effSum = 0;
  var startedAt = 0;
  var timerId = null;

  var maze = null;
  var player = null;
  var steps = 0;
  var bumps = 0;
  var trail = {};
  var trailPath = [];
  var moving = false;
  var moveTimer = null;

  function stopMoveAnim() {
    if (moveTimer) {
      clearTimeout(moveTimer);
      moveTimer = null;
    }
    moving = false;
    var mazeEl = document.getElementById("maze");
    if (mazeEl) mazeEl.classList.remove("is-moving");
  }

  function stepDelay(n) {
    return Math.max(22, Math.min(52, Math.floor(420 / Math.max(1, n))));
  }

  function paintPlayerAndTrail() {
    var mazeEl = document.getElementById("maze");
    if (!mazeEl || !player) return;
    var cells = mazeEl.querySelectorAll(".cell[data-r]");
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      if (cell.classList.contains("wall")) continue;
      var r = Number(cell.dataset.r);
      var c = Number(cell.dataset.c);
      var isPlayer = r === player[0] && c === player[1];
      cell.classList.toggle("in-trail", !!trail[r + "," + c]);
      cell.classList.toggle("player", isPlayer);
      if (!isPlayer) cell.classList.remove("is-sliding");
    }
  }

  function animateAlong(cells, onStep, onDone) {
    stopMoveAnim();
    if (!cells || !cells.length) {
      if (onDone) onDone();
      return;
    }
    moving = true;
    var mazeEl = document.getElementById("maze");
    if (mazeEl) mazeEl.classList.add("is-moving");
    var delay = stepDelay(cells.length);
    var i = 0;
    function tick() {
      if (i >= cells.length) {
        var last = mazeEl && mazeEl.querySelector(".cell.player");
        if (last) last.classList.remove("is-sliding");
        stopMoveAnim();
        paintPlayerAndTrail();
        if (onDone) onDone();
        return;
      }
      var rc = cells[i++];
      player = [rc[0], rc[1]];
      if (onStep) onStep(rc, i, cells.length);
      paintPlayerAndTrail();
      var cur = mazeEl && mazeEl.querySelector(".cell.player");
      if (cur) cur.classList.add("is-sliding");
      moveTimer = setTimeout(tick, delay);
    }
    tick();
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function startTimer() {
    stopTimer();
    timerId = setInterval(function () {
      document.getElementById("timer-text").textContent = fmtTime(Date.now() - startedAt);
    }, 500);
  }

  var DIFF = {
    intro: { size: 9, label: "入门" },
    simple: { size: 11, label: "简单" },
    normal: { size: 15, label: "普通" },
    hard: { size: 19, label: "困难" },
    master: { size: 21, label: "大师" },
    god: { size: 31, label: "大神" }
  };

  function mergeDifficultyConfig(cfg) {
    if (!cfg || !cfg.tiers) return;
    Object.keys(cfg.tiers).forEach(function (k) {
      if (!DIFF[k]) return;
      Object.assign(DIFF[k], cfg.tiers[k]);
    });
  }
  function ensureDifficulty(thenFn) {
    if (!window.FGB || !FGB.loadDifficulty) { thenFn(); return; }
    FGB.loadDifficulty("maze").then(function (cfg) {
      mergeDifficultyConfig(cfg);
      thenFn();
    });
  }

  function diffLabel(key) {
    var d = DIFF[key];
    return d ? d.label : key;
  }

  function applyDiff() {
    var d = DIFF[diffKey] || DIFF.normal;
    mazeSize = d.size;
  }

  function modeLabel() {
    return (mode === "casual" ? "休闲" : "挑战") + " · " + diffLabel(diffKey);
  }

  function makeOdd(n) { return n % 2 === 0 ? n + 1 : n; }

  function generateMaze(size) {
    size = makeOdd(size);
    var grid = [];
    var r, c, i;
    for (r = 0; r < size; r++) {
      grid[r] = [];
      for (c = 0; c < size; c++) grid[r][c] = 1;
    }

    var dirs = [[0, 2], [0, -2], [2, 0], [-2, 0]];
    var startR = 1, startC = 1;
    grid[startR][startC] = 0;
    var active = [[startR, startC]];

    while (active.length) {
      var idx = Math.random() < 0.65 ? active.length - 1 : randInt(active.length);
      var cur = active[idx];
      var cr = cur[0], cc = cur[1];
      var neighbors = [];
      for (i = 0; i < dirs.length; i++) {
        var nr = cr + dirs[i][0], nc = cc + dirs[i][1];
        if (nr > 0 && nr < size - 1 && nc > 0 && nc < size - 1 && grid[nr][nc] === 1) {
          neighbors.push([nr, nc, dirs[i][0], dirs[i][1]]);
        }
      }
      if (!neighbors.length) {
        active.splice(idx, 1);
        continue;
      }
      var pickN = neighbors[randInt(neighbors.length)];
      var wr = cr + pickN[2] / 2, wc = cc + pickN[3] / 2;
      grid[wr][wc] = 0;
      grid[pickN[0]][pickN[1]] = 0;
      active.push([pickN[0], pickN[1]]);
    }

    braidMaze(grid, size, size < 15 ? 0.02 : size < 25 ? 0.035 : 0.05);

    var start = [startR, startC];
    var end = farthestCell(grid, size, start);
    return { size: size, grid: grid, start: start, end: end };
  }

  function braidMaze(grid, size, rate) {
    var candidates = [];
    var r, c;
    for (r = 1; r < size - 1; r++) {
      for (c = 1; c < size - 1; c++) {
        if (grid[r][c] !== 1) continue;
        var horiz = grid[r][c - 1] === 0 && grid[r][c + 1] === 0 && grid[r - 1][c] === 1 && grid[r + 1][c] === 1;
        var vert = grid[r - 1][c] === 0 && grid[r + 1][c] === 0 && grid[r][c - 1] === 1 && grid[r][c + 1] === 1;
        if (horiz || vert) candidates.push([r, c]);
      }
    }
    candidates = shuffle(candidates);
    var n = Math.max(0, Math.floor(candidates.length * rate));
    for (var i = 0; i < n; i++) {
      grid[candidates[i][0]][candidates[i][1]] = 0;
    }
  }

  function farthestCell(grid, size, start) {
    var q = [[start[0], start[1], 0]];
    var qi = 0;
    var seen = {};
    seen[start[0] + "," + start[1]] = true;
    var best = [start[0], start[1]];
    var bestD = 0;
    var dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    while (qi < q.length) {
      var cur = q[qi++];
      if (cur[2] > bestD) {
        bestD = cur[2];
        best = [cur[0], cur[1]];
      }
      for (var i = 0; i < dirs.length; i++) {
        var nr = cur[0] + dirs[i][0], nc = cur[1] + dirs[i][1];
        if (nr < 0 || nr >= size || nc < 0 || nc >= size || grid[nr][nc] !== 0) continue;
        var key = nr + "," + nc;
        if (seen[key]) continue;
        seen[key] = true;
        q.push([nr, nc, cur[2] + 1]);
      }
    }
    return best;
  }

  function bfsShortest(m) {
    var q = [[m.start[0], m.start[1], 0]];
    var qi = 0;
    var seen = {};
    seen[m.start[0] + "," + m.start[1]] = true;
    var dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    while (qi < q.length) {
      var cur = q[qi++];
      if (cur[0] === m.end[0] && cur[1] === m.end[1]) return cur[2];
      for (var i = 0; i < dirs.length; i++) {
        var nr = cur[0] + dirs[i][0], nc = cur[1] + dirs[i][1];
        if (nr < 0 || nr >= m.size || nc < 0 || nc >= m.size || m.grid[nr][nc] !== 0) continue;
        var key = nr + "," + nc;
        if (seen[key]) continue;
        seen[key] = true;
        q.push([nr, nc, cur[2] + 1]);
      }
    }
    return 0;
  }

  var levelStart = 0;

  function syncTrailFromPath() {
    trail = {};
    for (var i = 0; i < trailPath.length; i++) {
      trail[trailPath[i][0] + "," + trailPath[i][1]] = true;
    }
  }

  function recountSteps() {
    steps = 0;
    for (var i = 1; i < trailPath.length; i++) {
      steps += Math.abs(trailPath[i][0] - trailPath[i - 1][0]) +
        Math.abs(trailPath[i][1] - trailPath[i - 1][1]);
    }
    document.getElementById("steps").textContent = String(steps);
  }

  function loadLevel(size, optLevelStart) {
    stopMoveAnim();
    if (optLevelStart != null) levelStart = optLevelStart;
    else if (mode !== "challenge" || levelIndex > 0) levelStart = Date.now();
    maze = generateMaze(size);
    maze.shortest = bfsShortest(maze);
    player = maze.start.slice();
    steps = 0;
    bumps = 0;
    trailPath = [player.slice()];
    syncTrailFromPath();
    document.getElementById("steps").textContent = "0";
    document.getElementById("bumps").textContent = "0";
    document.getElementById("shortest").textContent = String(maze.shortest);
    renderMaze();
  }

  function renderMaze() {
    var el = document.getElementById("maze");
    var wrap = document.querySelector(".maze-wrap");
    var pad = 12;
    var availW = (wrap && wrap.clientWidth) ? wrap.clientWidth - pad : 640;
    // 用视口剩余高度，避免按当前小迷宫高度回算导致一直偏小
    var vh = window.innerHeight || 700;
    var wrapTop = wrap ? wrap.getBoundingClientRect().top : 120;
    var actions = document.querySelector("#view-play .actions");
    var bottom = 72;
    if (actions) {
      var ar = actions.getBoundingClientRect();
      bottom = Math.max(56, Math.ceil(vh - ar.top) + 8);
    }
    var cssMax = Math.floor(Math.min(vh, window.innerWidth || vh) * 0.9);
    var availH = Math.max(220, Math.min(cssMax, Math.floor(vh - wrapTop - bottom)));
    if (wrap) {
      var mh = parseFloat(window.getComputedStyle(wrap).maxHeight);
      if (mh > 0) availH = Math.min(availH, Math.floor(mh) - pad);
    }
    var side = Math.min(availW, availH);
    // 原上限 32px 在 Mac 大屏上会把迷宫锁得很小；按可用空间缩放，软顶 56
    var cell = Math.max(10, Math.min(56, Math.floor(side / maze.size)));
    el.style.setProperty("--cell", cell + "px");
    el.style.gridTemplateColumns = "repeat(" + maze.size + ", var(--cell))";
    el.innerHTML = "";
    for (var r = 0; r < maze.size; r++) {
      for (var c = 0; c < maze.size; c++) {
        var cellEl = document.createElement("div");
        cellEl.className = "cell";
        if (maze.grid[r][c] === 1) cellEl.classList.add("wall");
        else {
          cellEl.classList.add("path");
          if (r === maze.start[0] && c === maze.start[1]) cellEl.classList.add("start");
          if (r === maze.end[0] && c === maze.end[1]) cellEl.classList.add("end");
          if (trail[r + "," + c]) cellEl.classList.add("in-trail");
          if (r === player[0] && c === player[1]) cellEl.classList.add("player");
          cellEl.dataset.r = String(r);
          cellEl.dataset.c = String(c);
          cellEl.addEventListener("click", onCellClick);
        }
        el.appendChild(cellEl);
      }
    }
  }

  function canSlideTo(r, c) {
    var pr = player[0], pc = player[1];
    if (r === pr && c === pc) return null;
    if (r !== pr && c !== pc) return null;
    if (maze.grid[r][c] === 1) return null;
    var dr = r === pr ? 0 : (r > pr ? 1 : -1);
    var dc = c === pc ? 0 : (c > pc ? 1 : -1);
    var path = [];
    var cr = pr + dr, cc = pc + dc;
    while (true) {
      if (maze.grid[cr][cc] === 1) return null;
      path.push([cr, cc]);
      if (cr === r && cc === c) return path;
      cr += dr;
      cc += dc;
    }
  }

  function onCellClick() {
    if (moving) return;
    var r = Number(this.dataset.r), c = Number(this.dataset.c);
    if (r === player[0] && c === player[1]) return;
    if (maze.grid[r][c] === 1) {
      bumps++;
      document.getElementById("bumps").textContent = String(bumps);
      document.getElementById("play-hint").className = "hint err";
      document.getElementById("play-hint").textContent = "撞墙了";
      return;
    }
    var path = canSlideTo(r, c);
    if (!path) {
      document.getElementById("play-hint").className = "hint err";
      document.getElementById("play-hint").textContent = "只能沿同一方向、无墙阻挡移动";
      return;
    }

    // 返回已走过的格子：截断轨迹，前方路径颜色恢复
    var backIdx = -1;
    for (var i = 0; i < trailPath.length; i++) {
      if (trailPath[i][0] === r && trailPath[i][1] === c) backIdx = i;
    }
    if (backIdx >= 0) {
      var reverse = [];
      for (var k = trailPath.length - 2; k >= backIdx; k--) {
        reverse.push(trailPath[k].slice());
      }
      document.getElementById("play-hint").className = "hint";
      document.getElementById("play-hint").textContent = "已返回，前方路径已清除";
      animateAlong(reverse, function () {
        trailPath = trailPath.slice(0, trailPath.length - 1);
        syncTrailFromPath();
      }, function () {
        trailPath = trailPath.slice(0, backIdx + 1);
        player = [r, c];
        syncTrailFromPath();
        recountSteps();
        paintPlayerAndTrail();
      });
      return;
    }

    document.getElementById("play-hint").className = "hint";
    document.getElementById("play-hint").textContent = "点击同行或同列、路径畅通的格子移动；点回轨迹可返回";
    animateAlong(path, function (rc) {
      trailPath.push([rc[0], rc[1]]);
      syncTrailFromPath();
      steps += 1;
      document.getElementById("steps").textContent = String(steps);
    }, function () {
      player = [r, c];
      syncTrailFromPath();
      paintPlayerAndTrail();
      if (r === maze.end[0] && c === maze.end[1]) onComplete();
    });
  }

  function onComplete() {
    document.getElementById("play-hint").className = "hint ok";
    document.getElementById("play-hint").textContent = "到达终点！";
    if (mode === "challenge") {
      levelsDone++;
      totalSteps += steps;
      effSum += steps / maze.shortest;
      levelIndex++;
      if (levelIndex >= challengeTotal) {
        celebrateThen(FGB_MSG.sessionDone, finishChallenge, 500);
      } else {
        document.getElementById("play-progress").textContent = (levelIndex + 1) + " / " + challengeTotal;
        celebrateThen(FGB_MSG.done, function () { loadLevel(mazeSize); }, 480);
      }
    } else {
      celebrate(FGB_MSG.done);
      if (typeof fgbSubmitScore === "function") fgbSubmitScore({
        gameId: "maze", mode: "casual", tier: diffKey,
        metrics: { timeMs: Date.now() - levelStart, steps: steps }
      });
    }
  }

  function startCasual() {
    ensureDifficulty(function () {
      mode = "casual";
      applyDiff();
      stopTimer();
      document.getElementById("play-label").textContent = modeLabel();
      document.getElementById("play-progress").textContent = "";
      document.getElementById("timer-text").textContent = "—";
      showView(views, "play");
      var run = window.FGBUI && FGBUI.runWhenPlayable
        ? FGBUI.runWhenPlayable.bind(FGBUI)
        : function (prep, done) { prep(); done(Date.now()); };
      run(function () { loadLevel(mazeSize); }, function (t) { levelStart = t; });
    });
  }

  function startChallenge() {
    ensureDifficulty(function () {
      mode = "challenge";
      applyDiff();
      levelIndex = 0;
      levelsDone = 0;
      totalSteps = 0;
      effSum = 0;
      document.getElementById("play-label").textContent = modeLabel();
      showView(views, "play");
      document.getElementById("play-progress").textContent = "1 / " + challengeTotal;
      var run = window.FGBUI && FGBUI.runWhenPlayable
        ? FGBUI.runWhenPlayable.bind(FGBUI)
        : function (prep, done) { prep(); done(Date.now()); };
      run(function () { loadLevel(mazeSize); }, function (t) {
        startedAt = t;
        levelStart = t;
        startTimer();
      });
    });
  }

  function finishChallenge() {
    stopTimer();
    document.getElementById("st-rounds").textContent = String(challengeTotal);
    document.getElementById("st-size").textContent = mazeSize + "×" + mazeSize;
    document.getElementById("st-done").textContent = String(levelsDone);
    document.getElementById("st-time").textContent = fmtTime(Date.now() - startedAt);
    document.getElementById("st-steps").textContent = String(totalSteps);
    document.getElementById("st-eff").textContent = levelsDone
      ? (effSum / levelsDone).toFixed(2) : "—";
    showView(views, "result");
    celebrate(FGB_MSG.sessionDone);
    if (typeof fgbSubmitScore === "function") fgbSubmitScore({
      gameId: "maze", mode: "challenge", tier: diffKey,
      metrics: {
        done: levelsDone, total: challengeTotal,
        timeMs: Date.now() - startedAt, steps: totalSteps
      }
    });
  }

  function bindDiffChoice(selector) {
    document.querySelectorAll(selector).forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(selector).forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        diffKey = btn.dataset.diff;
        applyDiff();
      });
    });
  }

  document.getElementById("btn-casual").addEventListener("click", function () { showView(views, "casual"); });
  document.getElementById("btn-challenge").addEventListener("click", function () { showView(views, "setup"); });
  document.getElementById("btn-casual-back").addEventListener("click", function () { showView(views, "home"); });
  document.getElementById("btn-setup-back").addEventListener("click", function () { showView(views, "home"); });
  bindDiffChoice("#casual-diff button");
  bindDiffChoice("#diff-choices button");
  document.querySelectorAll("#count-choices button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#count-choices button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      challengeTotal = Number(btn.dataset.n);
    });
  });
  document.getElementById("btn-casual-start").addEventListener("click", startCasual);
  document.getElementById("btn-start").addEventListener("click", startChallenge);
  document.getElementById("btn-exit").addEventListener("click", function () {
    function doExit() {
      stopMoveAnim();
      stopTimer();
      if (mode === "challenge" && levelIndex > 0) finishChallenge();
      else showView(views, "home");
    }
    if (mode === "challenge" && levelIndex > 0) {
      askConfirm(FGB_MSG.exitConfirm, doExit);
      return;
    }
    doExit();
  });
  document.getElementById("btn-restart").addEventListener("click", function () {
    stopMoveAnim();
    player = maze.start.slice();
    steps = 0;
    bumps = 0;
    trailPath = [player.slice()];
    syncTrailFromPath();
    document.getElementById("steps").textContent = "0";
    document.getElementById("bumps").textContent = "0";
    document.getElementById("play-hint").className = "hint";
    document.getElementById("play-hint").textContent = "点击同行或同列、路径畅通的格子移动；点回轨迹可返回";
    renderMaze();
  });
  document.getElementById("btn-new").addEventListener("click", function () {
    loadLevel(mazeSize);
  });
  document.getElementById("btn-again").addEventListener("click", function () { stopMoveAnim(); showView(views, "setup"); });
  document.getElementById("btn-home").addEventListener("click", function () { stopMoveAnim(); stopTimer(); showView(views, "home"); });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (!maze || moving) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { renderMaze(); }, 120);
  });

  ensureDifficulty(function () {
    if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) {
      var dq = window.__FGB_DAILY_Q__ || {};
      if (!dq.tier) dq.tier = (new URLSearchParams(location.search || "")).get("tier") || "normal";
      if (dq.tier && DIFF[dq.tier]) { diffKey = dq.tier; applyDiff(); }
      startCasual();
    } else {
      showView(views, "home");
    }
  });
})();

</script>
</body>
</html>
