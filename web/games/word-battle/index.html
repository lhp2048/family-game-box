<style>

<style>

:root {
  --ink: #e8f2ec;
  --muted: #8fa399;
  --line: rgba(232, 242, 236, 0.12);
  --paper: #0c1411;
  --panel: rgba(18, 32, 28, 0.88);
  --accent: #3ecf8e;
  --accent-deep: #1a9f68;
  --warn: #e8a04a;
  --danger: #e07060;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
  --display: "Fraunces", "Songti SC", "Palatino Linotype", serif;
  --sans: "DM Sans", "PingFang SC", "Microsoft YaHei UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(62, 207, 142, 0.14), transparent 55%),
    radial-gradient(700px 400px at 100% 0%, rgba(232, 160, 74, 0.06), transparent 50%),
    linear-gradient(165deg, #0a1210 0%, #0c1411 45%, #101a16 100%);
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .2;
  background-image:
    linear-gradient(rgba(232,242,236,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,242,236,.03) 1px, transparent 1px);
  background-size: 28px 28px;
}
.wrap { position: relative; z-index: 1; width: min(560px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.6rem 0 3rem; }
.wrap.wide { width: min(720px, calc(100% - 1.5rem)); }
.hidden { display: none !important; }
/* 平板横屏 / 矮视口：压缩边距；棋盘尺寸由各游戏用 vmin 吃满短边 */
@media (max-height: 720px), (orientation: landscape) and (max-height: 900px) {
  .wrap { padding: .55rem 0 1rem; width: min(560px, calc(100% - 1rem)); }
  .wrap.wide { width: min(960px, calc(100% - 1rem)); }
  h1 { font-size: clamp(1.45rem, 4.5vw, 2.1rem); margin-bottom: .2rem; }
  .sub { margin: 0 0 .65rem; font-size: .88rem; }
  .card { padding: .75rem; border-radius: 14px; }
  .topbar { margin-bottom: .45rem; }
  .hint { margin: 0 0 .4rem; min-height: 1.1em; font-size: .88rem; }
  .actions { margin-top: .3rem; gap: .35rem; }
  .actions button { padding: .35rem .2rem; font-size: .82rem; border-radius: 10px; }
  .task-bar { padding: .45rem .65rem; margin-bottom: .5rem; }
  .mode-btn { padding: .75rem .85rem; }
  .choice-row { margin: .65rem 0; }
  .choice-row button { padding: .65rem .3rem; }
}
h1 {
  font-family: var(--display);
  font-size: clamp(2rem, 8vw, 3rem);
  margin: 0 0 .35rem;
  letter-spacing: -.02em;
  line-height: .95;
}
h1 em { font-style: italic; color: var(--accent); }
.sub { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.5; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 1.15rem;
}
.mode-grid { display: grid; gap: .75rem; }
.mode-btn {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1rem 1.05rem;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .15s ease, border-color .15s ease;
}
.mode-btn:hover { transform: translateY(-1px); border-color: rgba(62,207,142,.4); }
.mode-btn strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
.mode-btn span { color: var(--muted); font-size: .92rem; }
.choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1rem 0; }
.choice-row.two { grid-template-columns: repeat(2, 1fr); }
.choice-row.six { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) {
  .choice-row.six { grid-template-columns: repeat(6, 1fr); }
}
.choice-row button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .9rem .4rem;
  font: inherit;
  font-weight: 700;
  background: rgba(255,255,255,.04);
  color: var(--ink);
  cursor: pointer;
}
.choice-row button.active {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  border-color: transparent;
}
.primary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: .85rem 1rem;
  font: inherit;
  font-weight: 700;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  cursor: pointer;
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem 1rem;
  font: inherit;
  font-weight: 600;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  margin-bottom: .9rem;
  color: var(--muted);
  font-size: .92rem;
  flex-wrap: wrap;
}
.topbar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.hint {
  text-align: center;
  min-height: 1.4em;
  margin: 0 0 .8rem;
  color: var(--muted);
  font-size: .95rem;
}
.hint.err { color: var(--danger); }
.hint.ok { color: var(--accent); font-weight: 600; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .55rem;
  margin-top: .75rem;
}
.actions.two { grid-template-columns: repeat(2, 1fr); }
.actions button {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: .7rem .3rem;
  font: inherit;
  font-weight: 600;
  background: rgba(255,255,255,.04);
  cursor: pointer;
  color: var(--ink);
}
.actions button.warn { color: var(--warn); }
.actions button.danger { color: var(--danger); }
.stats-list { margin: .8rem 0 1.1rem; padding: 0; list-style: none; }
.stats-list li {
  display: flex;
  justify-content: space-between;
  padding: .55rem 0;
  border-bottom: 1px dashed var(--line);
}
.stats-list li:last-child { border-bottom: 0; }
.linkish {
  display: inline-block;
  margin-top: 1rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.grid-cells {
  display: grid;
  gap: 2px;
  margin: .5rem 0;
  user-select: none;
}
.grid-wrap { overflow: auto; max-height: min(82vmin, 720px); }
.grid-cells button, .grid-cells .cell {
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(232,242,236,.08);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  aspect-ratio: 1;
  /* Safari：button+flex 会多出一块空壳，改用 grid 居中 */
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  margin: 0;
  min-height: 0;
  min-width: 0;
  line-height: 1;
}
.grid-cells button.marked {
  background: rgba(62,207,142,.18);
  color: var(--accent);
  text-decoration: line-through;
}
.grid-cells button.found {
  background: rgba(62,207,142,.25);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.grid-cells button.wrong-flash {
  animation: wrongFlash .5s ease;
}
@keyframes wrongFlash {
  0%, 100% { background: rgba(232,242,236,.08); }
  50% { background: rgba(163,59,45,.35); }
}
.task-bar {
  text-align: center;
  padding: .65rem .8rem;
  border-radius: 12px;
  background: rgba(62,207,142,.1);
  color: var(--accent);
  font-weight: 600;
  margin-bottom: .85rem;
}


.confirm-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(6, 14, 12, 0.72);
  backdrop-filter: blur(2px);
}
.confirm-mask.hidden { display: none !important; }
.confirm-box {
  width: min(360px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 1.25rem 1.2rem 1.1rem;
}
.confirm-box p {
  margin: 0 0 1.1rem;
  font-size: 1.05rem;
  line-height: 1.45;
  color: var(--ink);
}
.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .55rem;
}
.confirm-actions button {
  border-radius: 14px;
  padding: .75rem 1rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.confirm-actions .confirm-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.confirm-actions .confirm-ok {
  border: 0;
  color: #062016;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
}
/* 统一完成反馈：轻量、不挡操作 */
.celebrate {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translate(-50%, -12px) scale(.92);
  z-index: 1100;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
}
.celebrate.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.celebrate-pill {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .7rem 1.1rem .7rem .85rem;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid rgba(62,207,142,.35);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  color: var(--accent);
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap;
}
.celebrate-mark {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  line-height: 1;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(62,207,142,.35);
  animation: celebratePulse .55s ease;
}
@keyframes celebratePulse {
  0% { box-shadow: 0 0 0 0 rgba(15,122,90,.4); transform: scale(.85); }
  60% { box-shadow: 0 0 0 10px rgba(15,122,90,0); transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0 rgba(15,122,90,0); transform: scale(1); }
}
.celebrate-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}
.celebrate.show .celebrate-burst {
  animation: celebrateBurst .5s ease forwards;
}
.celebrate-burst:nth-child(1) { --dx: -28px; --dy: -22px; }
.celebrate-burst:nth-child(2) { --dx: 30px; --dy: -18px; background: #c9a227; }
.celebrate-burst:nth-child(3) { --dx: -22px; --dy: 24px; background: #9a4a12; }
.celebrate-burst:nth-child(4) { --dx: 26px; --dy: 20px; background: #2471a3; }
.celebrate-burst:nth-child(5) { --dx: 0; --dy: -32px; background: #7d3c98; }
.celebrate-burst:nth-child(6) { --dx: 0; --dy: 30px; background: #1e8449; }
@keyframes celebrateBurst {
  0% { opacity: .9; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
}


.wb-hero { text-align: center; margin-bottom: 1rem; }
.wb-tag {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.35rem;
}
.wb-tier-grid {
  display: grid;
  gap: 0.65rem;
  margin-bottom: 0.85rem;
}
.wb-tier-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);

  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.wb-tier-btn strong { font-family: var(--display); font-size: 1.05rem; }
.wb-tier-btn span { font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.4; }
.wb-tier-btn:hover, .wb-tier-btn:focus-visible {
  border-color: rgba(251, 191, 36, 0.55);
  outline: none;
  transform: translateY(-1px);
}
.wb-tier-btn.active {
  border-color: rgba(251, 191, 36, 0.7);
  background: rgba(251, 191, 36, 0.1);
}
.wb-console { padding: 1rem 1.05rem; }
.wb-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
  font-size: 0.88rem;
  color: var(--muted);
}
.wb-progress strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.wb-timer {
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.wb-spell {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.35rem 0.45rem;
  min-height: 3.2rem;
  margin: 0.35rem 0 0.65rem;
  padding: 0.65rem 0.5rem;
  border-radius: 18px;
  border: 1px solid rgba(251, 191, 36, 0.28);
  background: linear-gradient(165deg, rgba(251, 191, 36, 0.1), rgba(12, 20, 17, 0.55));
}
.wb-spell.is-flash-err {
  animation: wbShake 0.35s ease;
  border-color: var(--danger);
}
@keyframes wbShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
.wb-char {
  font-family: var(--display);
  font-size: clamp(1.35rem, 5.5vw, 1.85rem);
  font-weight: 700;
  min-width: 1.1em;
  text-align: center;
  letter-spacing: 0.02em;
}
.wb-char.is-punct { color: var(--muted); min-width: auto; }
.wb-char.is-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.35em;
  min-height: 1.55em;
  border-radius: 10px;
  border: 2px dashed rgba(255, 255, 255, 0.16);
  color: var(--ink);
  opacity: 0.26;
}
.wb-char.is-slot.is-next {
  opacity: 0.42;
  border-color: rgba(251, 191, 36, 0.55);
  box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.12);
}
.wb-char.is-filled {
  border-style: solid;
  border-color: rgba(62, 207, 142, 0.55);
  background: rgba(62, 207, 142, 0.12);
  color: var(--ink);
  opacity: 1;
}
.wb-char.is-slot.is-speaking {
  opacity: 0.5;
  color: #fde68a;
  border-color: rgba(251, 191, 36, 0.75);
}
.wb-meta {
  text-align: center;
  margin-bottom: 0.65rem;
  line-height: 1.45;
}
.wb-gloss {
  font-size: 1.05rem;
  color: var(--ink);
  margin: 0 0 0.25rem;
}
.wb-ipa {
  font-size: 0.88rem;
  color: var(--muted);
  font-family: var(--display);
}
.wb-kb-toggle {
  display: flex;
  justify-content: center;
  margin-bottom: 0.45rem;
}
.wb-kb-toggle button {
  font-size: 0.82rem;
  padding: 0.35rem 0.75rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  cursor: pointer;
}
.wb-kb-toggle button[aria-pressed="true"] {
  border-color: rgba(251, 191, 36, 0.55);
  color: #fde68a;
}
.wb-keyboard {
  display: grid;
  gap: 0.35rem;
  max-width: 420px;
  margin: 0 auto 0.5rem;
}
.wb-keyboard.hidden { display: none; }
.wb-kb-row {
  display: flex;
  justify-content: center;
  gap: 0.28rem;
  flex-wrap: nowrap;
}
.wb-kb-row button {
  flex: 1 1 0;
  min-width: 0;
  max-width: 2.35rem;
  min-height: 44px;
  padding: 0;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06);
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
}
.wb-kb-row button:active { transform: scale(0.96); }
.wb-hint {
  text-align: center;
  min-height: 1.3em;
  font-size: 0.85rem;
  color: var(--muted);
}
.wb-hint.is-wait { color: #fde68a; }

</style>

<body data-game-skin="word-battle">
<header id="fgb-topbar"></header>
<div class="wrap wide">

  <section id="view-home">
    <div class="wb-hero">
      <p class="wb-tag">听音拼写</p>
      <h1>单词<em>大作战</em></h1>
      <p class="sub">听读音、看释义，按字母拼出英文单词。每局 10 词，错键不计入进度。</p>
    </div>
    <div class="card">
      <p class="hint" style="margin-bottom:.65rem">选择难度（四档<strong>首现</strong>词表，词量递增）</p>
      <div class="wb-tier-grid" id="tier-pick">
        <button type="button" class="wb-tier-btn active" data-tier="primary">
          <strong>入门</strong>
          <span>首现词表 · 约 576 词</span>
        </button>
        <button type="button" class="wb-tier-btn" data-tier="junior">
          <strong>初级</strong>
          <span>首现新增 · 约 1106 词</span>
        </button>
        <button type="button" class="wb-tier-btn" data-tier="senior">
          <strong>中级</strong>
          <span>首现新增 · 约 2026 词</span>
        </button>
        <button type="button" class="wb-tier-btn" data-tier="ielts">
          <strong>高级</strong>
          <span>首现新增 · 约 2936 词</span>
        </button>
      </div>

<script>
/* fgb-daily-boot */

function showView(views, name) {
  if (window.__FGB_IS_DAILY__ && name !== "play") return;
  Object.keys(views).forEach(function (k) {
    views[k].classList.toggle("hidden", k !== name);
  });
}
function fmtTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  var r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0;
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function randInt(n) { return (Math.random() * n) | 0; }
function pick(arr) { return arr[randInt(arr.length)]; }

var FGB_MSG = {
  exitConfirm: "退出并查看统计？",
  done: "完成！",
  sessionDone: "本局完成！"
};

var _confirmCb = null;
function askConfirm(message, onYes, onNo) {
  var mask = document.getElementById("confirm-mask");
  var msg = document.getElementById("confirm-msg");
  if (!mask || !msg) {
    // 无页面内弹层时走 FGBUI；禁止回退到浏览器 confirm/alert
    if (window.FGBUI && FGBUI.askConfirm) {
      FGBUI.askConfirm(message, onYes, onNo);
      return;
    }
    if (onYes) onYes();
    return;
  }
  msg.textContent = message || FGB_MSG.exitConfirm;
  _confirmCb = { yes: onYes, no: onNo };
  mask.classList.remove("hidden");
}
function _resolveConfirm(ok) {
  var mask = document.getElementById("confirm-mask");
  if (mask) mask.classList.add("hidden");
  var cb = _confirmCb;
  _confirmCb = null;
  if (!cb) return;
  if (ok && cb.yes) cb.yes();
  if (!ok && cb.no) cb.no();
}
(function bindConfirmUI() {
  var ok = document.getElementById("confirm-ok");
  var cancel = document.getElementById("confirm-cancel");
  var mask = document.getElementById("confirm-mask");
  if (ok) ok.addEventListener("click", function () { _resolveConfirm(true); });
  if (cancel) cancel.addEventListener("click", function () { _resolveConfirm(false); });
  if (mask) mask.addEventListener("click", function (e) {
    if (e.target === mask) _resolveConfirm(false);
  });
})();

var _celebrateTimer = null;
/** 轻量完成动效：不挡点击，约 0.5s 自动消失 */
function celebrate(message) {
  var el = document.getElementById("celebrate");
  var text = document.getElementById("celebrate-text");
  if (!el || !text) return;
  text.textContent = message || FGB_MSG.done;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  el.classList.remove("hidden");
  if (_celebrateTimer) clearTimeout(_celebrateTimer);
  _celebrateTimer = setTimeout(function () {
    el.classList.remove("show");
    setTimeout(function () { el.classList.add("hidden"); }, 200);
  }, 520);
}
/** 播完成动效后短延迟回调；默认 480ms，几乎不拖慢下一局 */
function celebrateThen(message, callback, delayMs) {
  celebrate(message);
  var wait = delayMs == null ? 480 : delayMs;
  setTimeout(function () {
    if (callback) callback();
  }, wait);
}


(function () {
  var qraw = location.search || "";
  if (!/(?:^|[?&])daily=1(?:&|$)/.test(qraw)) return;
  var params = new URLSearchParams(qraw);
  var q = {
    daily: true,
    runId: params.get("runId") || "",
    tier: params.get("tier") || "normal",
    seed: Number(params.get("seed") || "0") || 1,
    stageIndex: Number(params.get("stageIndex") || "0") || 0,
  };
  window.__FGB_DAILY_Q__ = q;
  window.__FGB_IS_DAILY__ = true;
  document.documentElement.classList.add("fgb-daily-mode");
  if (window.FGBDaily && FGBDaily.installMathRandom) {
    FGBDaily.installMathRandom(q.seed);
  }
  if (window.FGBDaily && FGBDaily.installFitPlay) {
    FGBDaily.installFitPlay({ min: 168, max: 480, pad: 16 });
  }
  window.fgbSubmitScore = function (payload) {
    var ms = 0;
    if (payload && payload.metrics && payload.metrics.timeMs != null) ms = payload.metrics.timeMs | 0;
    if (window.FGBDaily && FGBDaily.notifyStageDone) FGBDaily.notifyStageDone(ms);
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-stage-done", timeMs: ms }, "*");
    }
  };
  function abortDaily(e) {
    if (e) {
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      else e.stopPropagation();
    }
    if (window.FGBDaily && FGBDaily.notifyAbort) FGBDaily.notifyAbort();
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fgb-daily-abort" }, "*");
    }
  }
  var base = (window.__FGB_BASE__ || "").replace(/\/$/, "");
  var homeSel = 'a.linkish[href="/"], a[href="/"]';
  if (base) {
    homeSel += ', a.linkish[href="' + base + '/"], a[href="' + base + '/"], a.linkish[href="' + base + '"], a[href="' + base + '"]';
  }
  document.querySelectorAll(homeSel).forEach(function (a) {
    a.textContent = "退出本关";
    a.href = "#";
    a.addEventListener("click", abortDaily);
  });
  // 游戏内退出按钮：每日模式禁止 show(home)，须通知父页结束挑战
  ["btn-exit", "btn-exit-casual", "btn-exit-challenge", "btn-quit"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("click", abortDaily, true);
  });
})();

/* fgb-game-chrome-boot */
(function () {
  if (window.__FGB_IS_DAILY__ || /(?:^|[?&])daily=1(?:&|$)/.test(location.search || "")) return;
  var el = document.getElementById("fgb-topbar");
  if (!el || !window.FGBShell || !FGBShell.mountTopbar) return;
  FGBShell.mountTopbar(el, {
    title: "单词大作战",
    showBack: true,
    backHref: "/",
    showUser: true
  });
})();


(function () {
  var TOTAL = 10;
  var TIER_LABEL = {
    primary: "入门",
    junior: "初级",
    senior: "中级",
    ielts: "高级",
  };
  var ROWS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  var LETTER_CLIP_IDS = "abcdefghijklmnopqrstuvwxyz".split("");
  var LETTER_NAMES = {
    a: "ay", b: "bee", c: "see", d: "dee", e: "ee", f: "eff", g: "jee",
    h: "aych", i: "eye", j: "jay", k: "kay", l: "ell", m: "em", n: "en",
    o: "oh", p: "pee", q: "cue", r: "ar", s: "ess", t: "tee", u: "you",
    v: "vee", w: "double you", x: "ex", y: "why", z: "zee",
  };
  var PAUSE_AFTER_LETTER_MS = 135;
  var enVoice = null;
  var letterAudio = FgbAudioClips({
    clipIds: LETTER_CLIP_IDS,
    resolveUrl: function (id) {
      return "audio/" + id + ".mp3";
    },
  });
  letterAudio.warmNetwork();

  var views = {
    home: document.getElementById("view-home"),
    play: document.getElementById("view-play"),
    result: document.getElementById("view-result"),
  };
  var bank = null;
  var tierKey = "primary";
  var pool = [];
  var round = [];
  var qIndex = 0;
  var letterIdx = 0;
  var wrongKeys = 0;
  var clockStart = 0;
  var timerId = null;
  var accepting = false;
  var introGen = 0;
  var kbVisible = false;
  var rng = Math.random;

  var spellEl = document.getElementById("wb-spell");
  var glossEl = document.getElementById("wb-gloss");
  var ipaEl = document.getElementById("wb-ipa");
  var hintEl = document.getElementById("wb-hint");
  var qnEl = document.getElementById("wb-q-n");
  var timerEl = document.getElementById("wb-timer");
  var kbEl = document.getElementById("wb-keyboard");
  var kbToggle = document.getElementById("btn-kb-toggle");

  function show(name) {
    Object.keys(views).forEach(function (k) {
      views[k].classList.toggle("hidden", k !== name);
    });
  }

  function formatSec(ms) {
    return (ms / 1000).toFixed(1) + "s";
  }

  function elapsedMs() {
    return clockStart ? Date.now() - clockStart : 0;
  }

  function startTimer(anchor) {
    if (timerId) clearInterval(timerId);
    clockStart = anchor || Date.now();
    timerId = setInterval(function () {
      timerEl.textContent = formatSec(elapsedMs());
    }, 200);
    timerEl.textContent = formatSec(0);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6d2b79f5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function letterPositions(word) {
    var out = [];
    var i;
    for (i = 0; i < word.length; i++) {
      if (/[a-zA-Z]/.test(word.charAt(i))) out.push(i);
    }
    return out;
  }

  function pickEnVoice() {
    if (!window.speechSynthesis) return null;
    var voices = speechSynthesis.getVoices() || [];
    var i;
    for (i = 0; i < voices.length; i++) {
      var lang = (voices[i].lang || "").toLowerCase();
      if (lang.indexOf("en-us") >= 0) return voices[i];
    }
    for (i = 0; i < voices.length; i++) {
      var lang2 = (voices[i].lang || "").toLowerCase();
      if (lang2.indexOf("en") === 0) return voices[i];
    }
    return null;
  }

  function ensureVoices() {
    if (enVoice) return;
    enVoice = pickEnVoice();
    if (!enVoice && window.speechSynthesis) {
      speechSynthesis.addEventListener("voiceschanged", function () {
        if (!enVoice) enVoice = pickEnVoice();
      });
    }
  }

  function letterSpeakText(ch) {
    var key = String(ch || "").toLowerCase();
    if (!/^[a-z]$/.test(key)) return "";
    return LETTER_NAMES[key] || key;
  }

  function speakText(text, rate, cancelFirst) {
    if (!text) return Promise.resolve();
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") {
      return Promise.resolve();
    }
    ensureVoices();
    return new Promise(function (resolve) {
      if (cancelFirst) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = rate == null ? 0.78 : rate;
      if (enVoice) u.voice = enVoice;
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
    });
  }

  function playLetterClip(ch) {
    var id = String(ch || "").toLowerCase();
    if (!/^[a-z]$/.test(id)) return Promise.resolve(false);
    letterAudio.unlock();
    return new Promise(function (resolve) {
      letterAudio.play(id, function (ok) {
        resolve(!!ok);
      });
    });
  }

  function playLetterSound(ch) {
    return playLetterClip(ch).then(function (ok) {
      if (ok) return true;
      return speakText(letterSpeakText(ch), 0.78, false).then(function () {
        return false;
      });
    });
  }

  function delay(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  function stopSpeech() {
    letterAudio.stop();
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
    } catch (e) {}
  }

  function buildKeyboard() {
    kbEl.innerHTML = "";
    ROWS.forEach(function (row) {
      var wrap = document.createElement("div");
      wrap.className = "wb-kb-row";
      for (var i = 0; i < row.length; i++) {
        var ch = row.charAt(i);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = ch.toUpperCase();
        btn.dataset.key = ch;
        btn.addEventListener("click", function () {
          handleKey(this.dataset.key);
        });
        wrap.appendChild(btn);
      }
      kbEl.appendChild(wrap);
    });
  }

  function defaultKbVisible() {
    if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return true;
    return window.innerWidth < 768;
  }

  function setKbVisible(on) {
    kbVisible = !!on;
    kbEl.classList.toggle("hidden", !kbVisible);
    kbToggle.setAttribute("aria-pressed", kbVisible ? "true" : "false");
    kbToggle.textContent = kbVisible ? "隐藏屏幕键盘" : "显示屏幕键盘";
  }

  function renderSpell(word, filledCount, nextHighlight, speakingIdx) {
    var slots = letterPositions(word);
    spellEl.innerHTML = "";
    spellEl.classList.remove("is-flash-err");
    var i;
    for (i = 0; i < word.length; i++) {
      var span = document.createElement("span");
      var ch = word.charAt(i);
      if (!/[a-zA-Z]/.test(ch)) {
        span.className = "wb-char is-punct";
        span.textContent = ch;
        spellEl.appendChild(span);
        continue;
      }
      var slotNum = slots.indexOf(i);
      span.className = "wb-char is-slot";
      span.textContent = ch;
      if (slotNum < filledCount) {
        span.className = "wb-char is-filled";
      } else if (slotNum === filledCount && nextHighlight) {
        span.classList.add("is-next");
        if (speakingIdx === i) span.classList.add("is-speaking");
      }
      spellEl.appendChild(span);
    }
  }

  function currentWord() {
    return round[qIndex];
  }

  function expectedLetter() {
    var item = currentWord();
    if (!item) return "";
    var slots = letterPositions(item.w);
    if (letterIdx >= slots.length) return "";
    return item.w.charAt(slots[letterIdx]).toLowerCase();
  }

  function flashError() {
    spellEl.classList.add("is-flash-err");
    setTimeout(function () {
      spellEl.classList.remove("is-flash-err");
    }, 360);
  }

  function handleKey(raw) {
    if (!accepting || views.play.classList.contains("hidden")) return;
    var key = String(raw || "").toLowerCase();
    if (!/^[a-z]$/.test(key)) return;
    var want = expectedLetter();
    if (!want) return;
    if (key !== want) {
      wrongKeys += 1;
      flashError();
      return;
    }
    var item = currentWord();
    letterIdx += 1;
    renderSpell(item.w, letterIdx, true, -1);
    var slots = letterPositions(item.w);
    var isLast = letterIdx >= slots.length;
    if (isLast) accepting = false;
    playLetterClip(key).then(function () {
      if (!isLast) return;
      finishWord();
    });
  }

  function finishWord() {
    qIndex += 1;
    if (qIndex >= TOTAL) {
      finishRun();
      return;
    }
    qnEl.textContent = String(qIndex + 1);
    startWord();
  }

  function startWord() {
    var item = currentWord();
    if (!item) return;
    letterIdx = 0;
    accepting = false;
    introGen += 1;
    var myGen = introGen;
    glossEl.textContent = item.gloss || "—";
    var ipa = item.ipa_us || item.ipa_uk || "";
    ipaEl.textContent = ipa ? "/" + ipa + "/" : "";
    renderSpell(item.w, 0, true, -1);
    hintEl.textContent = "正在听读音…";
    hintEl.classList.add("is-wait");
    var slots = letterPositions(item.w);
    var letters = slots.map(function (idx) { return item.w.charAt(idx); });

    (async function () {
      stopSpeech();
      var i;
      for (i = 0; i < letters.length; i++) {
        if (myGen !== introGen) return;
        renderSpell(item.w, 0, true, slots[i]);
        await playLetterSound(letters[i]);
        if (myGen !== introGen) return;
        await delay(PAUSE_AFTER_LETTER_MS);
      }
      if (myGen !== introGen) return;
      renderSpell(item.w, 0, true, -1);
      accepting = true;
      hintEl.textContent = "请拼写单词（键盘或屏幕键）";
      hintEl.classList.remove("is-wait");
      renderSpell(item.w, 0, true, -1);
    })();
  }

  function pickRound() {
    var copy = pool.slice();
    var i;
    for (i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    round = copy.slice(0, TOTAL);
  }

  function beginPlay() {
    if (!bank || !pool.length) {
      hintEl.textContent = "词库加载失败，请刷新页面";
      return;
    }
    qIndex = 0;
    wrongKeys = 0;
    introGen = 0;
    pickRound();
    show("play");
    qnEl.textContent = "1";
    setKbVisible(defaultKbVisible());
    var run = window.FGBUI && FGBUI.runWhenPlayable
      ? FGBUI.runWhenPlayable.bind(FGBUI)
      : function (prep, done) { prep(); done(Date.now()); };
    letterAudio.unlock();
    run(function () {}, function (t) {
      letterAudio.preloadAll().then(function () {
        startTimer(t);
        startWord();
      });
    });
  }

  function finishRun() {
    stopTimer();
    accepting = false;
    introGen += 1;
    stopSpeech();
    var elapsed = elapsedMs();
    document.getElementById("st-tier").textContent = TIER_LABEL[tierKey] || tierKey;
    document.getElementById("st-time").textContent = formatSec(elapsed);
    document.getElementById("st-words").textContent = TOTAL + " / " + TOTAL;
    document.getElementById("st-wrong").textContent = String(wrongKeys);
    document.getElementById("wb-result-sub").textContent =
      wrongKeys <= 3 ? "拼写很稳！" : "完成 10 词，继续加油！";
    show("result");
    if (typeof celebrate === "function") celebrate(FGB_MSG.sessionDone);
    if (typeof fgbSubmitScore === "function") {
      fgbSubmitScore({
        gameId: "word-battle",
        mode: "challenge",
        tier: tierKey,
        tierLabel: TIER_LABEL[tierKey] || tierKey,
        metrics: {
          timeMs: elapsed,
          correctWords: TOTAL,
          totalWords: TOTAL,
          wrongKeys: wrongKeys,
          correct: TOTAL,
          total: TOTAL,
          done: 1,
        },
      });
    }
  }

  function loadBank() {
    return fetch("words.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("words.json");
        return r.json();
      })
      .then(function (data) {
        bank = data;
        rebuildPool();
      });
  }

  function rebuildPool() {
    pool = (bank.words || []).filter(function (w) {
      return w.level === tierKey;
    });
  }

  document.querySelectorAll("#tier-pick .wb-tier-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#tier-pick .wb-tier-btn").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      tierKey = btn.getAttribute("data-tier") || "primary";
      rebuildPool();
    });
  });

  document.getElementById("btn-start").addEventListener("click", beginPlay);
  document.getElementById("btn-again").addEventListener("click", beginPlay);
  document.getElementById("btn-home").addEventListener("click", function () {
    stopTimer();
    show("home");
  });
  document.getElementById("btn-exit").addEventListener("click", function () {
    if (window.__FGB_IS_DAILY__) return;
    if (typeof askConfirm === "function") {
      askConfirm("确定退出？本局不会记入成绩。", function () {
        stopTimer();
        introGen += 1;
        accepting = false;
        stopSpeech();
        show("home");
      });
    } else {
      stopTimer();
      show("home");
    }
  });
  kbToggle.addEventListener("click", function () {
    setKbVisible(!kbVisible);
  });

  document.addEventListener("keydown", function (e) {
    if (views.play.classList.contains("hidden") || !accepting) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k && k.length === 1 && /[a-zA-Z]/.test(k)) {
      e.preventDefault();
      handleKey(k);
    }
  });

  buildKeyboard();
  setKbVisible(defaultKbVisible());
  ensureVoices();

  var seed = Date.now() ^ ((Math.random() * 0x7fffffff) | 0);
  loadBank()
    .then(function () {
      rng = mulberry32(seed);
      show("home");
    })
    .catch(function () {
      show("home");
      var sub = document.querySelector("#view-home .sub");
      if (sub) sub.textContent = "词库加载失败，请稍后刷新。";
    });
})();

</script>
</body>
</html>
