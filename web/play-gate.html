<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭口令 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body class="fgb-console">
<div class="fgb-console-bezel" aria-hidden="true"></div>
<main class="fgb-shell fgb-console-shell">
  <header id="fgb-topbar"></header>

  <section class="fgb-panel fgb-panel-pad" style="max-width:420px;margin:0 auto">
    <h1 class="fgb-page-title" style="font-size:1.85rem">请输入家庭口令</h1>
    <p class="fgb-lead">家长已开启游戏口令，输入正确口令后即可继续玩和提交成绩。</p>
    <div class="fgb-err" id="err"></div>
    <form id="unlock-form">
      <div class="fgb-field">
        <label class="fgb-page-kicker" for="passphrase">口令</label>
        <input class="fgb-input" type="password" id="passphrase" name="passphrase" autocomplete="current-password" required maxlength="128">
      </div>
      <div class="fgb-form-actions">
        <button type="submit" class="fgb-btn">解锁</button>
      </div>
    </form>
  </section>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script>
(function () {
  /*
   * Gate-specific safeNext: middleware can send users to
   * /play-gate?next=/login or ?next=/register when the family gate
   * protects those pages (needs_play includes login/register).
   * FGBShell.safeNext blocks /login|/register to avoid auth loops on
   * login/register themselves — after unlock we must allow them.
   * Same open-redirect rules otherwise (relative /, no //, no \).
   */
  function decodeNext(raw) {
    var prev = raw;
    for (var n = 0; n < 5; n++) {
      var nxt;
      try { nxt = decodeURIComponent(prev); }
      catch (e) { return ""; }
      if (nxt === prev) return nxt;
      prev = nxt;
    }
    return prev;
  }
  function posixNormpath(path) {
    if (!path) return ".";
    var initial = 0;
    if (path.charAt(0) === "/") {
      initial = 1;
      if (path.indexOf("//") === 0 && path.indexOf("///") !== 0) initial = 2;
    }
    var comps = path.split("/");
    var out = [];
    for (var i = 0; i < comps.length; i++) {
      var comp = comps[i];
      if (comp === "" || comp === ".") continue;
      if (comp !== ".." || (initial === 0 && !out.length) || (out.length && out[out.length - 1] === "..")) {
        out.push(comp);
      } else if (out.length) {
        out.pop();
      }
    }
    var joined = out.join("/");
    if (initial) joined = new Array(initial + 1).join("/") + joined;
    return joined || ".";
  }
  function safeNextAllowAuth(raw) {
    if (!raw) return "/";
    var decoded = decodeNext(raw);
    if (!decoded) return "/";
    if (decoded.indexOf("\\") !== -1) return "/";
    for (var i = 0; i < decoded.length; i++) {
      var code = decoded.charCodeAt(i);
      if (code < 32 || code === 127) return "/";
    }
    if (!decoded.startsWith("/") || decoded.startsWith("//")) return "/";
    var q = decoded.indexOf("?");
    var pathOnly = q === -1 ? decoded : decoded.slice(0, q);
    var query = q === -1 ? "" : decoded.slice(q);
    var normalized = posixNormpath(pathOnly);
    if (!normalized.startsWith("/") || normalized.startsWith("//")) return "/";
    return pathOnly + query;
  }
  var params = new URLSearchParams(window.location.search);
  var rawNext = params.get("next") || "/";
  var next = safeNextAllowAuth(rawNext);

  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    title: "家庭口令",
    showBack: true,
    backHref: "/",
    showUser: false,
  });

  var form = document.getElementById("unlock-form");
  var errEl = document.getElementById("err");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    errEl.textContent = "";
    var passphrase = document.getElementById("passphrase").value.trim();
    if (!passphrase) return;
    fetch(FGB.url("/api/v1/play-gate/unlock"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passphrase: passphrase }),
    })
      .then(function (res) {
        if (res.ok) {
          // next may already include root prefix from middleware; do not FGB.url again
          window.location.assign(next);
          return null;
        }
        return res.json().then(function (data) {
          errEl.textContent = (data && data.detail) || "解锁失败";
        });
      })
      .catch(function () {
        errEl.textContent = "网络错误，请稍后再试";
      });
  });
})();
</script>
</body>
</html>
