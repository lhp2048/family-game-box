<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日挑战榜 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
<style>
.combo-no {
  font-family: Consolas, "Sarasa Mono SC", monospace;
  font-size: .88rem;
  letter-spacing: .04em;
  color: var(--muted);
}
.combo-no .now {
  display: inline-block;
  margin-left: .35rem;
  padding: .1rem .4rem;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: .72rem;
  letter-spacing: 0;
  font-weight: 700;
  color: #062016;
  background: var(--accent);
  vertical-align: middle;
}
.kind-tag {
  display: inline-block;
  margin-left: .35rem;
  padding: .1rem .4rem;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 700;
  vertical-align: middle;
  border: 1px solid var(--line);
  color: var(--muted);
}
.kind-tag.best { color: var(--gold); border-color: rgba(212,168,75,.45); }
.kind-tag.first { color: var(--accent); border-color: rgba(62,207,142,.35); }
.fgb-podium .spot .combo {
  margin-top: .25rem;
  font-family: Consolas, "Sarasa Mono SC", monospace;
  font-size: .72rem;
  color: var(--muted);
}
</style>
</head>
<body>
<main class="fgb-shell">
  <header class="fgb-topbar">
    <div>
      <a class="fgb-brand" href="/">家庭<em>游戏盒</em></a>
      <span class="fgb-page-kicker">挑战排行</span>
    </div>
    <div class="fgb-nav">
      <a class="fgb-nav-link" href="/">回大厅</a>
      <a class="fgb-nav-link" href="/daily">每日挑战</a>
      <a class="fgb-nav-link" href="/leaderboard">游戏排行</a>
    </div>
  </header>

  <h1 class="fgb-page-title">每日挑战榜</h1>
  <p class="fgb-lead" id="date-label">今日成绩 · 通关优先，其次完成关数，再比总用时</p>
  <p class="fgb-lead" id="combo-hint" style="margin-top:-.5rem;font-size:.9rem">挑战单号用于区分同日不同组合（如管理员重生成）。</p>

  <div class="fgb-podium hidden" id="podium" aria-label="前三名"></div>

  <div class="fgb-panel">
    <table class="fgb-table">
      <thead>
        <tr><th class="fgb-rank">#</th><th>昵称</th><th>挑战单</th><th>记录</th><th>状态</th><th>完成</th><th>总用时</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="6" class="fgb-empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <p class="fgb-empty" id="empty" hidden>暂无记录 · <a href="/daily" style="color:var(--accent)">去做每日挑战</a></p>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script>
(function () {
  var myTerminal = (window.FGB && FGB.getTerminalId) ? FGB.getTerminalId() : "";
  var podiumEl = document.getElementById("podium");

  function fmt(ms) {
    ms = Math.max(0, ms | 0);
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function comboCell(it) {
    var no = it.comboNo || "—";
    var badge = it.isCurrentCombo ? '<span class="now">本场</span>' : "";
    return '<span class="combo-no">' + esc(no) + badge + "</span>";
  }

  function rankClass(i) {
    var n = i + 1;
    var cls = "fgb-rank";
    if (n === 1 || n === 2 || n === 3) cls += " fgb-rank-" + n;
    return cls;
  }

  function kindLabel(kind) {
    if (kind === "first+best") return '<span class="kind-tag first">首次·最佳</span>';
    if (kind === "best") return '<span class="kind-tag best">最佳</span>';
    if (kind === "first") return '<span class="kind-tag first">首次</span>';
    return '<span class="kind-tag">—</span>';
  }

  function renderPodium(items) {
    var top = (items || []).slice(0, 3);
    if (!top.length) {
      podiumEl.classList.add("hidden");
      podiumEl.innerHTML = "";
      return;
    }
    var ICONS = { 1: "🥇", 2: "🥈", 3: "🥉" };
    var TITLES = { 1: "冠军", 2: "亚军", 3: "季军" };
    podiumEl.classList.remove("hidden");
    var order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
    var ranks = top.length >= 3 ? [2, 1, 3] : top.map(function (_, i) { return i + 1; });
    podiumEl.innerHTML = order.map(function (it, i) {
      var r = ranks[i];
      var score = (it.status === "finished" ? "通关 · " : "退出 · ") + fmt(it.totalTimeMs);
      var combo = (it.comboNo || "") + (it.isCurrentCombo ? " · 本场" : "");
      var kind = it.recordKind === "best" ? "最佳" : (it.recordKind === "first" ? "首次" : (it.recordKind === "first+best" ? "首次·最佳" : ""));
      return '<div class="spot fgb-podium-' + r + '"><div class="icon" aria-hidden="true">' +
        ICONS[r] + '</div><div class="title">' + TITLES[r] + '</div><div class="name">' +
        esc(it.nickname) + '</div><div class="score">' + esc(score) +
        (kind ? (" · " + kind) : "") +
        '</div><div class="combo">' + esc(combo) + "</div></div>";
    }).join("");
  }

  fetch("/api/v1/daily/leaderboard").then(function (r) { return r.json(); }).then(function (data) {
    var curNo = data.currentComboNo || "";
    document.getElementById("date-label").textContent =
      (data.date || "今日") + " · 通关优先，其次完成关数，再比总用时";
    document.getElementById("combo-hint").textContent = curNo
      ? ("当前挑战单 " + curNo + " · 每人每单只保留「首次」与「最佳」两条")
      : "每人每单只保留首次与最佳记录；挑战单号区分同日不同组合";
    var tb = document.getElementById("rows");
    tb.innerHTML = "";
    var items = data.items || [];
    if (!items.length) {
      document.getElementById("empty").hidden = false;
      tb.innerHTML = '<tr><td colspan="7" class="fgb-empty">暂无记录</td></tr>';
      return;
    }
    renderPodium(items);
    var rest = items.slice(3);
    if (!rest.length) {
      tb.innerHTML = '<tr><td colspan="7" class="fgb-empty">仅前三名</td></tr>';
      return;
    }
    rest.forEach(function (it, i) {
      var rank = i + 4;
      var tr = document.createElement("tr");
      if (it.terminalId && it.terminalId === myTerminal) tr.className = "fgb-row-me";
      var status = it.status === "finished" ? "通关" : "退出";
      tr.innerHTML =
        '<td class="' + rankClass(rank - 1) + '">' + rank + "</td><td>" + esc(it.nickname || "—") +
        "</td><td>" + comboCell(it) + "</td><td>" + kindLabel(it.recordKind) +
        "</td><td>" + status + "</td><td>" + (it.stagesDone || 0) +
        "</td><td>" + fmt(it.totalTimeMs) + "</td>";
      tb.appendChild(tr);
    });
  }).catch(function () {
    document.getElementById("rows").innerHTML =
      '<tr><td colspan="7" class="fgb-empty">加载失败</td></tr>';
  });
})();
</script>
</body>
</html>
