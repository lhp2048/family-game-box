<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专注力挑战榜 · MX游戏盒子</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
<style>
.kind-tag {
  display: inline-block;
  margin-left: .35rem;
  padding: .1rem .4rem;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 700;
  vertical-align: middle;
  border: 1px solid var(--line);
  color: var(--muted);
}
.kind-tag.best { color: var(--gold); border-color: rgba(212,168,75,.45); }
.kind-tag.first { color: var(--accent); border-color: rgba(62,207,142,.35); }
</style>
</head>
<body class="fgb-console">
<div class="fgb-console-bezel" aria-hidden="true"></div>
<main class="fgb-shell fgb-console-shell">
  <header id="fgb-topbar"></header>

  <h1 class="fgb-page-title">专注力挑战榜</h1>
  <p class="fgb-lead" id="date-label">今日成绩 · 通关优先，其次完成关数，再比总用时</p>
  <p class="fgb-lead" id="combo-hint" style="margin-top:-.5rem;font-size:.9rem">保留最近 7 天。每天默认显示最新一场，可再切换场次。</p>

  <div class="fgb-tabs" id="date-tabs" aria-label="选择日期"></div>
  <div class="fgb-tabs hidden" id="combo-tabs" aria-label="选择挑战"></div>

  <div class="fgb-podium hidden" id="podium" aria-label="前三名"></div>

  <div class="fgb-panel">
    <table class="fgb-table">
      <thead>
        <tr><th class="fgb-rank">#</th><th>昵称</th><th>记录</th><th>状态</th><th>完成</th><th>总用时</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="6" class="fgb-empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <p class="fgb-empty" id="empty" hidden>暂无记录 · <a href="/daily" style="color:var(--accent)">去做每日专注力挑战</a></p>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script>
(function () {
  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    title: "专注力挑战榜",
    showBack: true,
    backHref: "/",
    showUser: true,
  });
  var topNav = document.querySelector("#fgb-topbar .fgb-nav");
  if (topNav) {
    [
      { href: "/daily", label: "每日专注力挑战" },
      { href: "/leaderboard", label: "游戏排行" },
    ].forEach(function (item) {
      var a = document.createElement("a");
      a.className = "fgb-nav-link";
      a.href = FGB.url(item.href);
      a.textContent = item.label;
      topNav.appendChild(a);
    });
  }

  var myTerminal = (window.FGB && FGB.getTerminalId) ? FGB.getTerminalId() : "";
  var podiumEl = document.getElementById("podium");
  var tabsEl = document.getElementById("combo-tabs");
  var dateTabsEl = document.getElementById("date-tabs");
  var selectedComboId = "";
  var selectedDate = "";

  function fmt(ms) {
    ms = Math.max(0, ms | 0);
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function rankClass(i) {
    var n = i + 1;
    var cls = "fgb-rank";
    if (n === 1 || n === 2 || n === 3) cls += " fgb-rank-" + n;
    return cls;
  }

  function kindLabel(kind) {
    if (kind === "first+best") return '<span class="kind-tag first">首次·最佳</span>';
    if (kind === "best") return '<span class="kind-tag best">最佳</span>';
    if (kind === "first") return '<span class="kind-tag first">首次</span>';
    return '<span class="kind-tag">—</span>';
  }

  function renderPodium(items) {
    var top = (items || []).slice(0, 3);
    if (!top.length) {
      podiumEl.classList.add("hidden");
      podiumEl.innerHTML = "";
      return;
    }
    var ICONS = { 1: "🥇", 2: "🥈", 3: "🥉" };
    var TITLES = { 1: "冠军", 2: "亚军", 3: "季军" };
    podiumEl.classList.remove("hidden");
    var order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
    var ranks = top.length >= 3 ? [2, 1, 3] : top.map(function (_, i) { return i + 1; });
    podiumEl.innerHTML = order.map(function (it, i) {
      var r = ranks[i];
      var score = (it.status === "finished" ? "通关 · " : "退出 · ") + fmt(it.totalTimeMs);
      var kind = it.recordKind === "best" ? "最佳" : (it.recordKind === "first" ? "首次" : (it.recordKind === "first+best" ? "首次·最佳" : ""));
      return '<div class="spot fgb-podium-' + r + '"><div class="icon" aria-hidden="true">' +
        ICONS[r] + '</div><div class="title">' + TITLES[r] + '</div><div class="name">' +
        esc(it.nickname) + '</div><div class="score">' + esc(score) +
        (kind ? (" · " + kind) : "") +
        "</div></div>";
    }).join("");
  }

  function renderDateTabs(dates, active) {
    dateTabsEl.innerHTML = (dates || []).map(function (d) {
      var id = d.date || "";
      var cls = "fgb-tab" + (id === active ? " is-active" : "");
      return '<button type="button" class="' + cls + '" data-date="' + esc(id) + '">' + esc(d.label || id) + "</button>";
    }).join("");
  }

  function renderTabs(combos, activeId) {
    if (!combos || combos.length <= 1) {
      tabsEl.classList.add("hidden");
      tabsEl.innerHTML = "";
      return;
    }
    tabsEl.classList.remove("hidden");
    tabsEl.innerHTML = combos.map(function (c) {
      var id = c.comboId || "";
      var label = c.comboNo || "挑战";
      if (c.isCurrent) label += " · 本场";
      var cls = "fgb-tab" + (id === activeId ? " is-active" : "");
      return '<button type="button" class="' + cls + '" data-combo="' + esc(id) + '">' + esc(label) + "</button>";
    }).join("");
  }

  function renderBoard(data) {
    var comboNo = data.comboNo || data.currentComboNo || "";
    document.getElementById("date-label").textContent =
      (data.date || "今日") + (comboNo ? (" · " + comboNo) : "") + " · 通关优先，其次完成关数，再比总用时";
    document.getElementById("combo-hint").textContent =
      "保留最近 7 天。每人每场只留「首次」与「最佳」；同日多场分榜查看，默认最新一场";

    selectedDate = data.date || "";
    selectedComboId = data.comboId || data.currentComboId || "";
    renderDateTabs(data.dates || [], selectedDate);
    renderTabs(data.combos || [], selectedComboId);

    var tb = document.getElementById("rows");
    var emptyEl = document.getElementById("empty");
    tb.innerHTML = "";
    emptyEl.hidden = true;
    var items = data.items || [];
    if (!items.length) {
      emptyEl.hidden = false;
      podiumEl.classList.add("hidden");
      podiumEl.innerHTML = "";
      tb.innerHTML = '<tr><td colspan="6" class="fgb-empty">本场暂无记录</td></tr>';
      return;
    }
    renderPodium(items);
    var rest = items.slice(3);
    if (!rest.length) {
      tb.innerHTML = '<tr><td colspan="6" class="fgb-empty">仅前三名</td></tr>';
      return;
    }
    rest.forEach(function (it, i) {
      var rank = i + 4;
      var tr = document.createElement("tr");
      if (it.terminalId && it.terminalId === myTerminal) tr.className = "fgb-row-me";
      var status = it.status === "finished" ? "通关" : "退出";
      tr.innerHTML =
        '<td class="' + rankClass(rank - 1) + '">' + rank + "</td><td>" + esc(it.nickname || "—") +
        "</td><td>" + kindLabel(it.recordKind) +
        "</td><td>" + status + "</td><td>" + (it.stagesDone || 0) +
        "</td><td>" + fmt(it.totalTimeMs) + "</td>";
      tb.appendChild(tr);
    });
  }

  function loadBoard(date, comboId) {
    var params = [];
    if (date) params.push("date=" + encodeURIComponent(date));
    if (comboId) params.push("comboId=" + encodeURIComponent(comboId));
    var q = params.length ? ("?" + params.join("&")) : "";
    return fetch(FGB.url("/api/v1/daily/leaderboard" + q))
      .then(function (r) { return r.json(); })
      .then(renderBoard);
  }

  dateTabsEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-date]");
    if (!btn) return;
    var day = btn.getAttribute("data-date") || "";
    if (!day || day === selectedDate) return;
    loadBoard(day, "").catch(function () {
      document.getElementById("rows").innerHTML =
        '<tr><td colspan="6" class="fgb-empty">加载失败</td></tr>';
    });
  });

  tabsEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-combo]");
    if (!btn) return;
    var id = btn.getAttribute("data-combo") || "";
    if (!id || id === selectedComboId) return;
    loadBoard(selectedDate, id).catch(function () {
      document.getElementById("rows").innerHTML =
        '<tr><td colspan="6" class="fgb-empty">加载失败</td></tr>';
    });
  });

  var initialDate = "";
  try {
    initialDate = new URLSearchParams(window.location.search).get("date") || "";
  } catch (e) { initialDate = ""; }

  loadBoard(initialDate, "").catch(function () {
    document.getElementById("rows").innerHTML =
      '<tr><td colspan="6" class="fgb-empty">加载失败</td></tr>';
  });
})();
</script>
</body>
</html>
