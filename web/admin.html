<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理 · 家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
<style>
main { max-width: 720px; }
h1 { font-family: var(--display); font-size: 1.75rem; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 12px; font-size: 1.1rem; font-family: var(--display); }
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
input, select {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font: inherit;
  margin-bottom: 12px;
  background: rgba(0, 0, 0, 0.25);
  color: var(--ink);
}
button, .btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 14px;
  font: inherit;
  font-weight: 600;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  cursor: pointer;
}
button.ghost, .btn.ghost {
  background: rgba(255, 255, 255, 0.04);
  color: var(--accent);
  border: 1px solid var(--line);
}
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--danger); font-size: .85rem; min-height: 1.2em; margin-bottom: 8px; }
.stage {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.stage:last-child { border-bottom: 0; }
.stage select { width: auto; margin: 0; min-width: 100px; }
.stage .title { flex: 1; min-width: 120px; font-weight: 600; }
.meta { color: var(--muted); font-size: .85rem; }
.hidden { display: none !important; }
a.link { color: var(--accent); }
ul.hist { margin: 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button {
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);
  border: 1px solid var(--line);
}
.tabs button.active {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #062016;
  border-color: transparent;
}
.diff-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
.diff-table th, .diff-table td {
  border: 1px solid var(--line);
  padding: 6px 8px;
  text-align: left;
  vertical-align: middle;
}
.diff-table th { background: rgba(62, 207, 142, 0.1); white-space: nowrap; }
.diff-table input[type="text"], .diff-table input[type="number"] {
  width: 100%;
  margin: 0;
  padding: 6px 8px;
}
.diff-table input[type="checkbox"] { width: auto; margin: 0; }
.cuts-row input { width: 72px; margin: 0 4px 0 0; display: inline-block; }
</style>
</head>
<body>
<main class="fgb-shell">
  <header class="fgb-topbar">
    <div>
      <a class="fgb-brand" href="/">家庭<em>游戏盒</em></a>
      <span class="fgb-page-kicker">管理</span>
    </div>
    <div class="fgb-nav">
      <a class="fgb-nav-link" href="/">回大厅</a>
    </div>
  </header>
  <h1>管理</h1>
  <p class="lead">每日挑战模板、难度参数与今日组合。</p>

  <div id="auth-card" class="card">
    <h2 id="auth-title">登录</h2>
    <div class="err" id="auth-err"></div>
    <div id="setup-fields" class="hidden">
      <label for="pw1">设置管理员密码</label>
      <input id="pw1" type="password" autocomplete="new-password">
      <label for="pw2">再输入一次</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <button type="button" id="btn-setup">保存并进入</button>
    </div>
    <div id="login-fields" class="hidden">
      <label for="pw-login">管理员密码</label>
      <input id="pw-login" type="password" autocomplete="current-password">
      <button type="button" id="btn-login">登录</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="row" style="justify-content:space-between; margin-bottom:8px">
      <div class="tabs" id="main-tabs">
        <button type="button" class="active" data-tab="daily">每日挑战</button>
        <button type="button" data-tab="diff">难度参数</button>
      </div>
      <button type="button" class="ghost" id="btn-logout">登出</button>
    </div>

    <div id="tab-daily">
      <div class="card">
        <h2>挑战模板</h2>
        <p class="meta">保存只改模板，不会立刻重生成今日挑战。</p>
        <div class="err" id="tpl-err"></div>
        <div id="stage-list"></div>
        <div class="row" style="margin-top:12px">
          <select id="add-game"></select>
          <button type="button" class="ghost" id="btn-add">添加游戏</button>
          <button type="button" id="btn-save-tpl">保存模板</button>
        </div>
      </div>

      <div class="card">
        <h2>今日组合</h2>
        <div class="err" id="combo-err"></div>
        <div id="combo-view" class="meta">加载中…</div>
        <div class="row" style="margin-top:12px">
          <button type="button" id="btn-regen">重新生成今日挑战</button>
        </div>
      </div>

      <div class="card">
        <h2>历史组合（最近 20）</h2>
        <ul class="hist" id="hist-list"></ul>
      </div>
    </div>

    <div id="tab-diff" class="hidden">
      <div class="card">
        <h2>难度参数</h2>
        <p class="meta">大厅与每日挑战共用。保存后仅对新开局生效。</p>
        <div class="err" id="diff-err"></div>
        <label for="diff-game">游戏</label>
        <select id="diff-game"></select>
        <div id="cuts-wrap" class="hidden">
          <label>分位 cuts（6 项，末项 ≥ 1）</label>
          <div class="cuts-row" id="cuts-inputs"></div>
        </div>
        <div id="diff-form"></div>
        <div class="row" style="margin-top:12px">
          <button type="button" id="btn-save-diff">保存本游戏</button>
          <button type="button" class="ghost" id="btn-reset-diff">恢复本游戏默认</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="/js/fgb-ui.js"></script>
<script>
(function () {
  var TOKEN_KEY = "fgb_admin_token";
  var TIERS = ["intro", "simple", "normal", "hard", "master", "god"];
  var TIER_LABELS = { intro: "入门", simple: "简单", normal: "普通", hard: "困难", master: "大师", god: "大神" };
  var DIFF_GAMES = [
    { id: "24points", title: "24点" },
    { id: "schulte", title: "舒尔特方格" },
    { id: "stroop", title: "色词干扰" },
    { id: "cancel", title: "划消测验" },
    { id: "simon", title: "西蒙记忆" },
    { id: "spot-diff", title: "找不同" },
    { id: "maze", title: "迷宫" },
    { id: "sudoku", title: "数独" },
  ];
  var FIELD_SCHEMA = {
    schulte: [
      { key: "size", type: "number", label: "size" },
      { key: "reverse", type: "bool", label: "reverse" },
      { key: "label", type: "text", label: "label" },
    ],
    sudoku: [
      { key: "size", type: "number", label: "size" },
      { key: "givens", type: "number", label: "givens" },
      { key: "label", type: "text", label: "label" },
    ],
    stroop: [
      { key: "trialLimit", type: "number", label: "trialLimit" },
      { key: "timeLimitMs", type: "number", label: "timeLimitMs" },
      { key: "congruentRate", type: "number", label: "congruentRate", step: "0.01" },
      { key: "label", type: "text", label: "label" },
    ],
    cancel: [
      { key: "size", type: "number", label: "size" },
      { key: "pct", type: "number", label: "pct", step: "0.01" },
      { key: "label", type: "text", label: "label" },
    ],
    simon: [
      { key: "trials", type: "number", label: "trials" },
      { key: "label", type: "text", label: "label" },
    ],
    "spot-diff": [
      { key: "n", type: "number", label: "n" },
      { key: "diffs", type: "number", label: "diffs" },
      { key: "label", type: "text", label: "label" },
    ],
    maze: [
      { key: "size", type: "number", label: "size" },
      { key: "label", type: "text", label: "label" },
    ],
    "24points": [
      { key: "minNum", type: "number", label: "minNum" },
      { key: "maxNum", type: "number", label: "maxNum" },
      { key: "label", type: "text", label: "label" },
      { key: "desc", type: "text", label: "desc" },
    ],
  };
  var GAMES = [];
  var stages = [];
  var diffData = null;
  var currentTab = "daily";

  function token() { return sessionStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) {
    if (t) sessionStorage.setItem(TOKEN_KEY, t);
    else sessionStorage.removeItem(TOKEN_KEY);
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (opts.admin) headers["X-Admin-Token"] = token();
    var url = (window.FGB && FGB.url) ? FGB.url(path) : path;
    return fetch(url, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          var err = new Error((data && data.detail) || res.statusText || "request failed");
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function showAuth(hasPassword) {
    document.getElementById("auth-card").classList.remove("hidden");
    document.getElementById("panel").classList.add("hidden");
    document.getElementById("setup-fields").classList.toggle("hidden", hasPassword);
    document.getElementById("login-fields").classList.toggle("hidden", !hasPassword);
    document.getElementById("auth-title").textContent = hasPassword ? "登录" : "首次设置密码";
  }

  function showPanel() {
    document.getElementById("auth-card").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    switchTab(currentTab);
    loadPanel();
  }

  function switchTab(name) {
    currentTab = name;
    document.getElementById("tab-daily").classList.toggle("hidden", name !== "daily");
    document.getElementById("tab-diff").classList.toggle("hidden", name !== "diff");
    Array.prototype.forEach.call(document.querySelectorAll("#main-tabs button"), function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === name);
    });
    if (name === "diff") loadDifficultyPanel();
  }

  function gameTitle(id) {
    for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i].title;
    for (var j = 0; j < DIFF_GAMES.length; j++) if (DIFF_GAMES[j].id === id) return DIFF_GAMES[j].title;
    return id;
  }

  function renderStages() {
    var box = document.getElementById("stage-list");
    box.innerHTML = "";
    stages.forEach(function (s, idx) {
      var row = document.createElement("div");
      row.className = "stage";
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = (idx + 1) + ". " + gameTitle(s.gameId);
      var sel = document.createElement("select");
      TIERS.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t;
        o.textContent = TIER_LABELS[t] || t;
        if (t === s.tier) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { stages[idx].tier = sel.value; });
      var up = document.createElement("button");
      up.type = "button"; up.className = "ghost"; up.textContent = "上移";
      up.disabled = idx === 0;
      up.addEventListener("click", function () {
        if (idx === 0) return;
        var tmp = stages[idx - 1]; stages[idx - 1] = stages[idx]; stages[idx] = tmp;
        renderStages();
      });
      var down = document.createElement("button");
      down.type = "button"; down.className = "ghost"; down.textContent = "下移";
      down.disabled = idx === stages.length - 1;
      down.addEventListener("click", function () {
        if (idx >= stages.length - 1) return;
        var tmp = stages[idx + 1]; stages[idx + 1] = stages[idx]; stages[idx] = tmp;
        renderStages();
      });
      var del = document.createElement("button");
      del.type = "button"; del.className = "ghost"; del.textContent = "删除";
      del.addEventListener("click", function () {
        stages.splice(idx, 1);
        renderStages();
      });
      row.appendChild(title);
      row.appendChild(sel);
      row.appendChild(up);
      row.appendChild(down);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function fillAddGames() {
    var sel = document.getElementById("add-game");
    sel.innerHTML = "";
    GAMES.forEach(function (g) {
      if (g.extra && g.extra.kind === "reference") return;
      var o = document.createElement("option");
      o.value = g.id;
      o.textContent = g.title;
      sel.appendChild(o);
    });
  }

  function fillDiffGames() {
    var sel = document.getElementById("diff-game");
    var prev = sel.value;
    sel.innerHTML = "";
    DIFF_GAMES.forEach(function (g) {
      var o = document.createElement("option");
      o.value = g.id;
      o.textContent = g.title;
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  }

  function renderDiffForm() {
    var gid = document.getElementById("diff-game").value;
    var err = document.getElementById("diff-err");
    err.textContent = "";
    err.style.color = "";
    var game = diffData && diffData.games && diffData.games[gid];
    if (!game) {
      document.getElementById("diff-form").innerHTML = "<p class='meta'>无数据</p>";
      document.getElementById("cuts-wrap").classList.add("hidden");
      return;
    }
    var schema = FIELD_SCHEMA[gid] || [];
    var cutsWrap = document.getElementById("cuts-wrap");
    var cutsBox = document.getElementById("cuts-inputs");
    if (gid === "24points") {
      cutsWrap.classList.remove("hidden");
      cutsBox.innerHTML = "";
      var cuts = game.cuts || [0.12, 0.28, 0.5, 0.72, 0.88, 1.01];
      for (var i = 0; i < 6; i++) {
        var inp = document.createElement("input");
        inp.type = "number";
        inp.step = "0.01";
        inp.value = cuts[i];
        inp.setAttribute("data-cut", String(i));
        cutsBox.appendChild(inp);
      }
    } else {
      cutsWrap.classList.add("hidden");
      cutsBox.innerHTML = "";
    }

    var table = document.createElement("table");
    table.className = "diff-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    hr.appendChild(document.createElement("th")).textContent = "档位";
    schema.forEach(function (f) {
      var th = document.createElement("th");
      th.textContent = f.label;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    TIERS.forEach(function (tid) {
      var tier = (game.tiers && game.tiers[tid]) || {};
      var tr = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.textContent = TIER_LABELS[tid] || tid;
      tr.appendChild(td0);
      schema.forEach(function (f) {
        var td = document.createElement("td");
        if (f.type === "bool") {
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!tier[f.key];
          cb.setAttribute("data-tier", tid);
          cb.setAttribute("data-key", f.key);
          cb.setAttribute("data-type", "bool");
          td.appendChild(cb);
        } else {
          var inp = document.createElement("input");
          inp.type = f.type === "number" ? "number" : "text";
          if (f.step) inp.step = f.step;
          var v = tier[f.key];
          inp.value = v === undefined || v === null ? "" : v;
          inp.setAttribute("data-tier", tid);
          inp.setAttribute("data-key", f.key);
          inp.setAttribute("data-type", f.type);
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    var box = document.getElementById("diff-form");
    box.innerHTML = "";
    box.appendChild(table);
  }

  function collectDiffPayload() {
    var gid = document.getElementById("diff-game").value;
    var schema = FIELD_SCHEMA[gid] || [];
    var tiers = {};
    TIERS.forEach(function (tid) {
      tiers[tid] = {};
      schema.forEach(function (f) {
        var el = document.querySelector(
          '#diff-form [data-tier="' + tid + '"][data-key="' + f.key + '"]'
        );
        if (!el) return;
        if (f.type === "bool") tiers[tid][f.key] = !!el.checked;
        else if (f.type === "number") {
          var n = Number(el.value);
          tiers[tid][f.key] = isNaN(n) ? el.value : n;
        } else tiers[tid][f.key] = el.value;
      });
    });
    var payload = { tiers: tiers };
    if (gid === "24points") {
      var cuts = [];
      Array.prototype.forEach.call(document.querySelectorAll("#cuts-inputs input"), function (inp) {
        cuts.push(Number(inp.value));
      });
      payload.cuts = cuts;
    }
    return { gameId: gid, games: (function () {
      var o = {};
      o[gid] = payload;
      return o;
    })() };
  }

  function loadDifficultyPanel() {
    fillDiffGames();
    api("/api/v1/difficulty", { admin: true }).then(function (data) {
      diffData = data;
      renderDiffForm();
    }).catch(function (err) {
      document.getElementById("diff-err").textContent = err.message || "加载失败";
      if (err.status === 401) {
        setToken("");
        boot();
      }
    });
  }

  function loadPanel() {
    Promise.all([
      api("/api/v1/games"),
      api("/api/v1/admin/daily/template", { admin: true }),
      api("/api/v1/daily/today"),
      api("/api/v1/admin/daily/history", { admin: true }),
    ]).then(function (arr) {
      GAMES = arr[0].games || [];
      stages = (arr[1].stages || []).map(function (s) {
        return { gameId: s.gameId, tier: s.tier };
      });
      fillAddGames();
      renderStages();
      var combo = arr[2];
      var lines = ["日期 " + combo.date + " · " + combo.source + " · " + combo.comboId];
      (combo.stages || []).forEach(function (s, i) {
        lines.push((i + 1) + ". " + s.title + " · " + (s.tierLabel || s.tier) + " · seed " + s.seed);
      });
      document.getElementById("combo-view").textContent = lines.join("\n");
      var ul = document.getElementById("hist-list");
      ul.innerHTML = "";
      (arr[3].history || []).forEach(function (h) {
        var li = document.createElement("li");
        li.textContent = h.date + " · " + (h.source || "") + " · " + (h.stages || []).length + " 关 · " + h.comboId;
        ul.appendChild(li);
      });
      if (!(arr[3].history || []).length) {
        var empty = document.createElement("li");
        empty.textContent = "暂无";
        ul.appendChild(empty);
      }
      if (currentTab === "diff") loadDifficultyPanel();
    }).catch(function (err) {
      document.getElementById("tpl-err").textContent = err.message || "加载失败";
      if (err.status === 401) {
        setToken("");
        boot();
      }
    });
  }

  function boot() {
    api("/api/v1/admin/status", { headers: { "X-Admin-Token": token() } }).then(function (st) {
      if (st.authenticated) showPanel();
      else showAuth(!!st.hasPassword);
    }).catch(function () { showAuth(false); });
  }

  Array.prototype.forEach.call(document.querySelectorAll("#main-tabs button"), function (btn) {
    btn.addEventListener("click", function () {
      switchTab(btn.getAttribute("data-tab"));
    });
  });

  document.getElementById("diff-game").addEventListener("change", function () {
    if (diffData) renderDiffForm();
    else loadDifficultyPanel();
  });

  document.getElementById("btn-save-diff").addEventListener("click", function () {
    var err = document.getElementById("diff-err");
    err.textContent = "";
    err.style.color = "";
    var packed = collectDiffPayload();
    api("/api/v1/admin/difficulty", {
      method: "PUT",
      admin: true,
      body: { games: packed.games },
    }).then(function (data) {
      diffData = data;
      renderDiffForm();
      err.style.color = "var(--accent)";
      err.textContent = "已保存";
      setTimeout(function () { err.textContent = ""; err.style.color = ""; }, 1500);
    }).catch(function (e) {
      err.style.color = "";
      err.textContent = e.message || "保存失败";
    });
  });

  document.getElementById("btn-reset-diff").addEventListener("click", function () {
    var gid = document.getElementById("diff-game").value;
    FGBUI.askConfirm("恢复「" + gameTitle(gid) + "」到出厂默认？", function () {
      var err = document.getElementById("diff-err");
      err.textContent = "";
      api("/api/v1/admin/difficulty/reset", {
        method: "POST",
        admin: true,
        body: { gameId: gid },
      }).then(function () {
        return api("/api/v1/difficulty");
      }).then(function (data) {
        diffData = data;
        renderDiffForm();
        err.style.color = "var(--accent)";
        err.textContent = "已恢复默认";
        setTimeout(function () { err.textContent = ""; err.style.color = ""; }, 1500);
      }).catch(function (e) {
        err.style.color = "";
        err.textContent = e.message || "恢复失败";
      });
    });
  });

  document.getElementById("btn-setup").addEventListener("click", function () {
    var err = document.getElementById("auth-err");
    err.textContent = "";
    var a = document.getElementById("pw1").value;
    var b = document.getElementById("pw2").value;
    if (!a || a.length < 4) { err.textContent = "密码至少 4 位"; return; }
    if (a !== b) { err.textContent = "两次密码不一致"; return; }
    api("/api/v1/admin/setup", { method: "POST", body: { password: a } }).then(function (data) {
      setToken(data.token);
      showPanel();
    }).catch(function (e) { err.textContent = e.message || "设置失败"; });
  });

  document.getElementById("btn-login").addEventListener("click", function () {
    var err = document.getElementById("auth-err");
    err.textContent = "";
    api("/api/v1/admin/login", { method: "POST", body: { password: document.getElementById("pw-login").value } }).then(function (data) {
      setToken(data.token);
      showPanel();
    }).catch(function (e) { err.textContent = e.message || "登录失败"; });
  });

  document.getElementById("btn-logout").addEventListener("click", function () {
    api("/api/v1/admin/logout", { method: "POST", admin: true }).finally(function () {
      setToken("");
      boot();
    });
  });

  document.getElementById("btn-add").addEventListener("click", function () {
    var id = document.getElementById("add-game").value;
    if (!id) return;
    stages.push({ gameId: id, tier: "normal" });
    renderStages();
  });

  document.getElementById("btn-save-tpl").addEventListener("click", function () {
    var err = document.getElementById("tpl-err");
    err.textContent = "";
    api("/api/v1/admin/daily/template", {
      method: "PUT",
      admin: true,
      body: { stages: stages },
    }).then(function () {
      err.textContent = "";
      err.style.color = "var(--accent)";
      err.textContent = "已保存";
      setTimeout(function () { err.textContent = ""; err.style.color = ""; }, 1500);
    }).catch(function (e) {
      err.style.color = "";
      err.textContent = e.message || "保存失败";
    });
  });

  document.getElementById("btn-regen").addEventListener("click", function () {
    FGBUI.askConfirm("重新生成今日挑战？旧组合会进入历史，成绩不会清空。", function () {
      var err = document.getElementById("combo-err");
      err.textContent = "";
      api("/api/v1/admin/daily/regenerate", { method: "POST", admin: true }).then(function () {
        loadPanel();
      }).catch(function (e) { err.textContent = e.message || "重生成失败"; });
    });
  });

  boot();
})();
</script>
</body>
</html>
