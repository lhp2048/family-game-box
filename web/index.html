<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a09">
<title>家庭游戏盒</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
</head>
<body class="fgb-console">
<div class="fgb-console-bezel" aria-hidden="true"></div>
<main class="fgb-shell fgb-console-shell">
  <header id="fgb-topbar" class="fgb-console-topbar"></header>

  <section class="fgb-console-hero" aria-label="客厅游戏盒">
    <div class="fgb-console-hero-copy">
      <p class="fgb-console-eyebrow">客厅 · 家庭游戏盒</p>
      <h1 class="fgb-console-title">一起开玩</h1>
      <p class="fgb-console-tagline">每日挑战冲榜，自由训练练手 — 大屏也好点，孩子也好找。</p>
    </div>
    <div class="fgb-console-status" aria-label="状态">
      <span class="fgb-console-led" title="在线"></span>
      <time class="fgb-console-clock" id="console-clock" aria-live="polite">--:--</time>
    </div>
  </section>

  <section class="fgb-console-hud" id="stat-strip" aria-label="我的战绩">
    <div class="fgb-hud-tile">
      <span class="fgb-hud-label">专注力名次</span>
      <span class="fgb-hud-value" id="stat-rank">—</span>
    </div>
    <div class="fgb-hud-tile">
      <span class="fgb-hud-label">语文名次</span>
      <span class="fgb-hud-value" id="stat-yuwen">—</span>
    </div>
    <div class="fgb-hud-tile">
      <span class="fgb-hud-label">最近一局</span>
      <span class="fgb-hud-value fgb-hud-value-sm" id="stat-recent">—</span>
    </div>
  </section>

  <section class="fgb-console-spotlight" aria-label="今日挑战">
    <header class="fgb-shelf-head">
      <h2 class="fgb-shelf-title">今日挑战</h2>
      <p class="fgb-shelf-sub">每天一局，全家一起冲榜</p>
    </header>
    <div class="fgb-spotlight-row">
      <a class="fgb-spotlight fgb-spotlight-daily" href="/daily" id="daily-card">
        <span class="fgb-spotlight-badge">专注力</span>
        <h3>每日专注力挑战</h3>
        <p id="daily-progress">加载中…</p>
        <span class="fgb-spotlight-cta" id="daily-cta">开始挑战</span>
      </a>
      <aside class="fgb-spotlight-side fgb-panel fgb-panel-pad">
        <h3 class="fgb-shelf-mini-title">专注力挑战榜</h3>
        <ol class="fgb-podium-list" id="podium-list"></ol>
        <a class="fgb-nav-link fgb-shelf-link" href="/daily/leaderboard">完整榜 →</a>
      </aside>
    </div>
    <div class="fgb-spotlight-row">
      <a class="fgb-spotlight fgb-spotlight-yuwen" href="/yuwen-daily" id="yuwen-daily-card">
        <span class="fgb-spotlight-badge">语文</span>
        <h3>每日语文挑战</h3>
        <p id="yuwen-progress">加载中…</p>
        <span class="fgb-spotlight-cta" id="yuwen-cta">开始挑战</span>
      </a>
      <aside class="fgb-spotlight-side fgb-panel fgb-panel-pad">
        <h3 class="fgb-shelf-mini-title">语文挑战榜</h3>
        <ol class="fgb-podium-list" id="yuwen-podium"></ol>
        <a class="fgb-nav-link fgb-shelf-link" href="/yuwen-daily/leaderboard">完整榜 →</a>
      </aside>
    </div>
  </section>

  <section class="fgb-console-shelf" aria-label="游戏库">
    <header class="fgb-shelf-head">
      <h2 class="fgb-shelf-title">游戏库</h2>
      <p class="fgb-shelf-sub">全部游戏一览 · 点封面即开玩（方向键可切换焦点）</p>
    </header>
    <div id="game-list" class="fgb-shelf-row" role="list"></div>
  </section>

  <p class="fgb-footer-link"><a href="/admin">管理</a></p>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script src="/js/fgb-home.js"></script>
<script>
(function () {
  var list = document.getElementById("game-list");

  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    title: "主页",
    showUser: true,
    console: true,
  });

  if (window.FGBHome && FGBHome.mountClock) {
    FGBHome.mountClock(document.getElementById("console-clock"));
  }

  var topNav = document.querySelector("#fgb-topbar .fgb-nav");
  if (topNav) {
    [
      { href: "/daily/leaderboard", label: "专注力榜" },
      { href: "/yuwen-daily/leaderboard", label: "语文榜" },
      { href: "/leaderboard", label: "排行榜" },
    ].forEach(function (item) {
      var a = document.createElement("a");
      a.className = "fgb-nav-link fgb-nav-pill";
      a.href = FGB.url(item.href);
      a.textContent = item.label;
      topNav.appendChild(a);
    });
  }

  function renderGames(games) {
    if (window.FGBHome && FGBHome.renderGameShelf) {
      FGBHome.renderGameShelf(list, games);
      return;
    }
  }

  function maybeOfferClaim(me) {
    if (!me || !me.loggedIn || !me.claimAvailable) return;
    if (sessionStorage.getItem("fgb_claim_declined") === "1") return;
    if (typeof FGBUI === "undefined" || !FGBUI.askConfirm) return;
    FGBUI.askConfirm("本机有未认领的旧成绩，是否认领到当前账号？", function () {
      FGB.claimTerminal().then(function () {
        if (FGBUI.toast) FGBUI.toast("已认领本机旧成绩", "ok");
        refreshSummary();
      }).catch(function (err) {
        if (FGBUI.toast) FGBUI.toast((err && err.message) || "认领失败", "err");
      });
    }, function () {
      sessionStorage.setItem("fgb_claim_declined", "1");
    });
  }

  function renderSummary(s) {
    if (!s) return;
    var me = s.me || {};
    document.getElementById("stat-rank").textContent = me.dailyRank ? ("#" + me.dailyRank) : "未上榜";
    var yuwen = s.yuwenDaily || {};
    document.getElementById("stat-yuwen").textContent = yuwen.rank ? ("#" + yuwen.rank) : "未上榜";
    var recent = s.recent;
    document.getElementById("stat-recent").textContent = recent
      ? ((recent.gameTitle || "") + " · " + (recent.display || ""))
      : "暂无";
    document.getElementById("daily-progress").textContent = (s.daily && s.daily.myProgressLabel) || "—";
    var cta = document.getElementById("daily-cta");
    var c = (s.daily && s.daily.cta) || "start";
    cta.textContent = c === "view" ? "查看挑战" : (c === "continue" ? "继续挑战" : "开始挑战");
    var ol = document.getElementById("podium-list");
    ol.innerHTML = "";
    var podium = s.podium || [];
    if (!podium.length) {
      ol.innerHTML = "<li style=\"color:var(--muted)\">还没有成绩，去做每日专注力挑战吧</li>";
    } else {
      podium.forEach(function (p) {
        var li = document.createElement("li");
        var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
        var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
        var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
        var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
        li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
        ol.appendChild(li);
      });
    }
    var yol = document.getElementById("yuwen-podium");
    yol.innerHTML = "";
    document.getElementById("yuwen-progress").textContent = yuwen.myProgressLabel || "—";
    var yc = document.getElementById("yuwen-cta");
    var ycta = yuwen.cta || "start";
    yc.textContent = ycta === "view" ? "查看成绩" : (ycta === "continue" ? "继续挑战" : "开始挑战");
    var ypodium = s.yuwenPodium || [];
    if (!ypodium.length) {
      yol.innerHTML = "<li style=\"color:var(--muted)\">还没有成绩，去做每日语文挑战吧</li>";
      return;
    }
    ypodium.forEach(function (p) {
      var li = document.createElement("li");
      var medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
      var titles = { 1: "冠军", 2: "亚军", 3: "季军" };
      var medal = medals[p.rank] ? ('<span class="medal">' + medals[p.rank] + "</span>") : "";
      var title = titles[p.rank] ? (titles[p.rank] + " · ") : (p.rank + ". ");
      li.innerHTML = "<span>" + medal + title + (p.nickname || "—") + "</span><span>" + (p.display || "") + "</span>";
      yol.appendChild(li);
    });
  }

  function refreshSummary() {
    return FGB.loadLobbySummary().then(renderSummary);
  }

  FGB.authMe().then(function (me) {
    if (me && me.loggedIn) {
      return FGB.ensureTerminalFromUser(me.username).then(function () {
        return FGB.authMe().then(function (me2) {
          maybeOfferClaim(me2 || me);
        });
      }).catch(function () {
        maybeOfferClaim(me);
      });
    }
  }).catch(function () {
    /* guest: hall stays public */
  }).then(refreshSummary);

  fetch(FGB.url("/api/v1/games")).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!data || !data.games) return;
    renderGames(data.games);
  }).catch(function () {});
})();
</script>
</body>
</html>
