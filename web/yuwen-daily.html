<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日语文挑战 · MX游戏盒子</title>
<link rel="stylesheet" href="/css/fgb-theme.css">
<link rel="stylesheet" href="/games/yuwen/play.css">
</head>
<body class="fgb-console">
<div class="fgb-console-bezel" aria-hidden="true"></div>
<main class="fgb-shell fgb-console-shell yuwen">
  <header id="fgb-topbar"></header>
  <p class="yuwen-lead" id="lead">今天全家人同一份卷子。答错一题，用时加 5 秒。第一次交卷记入语文挑战榜。</p>
  <p class="yuwen-err" id="err"></p>
  <section id="view-prep"></section>
  <section id="view-play" hidden></section>
  <section id="view-result" hidden></section>
</main>
<script src="/js/fgb-client.js"></script>
<script src="/js/fgb-ui.js"></script>
<script src="/js/fgb-shell.js"></script>
<script>
(function () {
  FGBShell.mountTopbar(document.getElementById("fgb-topbar"), {
    title: "每日语文挑战",
    showBack: true,
    backHref: "/",
    showUser: true,
  });
  var topNav = document.querySelector("#fgb-topbar .fgb-nav");
  if (topNav) {
    var a = document.createElement("a");
    a.className = "fgb-nav-link";
    a.href = FGB.url("/yuwen-daily/leaderboard");
    a.textContent = "语文挑战榜";
    topNav.appendChild(a);
  }
})();
</script>
<script src="/js/yuwen-daily.js"></script>
</body>
</html>
